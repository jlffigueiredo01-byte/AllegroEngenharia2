<script>
/* ═══════════════════════════════════════════════════════════════
   ACTION CARDS — Kanban UI
   Kanban Jira-like: OPEN | IN_PROGRESS | FINISHED+CANCELLED
   Drag-and-drop nativo HTML5. Modais inline. ES5 compatível.
═══════════════════════════════════════════════════════════════ */

var _acCards = [];
var _acUsers = [];
var _acDragId = null;
var _acFilterUserId = ''; // FB-15: filtro de cards por usuario (vazio = todos)

var _AC_STATUS_LABELS = {
  'ABERTO':        'Aberto',
  'EM_ANDAMENTO':  'Em andamento',
  'CONCLUIDO':     'Concluído',
  'CANCELADO':     'Cancelado',
  'SLA_ESTOURADO': 'SLA Estourado'
};

var _AC_TRANSITIONS = {
  'ABERTO':        ['EM_ANDAMENTO', 'CANCELADO'],
  'EM_ANDAMENTO':  ['ABERTO', 'CONCLUIDO', 'CANCELADO'],
  'CONCLUIDO':     [],
  'CANCELADO':     [],
  'SLA_ESTOURADO': ['EM_ANDAMENTO', 'CANCELADO']
};

/* ── Entrada principal ── */
function renderActionCards(area) {
  area.innerHTML =
    '<div class="page-header" style="display:flex;align-items:center;justify-content:space-between;">' +
      '<div class="page-header-left">' +
        '<h1 class="page-title">🗂 Action Cards</h1>' +
        '<p class="page-subtitle">Kanban da equipe — tarefas, follow-ups e ações internas.</p>' +
      '</div>' +
      '<button class="sga-btn sga-btn--primary" onclick="_openNewCardModal()">+ Novo Card</button>' +
    '</div>' +
    '<div id="ac-workload" style="margin-bottom:20px;"></div>' +
    '<div id="ac-kanban" class="ac-kanban-board"></div>';
  _loadAcData();
}

/* ── Carregamento de dados (paralelo) ── */
function _loadAcData() {
  var kanban = document.getElementById('ac-kanban');
  if (kanban && window.SGA && SGA.skeleton) SGA.skeleton(kanban, { type: 'list', count: 6 });
  var pending = 2;
  function check() { if (--pending === 0) _refreshBoard(); }
  google.script.run
    .withSuccessHandler(function(r) { _acCards = (r && r.ok) ? (r.data || []) : []; check(); })
    .withFailureHandler(function()   { _acCards = []; check(); })
    .Api_acGetAll();
  google.script.run
    .withSuccessHandler(function(r) { _acUsers = (r && r.ok) ? (r.data || []) : []; check(); })
    .withFailureHandler(function()   { _acUsers = []; check(); })
    .Api_acGetActiveUsers();
}

function _refreshBoard() {
  _renderWorkload();
  _renderKanban();
}

/* ── Barra de carga da equipe (FB-15: badges clicaveis filtram o board) ── */
function _renderWorkload() {
  var el = document.getElementById('ac-workload');
  if (!el || !_acUsers.length) { if (el) el.innerHTML = ''; return; }
  var html = '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">' +
    '<span style="font-size:var(--sga-font-size-xs);font-weight:700;color:var(--sga-text-muted);text-transform:uppercase;letter-spacing:.05em;margin-right:4px;">Carga da equipe:</span>';
  // Botao "Todos" pra limpar o filtro
  var totN = 0;
  for (var t = 0; t < _acCards.length; t++) {
    if ((_acCards[t].status === 'ABERTO' || _acCards[t].status === 'EM_ANDAMENTO') && !_acEhFollowup(_acCards[t])) totN++;
  }
  var todosActive = !_acFilterUserId;
  html += '<button type="button" onclick="_acSetFilter(\'\')" ' +
    'style="background:' + (todosActive ? 'var(--sga-color-primary-dark)' : 'var(--sga-border-default)') + ';color:' + (todosActive ? 'var(--sga-text-on-primary)' : 'var(--sga-text-default)') + ';' +
    'border:0;cursor:pointer;border-radius:var(--sga-radius-pill);padding:3px 12px;font-size:var(--sga-font-size-sm);font-weight:600;">' +
    'Todos · ' + totN + '</button>';
  for (var i = 0; i < _acUsers.length; i++) {
    var u = _acUsers[i];
    var n = 0;
    for (var j = 0; j < _acCards.length; j++) {
      var c = _acCards[j];
      if (c.assigned_to === u.id && (c.status === 'ABERTO' || c.status === 'EM_ANDAMENTO') && !_acEhFollowup(c)) n++;
    }
    var bg    = n <= 2 ? 'var(--sga-color-success-bg)' : n <= 4 ? 'var(--sga-color-warning-bg)' : 'var(--sga-color-danger-bg)';
    var color = n <= 2 ? 'var(--sga-color-success)' : n <= 4 ? 'var(--sga-color-warning)' : 'var(--sga-color-danger)';
    var active = _acFilterUserId === u.id;
    var border = active ? '2px solid var(--sga-color-primary-dark)' : '2px solid transparent';
    html += '<button type="button" onclick="_acSetFilter(\'' + escapeHtml(u.id) + '\')" ' +
      'title="Clique para filtrar action cards de ' + escapeHtml(u.name) + '" ' +
      'style="background:' + bg + ';color:' + color + ';border:' + border + ';cursor:pointer;' +
      'border-radius:var(--sga-radius-pill);padding:3px 12px;font-size:var(--sga-font-size-sm);font-weight:600;">' +
      escapeHtml(u.name) + ' · ' + n + '</button>';
  }
  html += '</div>';
  // Aviso de filtro ativo
  if (_acFilterUserId) {
    var uname = '';
    for (var k = 0; k < _acUsers.length; k++) if (_acUsers[k].id === _acFilterUserId) uname = _acUsers[k].name;
    html += '<div style="font-size:var(--sga-font-size-sm);color:var(--sga-text-muted);margin-top:6px;">' +
      '🔎 Mostrando apenas action cards de <b>' + escapeHtml(uname) + '</b>. ' +
      '<a href="#" onclick="event.preventDefault();_acSetFilter(\'\')" style="color:var(--sga-color-primary-dark)">limpar filtro</a></div>';
  }
  el.innerHTML = html;
}

/* FB-15: muda o filtro de usuario e re-renderiza o board. */
function _acSetFilter(userId) {
  _acFilterUserId = userId || '';
  _refreshBoard();
}

/* FB-15: aplica filtro ao array de cards (chamado antes do render do board). */
function _acFiltrarPorUsuario(cards) {
  if (!_acFilterUserId) return cards;
  var out = [];
  for (var i = 0; i < cards.length; i++) {
    if (cards[i].assigned_to === _acFilterUserId) out.push(cards[i]);
  }
  return out;
}

/* ── Board Kanban ── */
// FB-34: cards de follow-up poluíam o kanban — agora ficam só no aviso do Dashboard
// ("Sem follow-up há Xd"). Esconde tipos FOLLOWUP/FOLLOWUP_ENVIADA/FOLLOWUP_RECUSADA.
function _acEhFollowup(c) { return !!(c && /^FOLLOWUP/i.test(String(c.tipo || ''))); }

function _renderKanban() {
  var el = document.getElementById('ac-kanban');
  if (!el) return;
  // FB-15: filtro por usuário · FB-34: esconde follow-ups (vão pro Dashboard)
  var visiveis = _acFiltrarPorUsuario(_acCards).filter(function (c) { return !_acEhFollowup(c); });
  var open = [], inp = [], fin = [], can = [];
  for (var i = 0; i < visiveis.length; i++) {
    var c = visiveis[i];
    if      (c.status === 'ABERTO')       open.push(c);
    else if (c.status === 'EM_ANDAMENTO') inp.push(c);
    else if (c.status === 'CONCLUIDO')    fin.push(c);
    else if (c.status === 'CANCELADO')    can.push(c);
  }
  el.innerHTML =
    _acColumn('ABERTO',       'Aberto',       open, 'var(--sga-color-primary)', 'var(--sga-color-info-bg)') +
    _acColumn('EM_ANDAMENTO', 'Em andamento', inp,  'var(--sga-color-warning)', 'var(--sga-color-warning-bg)') +
    _acDoneColumn(fin, can);
  _acAttachDrop();
}

function _acColumn(status, label, cards, border, headBg) {
  var cardsHtml = '';
  if (!cards.length) {
    cardsHtml = '<div class="sga-empty sga-empty--compact" style="padding:14px 8px;gap:6px;">' +
      '<div class="sga-empty__icon">📌</div>' +
      '<h3 class="sga-empty__title" style="font-size:13px;">Nenhum card aqui</h3>' +
      '<p class="sga-empty__text" style="font-size:12px;">Arraste cards ou crie um novo.</p>' +
      '<button class="sga-btn sga-btn--ghost sga-btn--sm" type="button" onclick="_openNewCardModal&amp;&amp;_openNewCardModal()">+ Novo card</button>' +
    '</div>';
  } else {
    for (var i = 0; i < cards.length; i++) cardsHtml += _acCardHtml(cards[i]);
  }
  return '<div class="ac-col" data-col-status="' + status + '" ' +
    'style="flex:1;min-width:260px;background:var(--sga-bg-surface);border-radius:var(--sga-radius-md);' +
    'border-top:3px solid ' + border + ';box-shadow:var(--sga-shadow-sm);">' +
    '<div style="background:' + headBg + ';padding:12px 16px;border-radius:7px 7px 0 0;' +
    'display:flex;align-items:center;justify-content:space-between;">' +
    '<span style="font-weight:700;font-size:13px;">' + label + '</span>' +
    '<span class="sga-badge sga-badge--info">' + cards.length + '</span>' +
    '</div>' +
    '<div class="ac-col-body" data-col-status="' + status + '" ' +
    'style="padding:10px;display:flex;flex-direction:column;gap:8px;min-height:80px;">' +
    cardsHtml + '</div></div>';
}

function _acDoneColumn(fin, can) {
  var finHtml = _acDoneSection('CONCLUIDO', 'Concluído', fin, 'var(--sga-color-success)', 'var(--sga-color-success-bg)', 'var(--sga-color-success-bg)', 'sga-badge--success');
  var canHtml = _acDoneSection('CANCELADO', 'Cancelado', can, 'var(--sga-color-danger)', 'var(--sga-color-danger-bg)', 'var(--sga-color-danger-bg)', 'sga-badge--danger');
  return '<div style="flex:1;min-width:260px;display:flex;flex-direction:column;gap:12px;">' +
    finHtml + canHtml + '</div>';
}

function _acDoneSection(status, label, cards, border, headBg, colBg, badgeCls) {
  var slice = cards.slice().reverse().slice(0, 4);
  var rest  = cards.length > 4 ? cards.slice().reverse().slice(4) : [];
  var id    = 'ac-more-' + status.toLowerCase();
  var cardsHtml = '';
  for (var i = 0; i < slice.length; i++) cardsHtml += _acCardHtml(slice[i]);
  if (!cards.length) cardsHtml = '<div class="sga-empty sga-empty--compact" style="padding:10px 8px;gap:4px;">' +
    '<div class="sga-empty__icon" style="font-size:22px;">📌</div>' +
    '<p class="sga-empty__text" style="font-size:12px;">Nenhum card aqui ainda.</p>' +
  '</div>';
  var moreHtml = '';
  if (rest.length) {
    var restCards = '';
    for (var j = 0; j < rest.length; j++) restCards += _acCardHtml(rest[j]);
    moreHtml = '<div id="' + id + '" style="display:none;flex-direction:column;gap:8px;">' + restCards + '</div>' +
      '<button class="sga-btn sga-btn--ghost sga-btn--sm" style="margin-top:4px;" ' +
      'onclick="_acToggleMore(\'' + id + '\',this)">Ver mais (' + rest.length + ')</button>';
  }
  return '<div class="ac-col" data-col-status="' + status + '" ' +
    'style="background:' + colBg + ';border-radius:var(--sga-radius-md);border-top:3px solid ' + border + ';' +
    'box-shadow:var(--sga-shadow-sm);">' +
    '<div style="background:' + headBg + ';padding:10px 16px;border-radius:7px 7px 0 0;' +
    'display:flex;align-items:center;justify-content:space-between;">' +
    '<span style="font-weight:700;font-size:13px;">' + label + '</span>' +
    '<span class="sga-badge ' + badgeCls + '">' + cards.length + '</span>' +
    '</div>' +
    '<div class="ac-col-body" data-col-status="' + status + '" ' +
    'style="padding:10px;display:flex;flex-direction:column;gap:8px;min-height:50px;">' +
    cardsHtml + moreHtml + '</div></div>';
}

function _acCardHtml(card) {
  var excerpt = card.message ? card.message.substring(0, 50) + (card.message.length > 50 ? '…' : '') : '';
  var assignee = '';
  for (var i = 0; i < _acUsers.length; i++) {
    if (_acUsers[i].id === card.assigned_to) { assignee = _acUsers[i].name; break; }
  }
  var urgBadge = (card.urgent === 'TRUE' || card.urgent === true)
    ? '<div style="font-size:10px;font-weight:700;color:var(--sga-color-danger);margin-bottom:3px;">🔴 URGENTE</div>' : '';
  var quoteBadge = card.quote_id
    ? '<span style="background:var(--sga-color-info-bg);color:var(--sga-color-primary);border-radius:var(--sga-radius-sm);padding:1px 6px;font-size:var(--sga-font-size-xs);margin-right:4px;">📄 ' + escapeHtml(card.quote_id) + '</span>' : '';

  return '<div class="ac-card" draggable="true" ' +
    'data-card-id="' + escapeHtml(card.id) + '" data-status="' + escapeHtml(card.status) + '" ' +
    'ondragstart="_acDragStart(event,this)" ' +
    'style="background:var(--sga-bg-surface);border:1px solid var(--sga-border-default);border-radius:var(--sga-radius-sm);padding:10px 12px;' +
    'cursor:grab;position:relative;box-shadow:var(--sga-shadow-sm);">' +
    urgBadge +
    '<div style="font-weight:700;font-size:13px;padding-right:22px;margin-bottom:4px;line-height:1.3;">' + escapeHtml(card.title) + '</div>' +
    (excerpt ? '<div style="font-size:var(--sga-font-size-sm);color:var(--sga-text-muted);margin-bottom:6px;">' + escapeHtml(excerpt) + '</div>' : '') +
    (quoteBadge ? '<div style="margin-bottom:4px;">' + quoteBadge + '</div>' : '') +
    (assignee ? '<div style="font-size:var(--sga-font-size-xs);color:var(--sga-text-soft);">👤 ' + escapeHtml(assignee) + '</div>' : '') +
    (card.created_at ? '<div style="font-size:10px;color:var(--sga-text-soft);margin-top:3px;">' + formatDate(card.created_at) + '</div>' : '') +
    '<button onclick="_ac_openDetailModal(\'' + escapeHtml(card.id) + '\')" ' +
    'style="position:absolute;top:8px;right:8px;background:none;border:none;cursor:pointer;' +
    'color:var(--sga-text-soft);font-size:16px;padding:0 2px;line-height:1;" title="Detalhes">⋯</button>' +
    '</div>';
}

function _acToggleMore(id, btn) {
  var el = document.getElementById(id);
  if (!el) return;
  var hidden = el.style.display === 'none';
  el.style.display = hidden ? 'flex' : 'none';
  el.style.flexDirection = 'column';
  el.style.gap = '8px';
  var m = btn.textContent.match(/\((\d+)\)/);
  btn.textContent = hidden ? 'Ver menos' : ('Ver mais' + (m ? ' (' + m[1] + ')' : ''));
}

/* ── Drag-and-drop ── */
function _acDragStart(evt, el) {
  _acDragId = el.getAttribute('data-card-id');
  evt.dataTransfer.effectAllowed = 'move';
}

function _acAttachDrop() {
  var cols = document.querySelectorAll('[data-col-status]');
  for (var i = 0; i < cols.length; i++) {
    (function(col) {
      col.ondragover  = function(e) { e.preventDefault(); col.style.outline = '2px dashed var(--sga-color-primary)'; };
      col.ondragleave = function()  { col.style.outline = ''; };
      col.ondrop      = function(e) {
        e.preventDefault();
        col.style.outline = '';
        var target = col.getAttribute('data-col-status');
        if (!target || !_acDragId) return;
        var card = null;
        for (var j = 0; j < _acCards.length; j++) {
          if (_acCards[j].id === _acDragId) { card = _acCards[j]; break; }
        }
        if (!card || card.status === target) return;
        var allowed = _AC_TRANSITIONS[card.status] || [];
        if (allowed.indexOf(target) === -1) {
          showAlert('Transição "' + _AC_STATUS_LABELS[card.status] + '" → "' + _AC_STATUS_LABELS[target] + '" não permitida.', 'error');
          return;
        }
        _openStatusModal(_acDragId, target);
      };
    })(cols[i]);
  }
}

/* ── Helpers ── */
function _acUserOptions(selectedId) {
  var html = '<option value="">— Selecionar —</option>';
  for (var i = 0; i < _acUsers.length; i++) {
    var s = _acUsers[i].id === selectedId ? ' selected' : '';
    html += '<option value="' + escapeHtml(_acUsers[i].id) + '"' + s + '>' + escapeHtml(_acUsers[i].name) + '</option>';
  }
  return html;
}

// Modal API: agora delegado para SGA.openModal. Mantém handle global para
// que onclick="_closeAcModal()" inline continue funcionando.
var _acCurrentModal = null;

function _acShowModal(config) {
  // config: { title, size, body, footer }  — formato SGA.openModal
  if (_acCurrentModal) { try { _acCurrentModal.close(); } catch(e){} _acCurrentModal = null; }
  _acCurrentModal = SGA.openModal({
    title: config.title || '',
    size: config.size || 'sm',
    body: config.body || '',
    footer: config.footer || [],
    onClose: function () { _acCurrentModal = null; _acDragId = null; }
  });
  return _acCurrentModal;
}

function _closeAcModal() {
  if (_acCurrentModal) { try { _acCurrentModal.close(); } catch(e){} _acCurrentModal = null; }
  _acDragId = null;
}

/* ── Modal: Novo Card ── */
function _openNewCardModal() {
  _acShowModal({
    title: 'Novo Action Card',
    size: 'sm',
    body:
      '<div class="sga-form-group">' +
        '<label class="sga-form-label" for="ac-n-title">Título <span class="sga-form-required">*</span></label>' +
        '<input id="ac-n-title" type="text" class="sga-form-input" data-sga-autofocus>' +
      '</div>' +
      '<div class="sga-form-group">' +
        '<label class="sga-form-label" for="ac-n-msg">Mensagem</label>' +
        '<textarea id="ac-n-msg" rows="3" class="sga-form-textarea"></textarea>' +
      '</div>' +
      '<div class="sga-form-row">' +
        '<div class="sga-form-group">' +
          '<label class="sga-form-label" for="ac-n-quote">Proposta ID</label>' +
          '<input id="ac-n-quote" type="text" class="sga-form-input" placeholder="Ex: OPP-001">' +
        '</div>' +
        '<div class="sga-form-group">' +
          '<label class="sga-form-label" for="ac-n-assign">Atribuir a</label>' +
          '<select id="ac-n-assign" class="sga-form-select">' + _acUserOptions('') + '</select>' +
        '</div>' +
      '</div>' +
      '<label class="sga-form-check" style="margin-bottom:10px;">' +
        '<input type="checkbox" id="ac-n-urgent" onchange="' +
          'document.getElementById(\'ac-n-urgwarn\').style.display=this.checked?\'block\':\'none\'">' +
        '<span>🔴 Urgente</span>' +
      '</label>' +
      '<div id="ac-n-urgwarn" style="display:none;background:var(--sga-color-danger-bg);border:1px solid var(--sga-color-danger-border);' +
        'border-radius:var(--sga-radius-sm);padding:8px 12px;font-size:var(--sga-font-size-sm);color:var(--sga-color-danger);">' +
        '⚠️ Dispara notificação por email para o endereço configurado em ALERT_EMAIL.' +
      '</div>',
    footer: [
      { label: 'Cancelar', variant: 'ghost', onClick: 'close' },
      { label: 'Criar Card', variant: 'primary', primary: true, onClick: function () { _submitNewCard(); return false; }, closeAfter: false }
    ]
  });
}

function _submitNewCard() {
  var title  = (document.getElementById('ac-n-title')  || {}).value || '';
  var msg    = (document.getElementById('ac-n-msg')    || {}).value || '';
  var quote  = (document.getElementById('ac-n-quote')  || {}).value || '';
  var assign = (document.getElementById('ac-n-assign') || {}).value || '';
  var urgent = !!(document.getElementById('ac-n-urgent') || {}).checked;
  if (!title.trim()) { showAlert('O título é obrigatório.', 'warning'); return; }
  setLoading(true);
  google.script.run
    .withSuccessHandler(function(r) {
      setLoading(false);
      if (!r || !r.ok) { showAlert('Erro: ' + (r ? r.error : '?'), 'error'); return; }
      _closeAcModal();
      showAlert('Card ' + r.id + ' criado!', 'success');
      _loadAcData();
    })
    .withFailureHandler(function(err) {
      setLoading(false);
      showAlert('Falha: ' + (err.message || '?'), 'error');
    })
    .Api_acCreate({ title: title.trim(), message: msg, quote_id: quote, assigned_to: assign, urgent: urgent });
}

/* ── Modal: Mudar status ── */
function _openStatusModal(cardId, newStatus) {
  var card = null;
  for (var i = 0; i < _acCards.length; i++) {
    if (_acCards[i].id === cardId) { card = _acCards[i]; break; }
  }
  if (!card) return;
  _acShowModal({
    title: 'Mudar status',
    size: 'sm',
    body:
      '<p style="font-size:var(--sga-font-size-sm);color:var(--sga-text-muted);margin:0 0 18px;">' +
        escapeHtml(_AC_STATUS_LABELS[card.status]) + ' → <strong>' + escapeHtml(_AC_STATUS_LABELS[newStatus]) + '</strong>' +
      '</p>' +
      '<div class="sga-form-group">' +
        '<label class="sga-form-label" for="ac-st-member">Responsável <span class="sga-form-required">*</span></label>' +
        '<select id="ac-st-member" class="sga-form-select">' + _acUserOptions(card.assigned_to) + '</select>' +
      '</div>' +
      '<div class="sga-form-group">' +
        '<label class="sga-form-label" for="ac-st-note">Nota <span class="sga-form-required">*</span></label>' +
        '<textarea id="ac-st-note" rows="3" class="sga-form-textarea" placeholder="O que foi feito?"></textarea>' +
      '</div>',
    footer: [
      { label: 'Cancelar', variant: 'ghost', onClick: 'close' },
      { label: 'Confirmar', variant: 'primary', primary: true, onClick: function () { _submitStatus(cardId, newStatus); return false; }, closeAfter: false }
    ]
  });
}

function _submitStatus(cardId, newStatus) {
  var member = (document.getElementById('ac-st-member') || {}).value || '';
  var note   = ((document.getElementById('ac-st-note') || {}).value || '').trim();
  if (!member) { showAlert('Selecione um responsável.', 'warning'); return; }
  if (!note)   { showAlert('A nota é obrigatória.', 'warning'); return; }
  setLoading(true);
  google.script.run
    .withSuccessHandler(function(r) {
      setLoading(false);
      if (!r || !r.ok) { showAlert('Erro: ' + (r ? r.error : '?'), 'error'); return; }
      _closeAcModal();
      showAlert('Status atualizado!', 'success');
      _loadAcData();
    })
    .withFailureHandler(function(err) {
      setLoading(false);
      showAlert('Falha: ' + (err.message || '?'), 'error');
    })
    .Api_acUpdateStatus(cardId, newStatus, member, note);
}

/* ── Modal: Detalhe + histórico ── */
function _ac_openDetailModal(cardId) {
  var card = null;
  for (var i = 0; i < _acCards.length; i++) {
    if (_acCards[i].id === cardId) { card = _acCards[i]; break; }
  }
  if (!card) return;
  var sLabel  = _AC_STATUS_LABELS[card.status] || card.status;
  var sBadge  = card.status === 'ABERTO' ? 'sga-badge--info' : card.status === 'EM_ANDAMENTO' ? 'sga-badge--warning' : card.status === 'CONCLUIDO' ? 'sga-badge--success' : 'sga-badge--danger';
  var assignee = '', creator = card.created_by || '';
  for (var j = 0; j < _acUsers.length; j++) {
    if (_acUsers[j].id === card.assigned_to) assignee = _acUsers[j].name;
    if (_acUsers[j].id === card.created_by)  creator  = _acUsers[j].name;
  }
  _acShowModal({
    title: card.title,
    size: 'md',
    body:
      '<div style="margin-bottom:14px;">' +
        '<span class="sga-badge ' + sBadge + '">' + escapeHtml(sLabel) + '</span>' +
        ((card.urgent === 'TRUE' || card.urgent === true) ? ' <span style="font-size:var(--sga-font-size-xs);font-weight:700;color:var(--sga-color-danger);margin-left:6px;">🔴 URGENTE</span>' : '') +
      '</div>' +
      (card.message ? '<div style="font-size:var(--sga-font-size-sm);background:var(--sga-bg-surface-alt);border-radius:var(--sga-radius-sm);padding:10px;margin-bottom:12px;white-space:pre-wrap;">' + escapeHtml(card.message) + '</div>' : '') +
      (card.quote_id ? '<div style="margin-bottom:8px;font-size:var(--sga-font-size-sm);"><span style="color:var(--sga-text-muted);">Proposta:</span> <span style="background:var(--sga-color-info-bg);color:var(--sga-color-primary);border-radius:var(--sga-radius-sm);padding:1px 7px;">📄 ' + escapeHtml(card.quote_id) + '</span></div>' : '') +
      (assignee ? '<div style="font-size:var(--sga-font-size-sm);color:var(--sga-text-muted);margin-bottom:4px;">👤 <b>Atribuído a:</b> ' + escapeHtml(assignee) + '</div>' : '') +
      '<div style="font-size:var(--sga-font-size-sm);color:var(--sga-text-muted);margin-bottom:4px;">✍️ <b>Criado por:</b> ' + escapeHtml(creator) + '</div>' +
      (card.created_at ? '<div style="font-size:var(--sga-font-size-xs);color:var(--sga-text-soft);margin-bottom:16px;">📅 ' + formatDate(card.created_at) + '</div>' : '') +
      '<hr class="sga-divider">' +
      '<h4 style="margin:0 0 10px;font-size:var(--sga-font-size-sm);font-weight:700;">Histórico</h4>' +
      '<div id="ac-hist-' + escapeHtml(cardId) + '"><div class="sga-skeleton-list"><div class="sga-skeleton sga-skeleton--row"></div><div class="sga-skeleton sga-skeleton--row"></div></div></div>'
  });
  google.script.run
    .withSuccessHandler(function(r) {
      var el = document.getElementById('ac-hist-' + cardId);
      if (!el) return;
      if (!r || !r.ok || !r.data || !r.data.length) {
        el.innerHTML = '<p style="font-size:var(--sga-font-size-sm);color:var(--sga-text-soft);">Sem histórico registrado.</p>';
        return;
      }
      var h = '';
      for (var k = 0; k < r.data.length; k++) {
        var e = r.data[k];
        var from = _AC_STATUS_LABELS[e.from_status] || '';
        var to   = _AC_STATUS_LABELS[e.to_status]   || '';
        h += '<div style="display:flex;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--sga-border-default);">' +
          '<div style="width:8px;height:8px;background:var(--sga-color-primary);border-radius:50%;margin-top:5px;flex-shrink:0;"></div>' +
          '<div>' +
          '<div style="font-size:var(--sga-font-size-xs);color:var(--sga-text-muted);">' + formatDate(e.timestamp) +
            (e.member ? ' · <b>' + escapeHtml(e.member) + '</b>' : '') + '</div>' +
          (from && to ? '<div style="font-size:var(--sga-font-size-xs);margin:2px 0;">' + escapeHtml(from) + ' → <b>' + escapeHtml(to) + '</b></div>' : '') +
          (e.note ? '<div style="font-size:var(--sga-font-size-sm);color:var(--sga-text-default);margin-top:3px;">' + escapeHtml(e.note) + '</div>' : '') +
          '</div></div>';
      }
      el.innerHTML = h;
    })
    .withFailureHandler(function() {
      var el = document.getElementById('ac-hist-' + cardId);
      if (el) el.innerHTML = '<p style="font-size:var(--sga-font-size-sm);color:var(--sga-color-danger);">Erro ao carregar histórico.</p>';
    })
    .Api_acGetHistory(cardId);
}
</script>
