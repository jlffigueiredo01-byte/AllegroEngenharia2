<script>
/* ═══════════════════════════════════════════════════════════════
   ACTION CARDS — Kanban UI
   Kanban Jira-like: OPEN | IN_PROGRESS | FINISHED+CANCELLED
   Drag-and-drop nativo HTML5. Modais inline. ES5 compatível.
═══════════════════════════════════════════════════════════════ */

var _acCards = [];
var _acUsers = [];
var _acDragId = null;

var _AC_STATUS_LABELS = {
  'OPEN':        'Aberto',
  'IN_PROGRESS': 'Em andamento',
  'FINISHED':    'Concluído',
  'CANCELLED':   'Cancelado'
};

var _AC_TRANSITIONS = {
  'OPEN':        ['IN_PROGRESS', 'CANCELLED'],
  'IN_PROGRESS': ['OPEN', 'FINISHED', 'CANCELLED'],
  'FINISHED':    [],
  'CANCELLED':   []
};

/* ── Entrada principal ── */
function renderActionCards(area) {
  area.innerHTML =
    '<div class="page-header" style="display:flex;align-items:center;justify-content:space-between;">' +
      '<div class="page-header-left">' +
        '<h1 class="page-title">🗂 Action Cards</h1>' +
        '<p class="page-subtitle">Kanban da equipe — tarefas, follow-ups e ações internas.</p>' +
      '</div>' +
      '<button class="btn btn-primary" onclick="_openNewCardModal()">+ Novo Card</button>' +
    '</div>' +
    '<div id="ac-workload" style="margin-bottom:20px;"></div>' +
    '<div id="ac-kanban" class="ac-kanban-board"></div>' +
    '<div id="ac-modal-layer" class="hidden" ' +
      'style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);' +
      'z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;">' +
    '</div>';
  _loadAcData();
}

/* ── Carregamento de dados (paralelo) ── */
function _loadAcData() {
  var pending = 2;
  function check() { if (--pending === 0) _refreshBoard(); }
  google.script.run
    .withSuccessHandler(function(r) { _acCards = (r && r.ok) ? (r.data || []) : []; check(); })
    .withFailureHandler(function()   { _acCards = []; check(); })
    .Api_acGetAll();
  google.script.run
    .withSuccessHandler(function(r) { _acUsers = (r && r.ok) ? (r.data || []) : []; check(); })
    .withFailureHandler(function()   { _acUsers = []; check(); })
    .Api_acGetActiveUsers();
}

function _refreshBoard() {
  _renderWorkload();
  _renderKanban();
}

/* ── Barra de carga da equipe ── */
function _renderWorkload() {
  var el = document.getElementById('ac-workload');
  if (!el || !_acUsers.length) { if (el) el.innerHTML = ''; return; }
  var html = '<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;">' +
    '<span style="font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-right:4px;">Carga da equipe:</span>';
  for (var i = 0; i < _acUsers.length; i++) {
    var u = _acUsers[i];
    var n = 0;
    for (var j = 0; j < _acCards.length; j++) {
      var c = _acCards[j];
      if (c.assigned_to === u.id && (c.status === 'OPEN' || c.status === 'IN_PROGRESS')) n++;
    }
    var bg    = n <= 2 ? '#dcfce7' : n <= 4 ? '#fef3c7' : '#fee2e2';
    var color = n <= 2 ? '#15803d' : n <= 4 ? '#b45309' : '#b91c1c';
    html += '<span style="background:' + bg + ';color:' + color + ';border-radius:999px;' +
      'padding:3px 12px;font-size:12px;font-weight:600;">' +
      escapeHtml(u.name) + ' · ' + n + '</span>';
  }
  html += '</div>';
  el.innerHTML = html;
}

/* ── Board Kanban ── */
function _renderKanban() {
  var el = document.getElementById('ac-kanban');
  if (!el) return;
  var open = [], inp = [], fin = [], can = [];
  for (var i = 0; i < _acCards.length; i++) {
    var c = _acCards[i];
    if      (c.status === 'OPEN')        open.push(c);
    else if (c.status === 'IN_PROGRESS') inp.push(c);
    else if (c.status === 'FINISHED')    fin.push(c);
    else if (c.status === 'CANCELLED')   can.push(c);
  }
  el.innerHTML =
    _acColumn('OPEN',        'Aberto',       open, '#1a56db', '#eff6ff') +
    _acColumn('IN_PROGRESS', 'Em andamento', inp,  '#d97706', '#fffbeb') +
    _acDoneColumn(fin, can);
  _acAttachDrop();
}

function _acColumn(status, label, cards, border, headBg) {
  var cardsHtml = '';
  if (!cards.length) {
    cardsHtml = '<div style="text-align:center;padding:20px 0;color:#94a3b8;font-size:12px;">Nenhum card</div>';
  } else {
    for (var i = 0; i < cards.length; i++) cardsHtml += _acCardHtml(cards[i]);
  }
  return '<div class="ac-col" data-col-status="' + status + '" ' +
    'style="flex:1;min-width:200px;max-width:300px;background:#fff;border-radius:10px;' +
    'border-top:3px solid ' + border + ';box-shadow:0 1px 4px rgba(0,0,0,.07);">' +
    '<div style="background:' + headBg + ';padding:12px 16px;border-radius:7px 7px 0 0;' +
    'display:flex;align-items:center;justify-content:space-between;">' +
    '<span style="font-weight:700;font-size:13px;">' + label + '</span>' +
    '<span class="badge badge-blue" style="font-size:11px;">' + cards.length + '</span>' +
    '</div>' +
    '<div class="ac-col-body" data-col-status="' + status + '" ' +
    'style="padding:10px;display:flex;flex-direction:column;gap:8px;min-height:80px;">' +
    cardsHtml + '</div></div>';
}

function _acDoneColumn(fin, can) {
  var finHtml = _acDoneSection('FINISHED', 'Concluído', fin, '#16a34a', '#f0fdf4', '#dcfce7', 'badge-green');
  var canHtml = _acDoneSection('CANCELLED','Cancelado', can, '#dc2626', '#fef2f2', '#fee2e2', 'badge-red');
  return '<div style="flex:1;min-width:200px;max-width:300px;display:flex;flex-direction:column;gap:12px;">' +
    finHtml + canHtml + '</div>';
}

function _acDoneSection(status, label, cards, border, headBg, colBg, badgeCls) {
  var slice = cards.slice().reverse().slice(0, 4);
  var rest  = cards.length > 4 ? cards.slice().reverse().slice(4) : [];
  var id    = 'ac-more-' + status.toLowerCase();
  var cardsHtml = '';
  for (var i = 0; i < slice.length; i++) cardsHtml += _acCardHtml(slice[i]);
  if (!cards.length) cardsHtml = '<div style="text-align:center;padding:10px 0;color:#94a3b8;font-size:12px;">Nenhum card</div>';
  var moreHtml = '';
  if (rest.length) {
    var restCards = '';
    for (var j = 0; j < rest.length; j++) restCards += _acCardHtml(rest[j]);
    moreHtml = '<div id="' + id + '" style="display:none;flex-direction:column;gap:8px;">' + restCards + '</div>' +
      '<button class="btn btn-ghost btn-sm" style="font-size:11px;margin-top:4px;" ' +
      'onclick="_acToggleMore(\'' + id + '\',this)">Ver mais (' + rest.length + ')</button>';
  }
  return '<div class="ac-col" data-col-status="' + status + '" ' +
    'style="background:' + colBg + ';border-radius:10px;border-top:3px solid ' + border + ';' +
    'box-shadow:0 1px 4px rgba(0,0,0,.07);">' +
    '<div style="background:' + headBg + ';padding:10px 16px;border-radius:7px 7px 0 0;' +
    'display:flex;align-items:center;justify-content:space-between;">' +
    '<span style="font-weight:700;font-size:13px;">' + label + '</span>' +
    '<span class="badge ' + badgeCls + '" style="font-size:11px;">' + cards.length + '</span>' +
    '</div>' +
    '<div class="ac-col-body" data-col-status="' + status + '" ' +
    'style="padding:10px;display:flex;flex-direction:column;gap:8px;min-height:50px;">' +
    cardsHtml + moreHtml + '</div></div>';
}

function _acCardHtml(card) {
  var excerpt = card.message ? card.message.substring(0, 50) + (card.message.length > 50 ? '…' : '') : '';
  var assignee = '';
  for (var i = 0; i < _acUsers.length; i++) {
    if (_acUsers[i].id === card.assigned_to) { assignee = _acUsers[i].name; break; }
  }
  var urgBadge = (card.urgent === 'TRUE' || card.urgent === true)
    ? '<div style="font-size:10px;font-weight:700;color:#dc2626;margin-bottom:3px;">🔴 URGENTE</div>' : '';
  var quoteBadge = card.quote_id
    ? '<span style="background:#eff6ff;color:#1a56db;border-radius:4px;padding:1px 6px;font-size:11px;margin-right:4px;">📄 ' + escapeHtml(card.quote_id) + '</span>' : '';

  return '<div class="ac-card" draggable="true" ' +
    'data-card-id="' + escapeHtml(card.id) + '" data-status="' + escapeHtml(card.status) + '" ' +
    'ondragstart="_acDragStart(event,this)" ' +
    'style="background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:10px 12px;' +
    'cursor:grab;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.06);">' +
    urgBadge +
    '<div style="font-weight:700;font-size:13px;padding-right:22px;margin-bottom:4px;line-height:1.3;">' + escapeHtml(card.title) + '</div>' +
    (excerpt ? '<div style="font-size:12px;color:#64748b;margin-bottom:6px;">' + escapeHtml(excerpt) + '</div>' : '') +
    (quoteBadge ? '<div style="margin-bottom:4px;">' + quoteBadge + '</div>' : '') +
    (assignee ? '<div style="font-size:11px;color:#94a3b8;">👤 ' + escapeHtml(assignee) + '</div>' : '') +
    (card.created_at ? '<div style="font-size:10px;color:#cbd5e1;margin-top:3px;">' + formatDate(card.created_at) + '</div>' : '') +
    '<button onclick="_openDetailModal(\'' + escapeHtml(card.id) + '\')" ' +
    'style="position:absolute;top:8px;right:8px;background:none;border:none;cursor:pointer;' +
    'color:#94a3b8;font-size:16px;padding:0 2px;line-height:1;" title="Detalhes">⋯</button>' +
    '</div>';
}

function _acToggleMore(id, btn) {
  var el = document.getElementById(id);
  if (!el) return;
  var hidden = el.style.display === 'none';
  el.style.display = hidden ? 'flex' : 'none';
  el.style.flexDirection = 'column';
  el.style.gap = '8px';
  var m = btn.textContent.match(/\((\d+)\)/);
  btn.textContent = hidden ? 'Ver menos' : ('Ver mais' + (m ? ' (' + m[1] + ')' : ''));
}

/* ── Drag-and-drop ── */
function _acDragStart(evt, el) {
  _acDragId = el.getAttribute('data-card-id');
  evt.dataTransfer.effectAllowed = 'move';
}

function _acAttachDrop() {
  var cols = document.querySelectorAll('[data-col-status]');
  for (var i = 0; i < cols.length; i++) {
    (function(col) {
      col.ondragover  = function(e) { e.preventDefault(); col.style.outline = '2px dashed #1a56db'; };
      col.ondragleave = function()  { col.style.outline = ''; };
      col.ondrop      = function(e) {
        e.preventDefault();
        col.style.outline = '';
        var target = col.getAttribute('data-col-status');
        if (!target || !_acDragId) return;
        var card = null;
        for (var j = 0; j < _acCards.length; j++) {
          if (_acCards[j].id === _acDragId) { card = _acCards[j]; break; }
        }
        if (!card || card.status === target) return;
        var allowed = _AC_TRANSITIONS[card.status] || [];
        if (allowed.indexOf(target) === -1) {
          showAlert('Transição "' + _AC_STATUS_LABELS[card.status] + '" → "' + _AC_STATUS_LABELS[target] + '" não permitida.', 'error');
          return;
        }
        _openStatusModal(_acDragId, target);
      };
    })(cols[i]);
  }
}

/* ── Helpers ── */
function _acUserOptions(selectedId) {
  var html = '<option value="">— Selecionar —</option>';
  for (var i = 0; i < _acUsers.length; i++) {
    var s = _acUsers[i].id === selectedId ? ' selected' : '';
    html += '<option value="' + escapeHtml(_acUsers[i].id) + '"' + s + '>' + escapeHtml(_acUsers[i].name) + '</option>';
  }
  return html;
}

function _acShowModal(html) {
  var layer = document.getElementById('ac-modal-layer');
  if (!layer) return;
  layer.innerHTML = '<div style="background:#fff;border-radius:12px;padding:28px 24px;' +
    'width:100%;max-width:440px;max-height:90vh;overflow-y:auto;' +
    'box-shadow:0 20px 60px rgba(0,0,0,0.25);">' + html + '</div>';
  layer.classList.remove('hidden');
}

function _closeAcModal() {
  var layer = document.getElementById('ac-modal-layer');
  if (!layer) return;
  layer.innerHTML = '';
  layer.classList.add('hidden');
  _acDragId = null;
}

/* ── Modal: Novo Card ── */
function _openNewCardModal() {
  _acShowModal(
    '<h3 style="margin:0 0 18px;font-size:16px;font-weight:700;">Novo Action Card</h3>' +
    '<div class="form-group">' +
      '<label class="form-label">Título *</label>' +
      '<input id="ac-n-title" type="text" class="form-input">' +
    '</div>' +
    '<div class="form-group">' +
      '<label class="form-label">Mensagem</label>' +
      '<textarea id="ac-n-msg" rows="3" class="form-input" style="resize:vertical;"></textarea>' +
    '</div>' +
    '<div class="form-row-2">' +
      '<div class="form-group">' +
        '<label class="form-label">Proposta ID</label>' +
        '<input id="ac-n-quote" type="text" class="form-input" placeholder="Ex: OPP-001">' +
      '</div>' +
      '<div class="form-group">' +
        '<label class="form-label">Atribuir a</label>' +
        '<select id="ac-n-assign" class="form-input">' + _acUserOptions('') + '</select>' +
      '</div>' +
    '</div>' +
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">' +
      '<input type="checkbox" id="ac-n-urgent" style="width:16px;height:16px;" onchange="' +
        'document.getElementById(\'ac-n-urgwarn\').style.display=this.checked?\'block\':\'none\'">' +
      '<label for="ac-n-urgent" style="font-size:13px;font-weight:600;cursor:pointer;">🔴 Urgente</label>' +
    '</div>' +
    '<div id="ac-n-urgwarn" style="display:none;background:#fef2f2;border:1px solid #fca5a5;' +
      'border-radius:6px;padding:8px 12px;font-size:12px;color:#dc2626;margin-bottom:14px;">' +
      '⚠️ Dispara notificação por email para o endereço configurado em ALERT_EMAIL.' +
    '</div>' +
    '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px;">' +
      '<button class="btn btn-ghost" onclick="_closeAcModal()">Cancelar</button>' +
      '<button class="btn btn-primary" onclick="_submitNewCard()">Criar Card</button>' +
    '</div>'
  );
}

function _submitNewCard() {
  var title  = (document.getElementById('ac-n-title')  || {}).value || '';
  var msg    = (document.getElementById('ac-n-msg')    || {}).value || '';
  var quote  = (document.getElementById('ac-n-quote')  || {}).value || '';
  var assign = (document.getElementById('ac-n-assign') || {}).value || '';
  var urgent = !!(document.getElementById('ac-n-urgent') || {}).checked;
  if (!title.trim()) { showAlert('O título é obrigatório.', 'warning'); return; }
  setLoading(true);
  google.script.run
    .withSuccessHandler(function(r) {
      setLoading(false);
      if (!r || !r.ok) { showAlert('Erro: ' + (r ? r.error : '?'), 'error'); return; }
      _closeAcModal();
      showAlert('Card ' + r.id + ' criado!', 'success');
      _loadAcData();
    })
    .withFailureHandler(function(err) {
      setLoading(false);
      showAlert('Falha: ' + (err.message || '?'), 'error');
    })
    .Api_acCreate({ title: title.trim(), message: msg, quote_id: quote, assigned_to: assign, urgent: urgent });
}

/* ── Modal: Mudar status ── */
function _openStatusModal(cardId, newStatus) {
  var card = null;
  for (var i = 0; i < _acCards.length; i++) {
    if (_acCards[i].id === cardId) { card = _acCards[i]; break; }
  }
  if (!card) return;
  _acShowModal(
    '<h3 style="margin:0 0 6px;font-size:16px;font-weight:700;">Mudar status</h3>' +
    '<p style="font-size:13px;color:#64748b;margin:0 0 18px;">' +
      escapeHtml(_AC_STATUS_LABELS[card.status]) + ' → <strong>' + escapeHtml(_AC_STATUS_LABELS[newStatus]) + '</strong>' +
    '</p>' +
    '<div class="form-group">' +
      '<label class="form-label">Responsável *</label>' +
      '<select id="ac-st-member" class="form-input">' + _acUserOptions(card.assigned_to) + '</select>' +
    '</div>' +
    '<div class="form-group">' +
      '<label class="form-label">Nota *</label>' +
      '<textarea id="ac-st-note" rows="3" class="form-input" style="resize:vertical;" placeholder="O que foi feito?"></textarea>' +
    '</div>' +
    '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px;">' +
      '<button class="btn btn-ghost" onclick="_closeAcModal()">Cancelar</button>' +
      '<button class="btn btn-primary" onclick="_submitStatus(\'' + escapeHtml(cardId) + '\',\'' + newStatus + '\')">Confirmar</button>' +
    '</div>'
  );
}

function _submitStatus(cardId, newStatus) {
  var member = (document.getElementById('ac-st-member') || {}).value || '';
  var note   = ((document.getElementById('ac-st-note') || {}).value || '').trim();
  if (!member) { showAlert('Selecione um responsável.', 'warning'); return; }
  if (!note)   { showAlert('A nota é obrigatória.', 'warning'); return; }
  setLoading(true);
  google.script.run
    .withSuccessHandler(function(r) {
      setLoading(false);
      if (!r || !r.ok) { showAlert('Erro: ' + (r ? r.error : '?'), 'error'); return; }
      _closeAcModal();
      showAlert('Status atualizado!', 'success');
      _loadAcData();
    })
    .withFailureHandler(function(err) {
      setLoading(false);
      showAlert('Falha: ' + (err.message || '?'), 'error');
    })
    .Api_acUpdateStatus(cardId, newStatus, member, note);
}

/* ── Modal: Detalhe + histórico ── */
function _openDetailModal(cardId) {
  var card = null;
  for (var i = 0; i < _acCards.length; i++) {
    if (_acCards[i].id === cardId) { card = _acCards[i]; break; }
  }
  if (!card) return;
  var sLabel  = _AC_STATUS_LABELS[card.status] || card.status;
  var sBadge  = card.status === 'OPEN' ? 'badge-blue' : card.status === 'IN_PROGRESS' ? 'badge-yellow' : card.status === 'FINISHED' ? 'badge-green' : 'badge-red';
  var assignee = '', creator = card.created_by || '';
  for (var j = 0; j < _acUsers.length; j++) {
    if (_acUsers[j].id === card.assigned_to) assignee = _acUsers[j].name;
    if (_acUsers[j].id === card.created_by)  creator  = _acUsers[j].name;
  }
  _acShowModal(
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;">' +
      '<div>' +
        '<h3 style="margin:0 0 6px;font-size:15px;font-weight:700;">' + escapeHtml(card.title) + '</h3>' +
        '<span class="badge ' + sBadge + '">' + escapeHtml(sLabel) + '</span>' +
        ((card.urgent === 'TRUE' || card.urgent === true) ? ' <span style="font-size:11px;font-weight:700;color:#dc2626;">🔴 URGENTE</span>' : '') +
      '</div>' +
      '<button onclick="_closeAcModal()" style="background:none;border:none;cursor:pointer;font-size:20px;color:#94a3b8;padding:0;">✕</button>' +
    '</div>' +
    (card.message ? '<div style="font-size:13px;background:#f8fafc;border-radius:6px;padding:10px;margin-bottom:12px;white-space:pre-wrap;">' + escapeHtml(card.message) + '</div>' : '') +
    (card.quote_id ? '<div style="margin-bottom:8px;font-size:12px;"><span style="color:#64748b;">Proposta:</span> <span style="background:#eff6ff;color:#1a56db;border-radius:4px;padding:1px 7px;">📄 ' + escapeHtml(card.quote_id) + '</span></div>' : '') +
    (assignee ? '<div style="font-size:12px;color:#64748b;margin-bottom:4px;">👤 <b>Atribuído a:</b> ' + escapeHtml(assignee) + '</div>' : '') +
    '<div style="font-size:12px;color:#64748b;margin-bottom:4px;">✍️ <b>Criado por:</b> ' + escapeHtml(creator) + '</div>' +
    (card.created_at ? '<div style="font-size:11px;color:#94a3b8;margin-bottom:16px;">📅 ' + formatDate(card.created_at) + '</div>' : '') +
    '<hr style="border:none;border-top:1px solid #e2e8f0;margin:0 0 12px;">' +
    '<h4 style="margin:0 0 10px;font-size:13px;font-weight:700;">Histórico</h4>' +
    '<div id="ac-hist-' + escapeHtml(cardId) + '"><div class="spinner-ring" style="margin:12px auto;"></div></div>'
  );
  google.script.run
    .withSuccessHandler(function(r) {
      var el = document.getElementById('ac-hist-' + cardId);
      if (!el) return;
      if (!r || !r.ok || !r.data || !r.data.length) {
        el.innerHTML = '<p style="font-size:12px;color:#94a3b8;">Sem histórico registrado.</p>';
        return;
      }
      var h = '';
      for (var k = 0; k < r.data.length; k++) {
        var e = r.data[k];
        var from = _AC_STATUS_LABELS[e.from_status] || '';
        var to   = _AC_STATUS_LABELS[e.to_status]   || '';
        h += '<div style="display:flex;gap:10px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid #f1f5f9;">' +
          '<div style="width:8px;height:8px;background:#1a56db;border-radius:50%;margin-top:5px;flex-shrink:0;"></div>' +
          '<div>' +
          '<div style="font-size:11px;color:#64748b;">' + formatDate(e.timestamp) +
            (e.member ? ' · <b>' + escapeHtml(e.member) + '</b>' : '') + '</div>' +
          (from && to ? '<div style="font-size:11px;margin:2px 0;">' + escapeHtml(from) + ' → <b>' + escapeHtml(to) + '</b></div>' : '') +
          (e.note ? '<div style="font-size:12px;color:#374151;margin-top:3px;">' + escapeHtml(e.note) + '</div>' : '') +
          '</div></div>';
      }
      el.innerHTML = h;
    })
    .withFailureHandler(function() {
      var el = document.getElementById('ac-hist-' + cardId);
      if (el) el.innerHTML = '<p style="font-size:12px;color:#dc2626;">Erro ao carregar histórico.</p>';
    })
    .Api_acGetHistory(cardId);
}
</script>
