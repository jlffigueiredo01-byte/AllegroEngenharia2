<script>
// =============================================================================
// MelhoriasUI.html — SGA
// Guia de Melhorias (admin): todos os feedbacks de todos os usuários, com
// filtros e marcação de status. Restrito a DIRETOR_TECNICO. Prefixo _melh. ES5.
// (FB-00004 / FB-00012)
// =============================================================================

var _melhCache = [];
var _melhFiltroTipo = '';
var _melhFiltroStatus = '';

var _MELH_STATUS = {
  NOVO: { label: '🆕 Novo', badge: 'badge-blue' },
  COMPILADO: { label: '📤 Compilado', badge: 'badge-gray' },
  EM_ANALISE: { label: '🔍 Em análise', badge: 'badge-yellow' },
  APROVADO: { label: '✅ Aprovado', badge: 'badge-green' },
  IMPLEMENTADO: { label: '🎉 Implementado', badge: 'badge-green' },
  RECUSADO: { label: '✖️ Recusado', badge: 'badge-gray' }
};
var _MELH_TIPO = { ERRO: '🐛 Erro', SUGESTAO: '💡 Sugestão', MELHORIA: '⬆️ Melhoria' };

function renderMelhorias(area) {
  area.innerHTML =
    '<div class="page-header">' +
      '<div class="page-header-left">' +
        '<h1 class="page-title">🛠️ Melhorias do Sistema</h1>' +
        '<p class="page-subtitle">Todos os relatos de todos os usuários — acompanhe, classifique e marque o que já foi feito.</p>' +
      '</div>' +
    '</div>' +
    '<div class="kpi-grid" id="melh-kpis" style="grid-template-columns:repeat(4,1fr)"></div>' +
    '<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap">' +
      '<select class="sga-form-select" id="melh-f-tipo" style="width:170px"><option value="">Todos os tipos</option><option value="ERRO">🐛 Erro</option><option value="SUGESTAO">💡 Sugestão</option><option value="MELHORIA">⬆️ Melhoria</option></select>' +
      '<select class="sga-form-select" id="melh-f-status" style="width:190px"><option value="">Todos os status</option><option value="NOVO">🆕 Novo</option><option value="EM_ANALISE">🔍 Em análise</option><option value="APROVADO">✅ Aprovado</option><option value="IMPLEMENTADO">🎉 Implementado</option><option value="RECUSADO">✖️ Recusado</option></select>' +
    '</div>' +
    '<div id="melh-list"></div>';

  document.getElementById('melh-f-tipo').addEventListener('change', function () { _melhFiltroTipo = this.value; _melhRender(); });
  document.getElementById('melh-f-status').addEventListener('change', function () { _melhFiltroStatus = this.value; _melhRender(); });

  if (window.SGA && SGA.skeleton) SGA.skeleton(document.getElementById('melh-list'), { type: 'list', count: 5 });
  _melhLoad();
}

function _melhLoad() {
  google.script.run
    .withSuccessHandler(function (r) {
      if (!r || !r.ok) {
        var box = document.getElementById('melh-list');
        if (window.SGA && SGA.empty) {
          SGA.empty(box, { icon: '⚠️', title: 'Não foi possível carregar', text: (r && r.error) || 'sem resposta', variant: 'error' });
        } else {
          box.innerHTML = '<div class="card"><div class="card-body" style="color:var(--sga-color-danger)">Erro: ' + escapeHtml((r && r.error) || 'sem resposta') + '</div></div>';
        }
        return;
      }
      _melhCache = r.data || [];
      _melhKpis();
      _melhRender();
    })
    .withFailureHandler(function (e) {
      var box = document.getElementById('melh-list');
      if (window.SGA && SGA.empty) {
        SGA.empty(box, { icon: '⚠️', title: 'Falha ao carregar', text: e.message || String(e), variant: 'error' });
      } else {
        box.innerHTML = '<div class="card"><div class="card-body" style="color:var(--sga-color-danger)">Falha: ' + escapeHtml(e.message || e) + '</div></div>';
      }
    })
    .Api_fbGetAll();
}

function _melhKpis() {
  var box = document.getElementById('melh-kpis');
  if (!box) return;
  var pend = 0, impl = 0, urg = 0;
  for (var i = 0; i < _melhCache.length; i++) {
    var s = _melhCache[i].status;
    if (s === 'IMPLEMENTADO') impl++;
    else if (s !== 'RECUSADO') pend++;
    if (_melhCache[i].urgente === 'TRUE' && s !== 'IMPLEMENTADO' && s !== 'RECUSADO') urg++;
  }
  var kpi = function (l, v, sub) {
    return '<div class="kpi"><div class="k-label"><span>' + l + '</span></div><div class="k-value">' + v + '</div>' + (sub ? '<div class="k-sub">' + sub + '</div>' : '') + '</div>';
  };
  box.innerHTML =
    kpi('Total', String(_melhCache.length), 'relatos recebidos') +
    kpi('Pendentes', String(pend), 'aguardando ação') +
    kpi('Implementados', String(impl), 'já entregues') +
    kpi('Urgentes abertos', String(urg), 'precisam de atenção');
}

function _melhRender() {
  var box = document.getElementById('melh-list');
  if (!box) return;
  var lista = _melhCache.filter(function (f) {
    if (_melhFiltroTipo && f.tipo !== _melhFiltroTipo) return false;
    if (_melhFiltroStatus && f.status !== _melhFiltroStatus) return false;
    return true;
  });
  // FB-030: ordem de criação garantida — ordena pelo NÚMERO do FB (robusto mesmo
  // se criado_em vier inconsistente/desalinhado na planilha). Mais recente no topo.
  lista.sort(function (a, b) {
    var na = parseInt(String(a.id).replace(/\D/g, ''), 10) || 0;
    var nb = parseInt(String(b.id).replace(/\D/g, ''), 10) || 0;
    return nb - na;
  });
  if (!lista.length) {
    var hasAny = _melhCache && _melhCache.length > 0;
    if (window.SGA && SGA.empty) {
      if (hasAny) {
        SGA.empty(box, {
          icon: '🔍',
          title: 'Nenhum relato neste filtro',
          text: 'Ajuste os filtros de tipo ou status para ver mais relatos.',
          variant: 'filtered'
        });
      } else {
        SGA.empty(box, {
          icon: '💡',
          title: 'Nenhuma melhoria registrada ainda',
          text: 'Quando os usuários enviarem sugestões, melhorias ou reportarem erros pelo módulo de Feedback, eles aparecerão aqui para você acompanhar.'
        });
      }
    } else {
      box.innerHTML = '<div class="sga-empty"><div class="sga-empty__icon">' + (hasAny ? '🔍' : '💡') + '</div><h3 class="sga-empty__title">' + (hasAny ? 'Nenhum relato neste filtro' : 'Nenhuma melhoria registrada ainda') + '</h3></div>';
    }
    return;
  }
  var rows = '';
  for (var i = 0; i < lista.length; i++) {
    var f = lista[i];
    var st = _MELH_STATUS[f.status] || { label: f.status, badge: 'badge-gray' };
    rows += '<tr class="sga-table__row">' +
      '<td class="sga-table__td"><code style="font-size:var(--sga-font-size-xs)">' + escapeHtml(f.id) + '</code></td>' +
      '<td class="sga-table__td">' + (_MELH_TIPO[f.tipo] || escapeHtml(f.tipo)) + (f.urgente === 'TRUE' ? ' <span title="urgente">🚨</span>' : '') + '</td>' +
      '<td class="sga-table__td"><b>' + escapeHtml(f.titulo || '') + '</b><small class="sga-table__td-meta">' + escapeHtml(f.tela || '') + ' · ' + escapeHtml(f.criado_por_nome || f.criado_por || '') + '</small></td>' +
      '<td class="sga-table__td"><span class="badge ' + st.badge + '">' + st.label + '</span></td>' +
      '<td class="sga-table__td sga-table__td--actions"><button class="sga-btn sga-btn--ghost sga-btn--sm melh-ver" data-id="' + escapeHtml(f.id) + '">Ver / marcar</button></td>' +
    '</tr>';
  }
  box.innerHTML = '<div class="sga-table-wrap"><table class="sga-table">' +
    '<thead><tr><th class="sga-table__th">ID</th><th class="sga-table__th">Tipo</th><th class="sga-table__th">Relato</th><th class="sga-table__th">Status</th><th class="sga-table__th sga-table__th--actions"></th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div>';
  var vers = box.querySelectorAll('.melh-ver');
  for (var b = 0; b < vers.length; b++) vers[b].addEventListener('click', function () { _melhDetalhe(this.getAttribute('data-id')); });
}

function _melhAnexosHtml(f) {
  var anexos = [];
  try { anexos = JSON.parse(f.anexos_json || '[]'); } catch (e) {}
  if (!anexos.length && f.anexo_url) anexos = [{ url: f.anexo_url, name: f.anexo_name || 'anexo' }];
  if (!anexos.length) return '';
  var links = '';
  for (var i = 0; i < anexos.length; i++) {
    links += '<a href="' + escapeHtml(anexos[i].url) + '" target="_blank" class="sga-btn sga-btn--ghost sga-btn--sm" style="margin:2px">📎 ' + escapeHtml(anexos[i].name || ('anexo ' + (i + 1))) + '</a>';
  }
  return '<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:2px">' + links + '</div>';
}

function _melhDetalhe(id) {
  var f = null;
  for (var i = 0; i < _melhCache.length; i++) { if (_melhCache[i].id === id) { f = _melhCache[i]; break; } }
  if (!f) return;
  var ctx = {};
  try { ctx = JSON.parse(f.contexto_json || '{}'); } catch (e) {}

  var old = document.getElementById('melh-modal');
  if (old) old.parentNode.removeChild(old);
  var opt = function (s, atual) {
    var st = _MELH_STATUS[s];
    return '<option value="' + s + '"' + (s === atual ? ' selected' : '') + '>' + st.label + '</option>';
  };
  document.body.insertAdjacentHTML('beforeend',
    '<div class="sga-modal-backdrop" id="melh-modal" data-modal-id="melh-modal">' +
      '<div class="sga-modal sga-modal--md" role="dialog" aria-modal="true" aria-labelledby="melh-modal-title">' +
        '<header class="sga-modal__header">' +
          '<h2 class="sga-modal__title" id="melh-modal-title">' + (_MELH_TIPO[f.tipo] || '') + ' — ' + escapeHtml(f.id) + '</h2>' +
          '<button class="sga-modal__close" type="button" aria-label="Fechar" id="melh-close">✕</button>' +
        '</header>' +
        '<div class="sga-modal__body">' +
          '<div style="font-weight:700;font-size:var(--sga-font-size-md);margin-bottom:4px">' + escapeHtml(f.titulo || '') + '</div>' +
          '<div style="font-size:var(--sga-font-size-sm);color:var(--sga-text-soft);margin-bottom:10px">' + escapeHtml(f.tela || '') + ' · ' + escapeHtml(f.criado_por_nome || f.criado_por || '') + ' · ' + formatDate(f.criado_em) + (f.urgente === 'TRUE' ? ' · 🚨 urgente' : '') + '</div>' +
          '<div style="background:var(--sga-bg-surface-alt);border-radius:var(--sga-radius-md);padding:10px 14px;font-size:var(--sga-font-size-md);white-space:pre-wrap">' + escapeHtml(f.descricao || '') + '</div>' +
          _melhAnexosHtml(f) +
          (ctx.jsErrors && ctx.jsErrors.length ? '<details style="margin-top:8px;font-size:var(--sga-font-size-sm)"><summary>erros JS na sessão</summary><pre style="white-space:pre-wrap;font-size:var(--sga-font-size-xs)">' + escapeHtml(ctx.jsErrors.join('\\n')) + '</pre></details>' : '') +
          '<hr class="sga-divider">' +
          '<div class="sga-form-group">' +
            '<label class="sga-form-label" for="melh-status">Status</label>' +
            '<select class="sga-form-select" id="melh-status">' +
              opt('NOVO', f.status) + opt('EM_ANALISE', f.status) + opt('APROVADO', f.status) + opt('IMPLEMENTADO', f.status) + opt('RECUSADO', f.status) +
            '</select>' +
          '</div>' +
          '<div class="sga-form-group">' +
            '<label class="sga-form-label" for="melh-nota">Nota para o usuário (aparece em "Meus reportes")</label>' +
            '<input class="sga-form-input" id="melh-nota" value="' + escapeHtml(f.resolucao_nota || '') + '" placeholder="ex.: corrigido — atualize com Ctrl+Shift+R">' +
          '</div>' +
        '</div>' +
        '<footer class="sga-modal__footer">' +
          '<button class="sga-btn sga-btn--ghost" id="melh-cancel">Cancelar</button>' +
          '<button class="sga-btn sga-btn--primary" id="melh-salvar">Salvar status</button>' +
        '</footer>' +
      '</div></div>');

  var fechar = function () { var m = document.getElementById('melh-modal'); if (m) m.parentNode.removeChild(m); };
  document.getElementById('melh-close').addEventListener('click', fechar);
  document.getElementById('melh-cancel').addEventListener('click', fechar);
  document.getElementById('melh-modal').addEventListener('click', function (e) { if (e.target === this) fechar(); });
  document.getElementById('melh-salvar').addEventListener('click', function () {
    var novoStatus = document.getElementById('melh-status').value;
    var nota = document.getElementById('melh-nota').value;
    var btn = this; btn.disabled = true; btn.textContent = 'Salvando...';
    google.script.run.withSuccessHandler(function (r) {
      if (!r || !r.ok) { showAlert('Erro: ' + (r ? r.error : '?'), 'error'); btn.disabled = false; btn.textContent = 'Salvar status'; return; }
      var msg = 'Status atualizado.';
      if (r.data && r.data.tarefa) {
        msg += r.data.tarefa.modo === 'IMPLEMENTAR'
          ? ' 📤 Tarefa enviada aos agentes (implementar na /dev).'
          : ' 📤 Tarefa enviada aos agentes (propor — vermelho).';
      }
      showAlert(msg, 'success');
      f.status = novoStatus; f.resolucao_nota = nota;
      fechar(); _melhKpis(); _melhRender();
    }).withFailureHandler(function (e) {
      showAlert('Falha: ' + (e.message || e), 'error'); btn.disabled = false; btn.textContent = 'Salvar status';
    }).Api_fbMarcarStatus(id, novoStatus, nota);
  });
}
</script>
