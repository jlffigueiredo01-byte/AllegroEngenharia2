    '.pb-nav-actions{display:flex;justify-content:space-between;align-items:center;margin-top:24px;padding-top:16px;border-top:1px solid #f1f5f9;}',
    '.pb-proposal-stats{display:flex;gap:16px;margin-bottom:20px;flex-wrap:wrap;}',
    '.pb-stat-card{flex:1;min-width:140px;background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:16px;}',
    '.pb-stat-card-label{font-size:12px;color:#6b7280;margin-bottom:4px;}',
    '.pb-stat-card-value{font-size:22px;font-weight:700;color:#111827;}',
    '.pb-stat-card-value.green{color:#16a34a;}',

  ].join('');

}

  location: '',
  responsible: '',

  contact_id: '',
  contact_phone: '',
  contact_email: '',
  contacts: [], // cache de contatos da empresa atualmente selecionada

  product: '',
  max_temp: '',
  qty_sensors_xt: 0,
  qty_sensors_ht: 0,

  automation_detail: '',

// State for the proposals list view
var _proposals = [];
var _proposalsFilter = { status: '', q: '' };

// ============================================================
// renderQuotes(area)  — overrides the placeholder in Scripts.html
// Shows the Technical Proposals list with "Gerar Nova Proposta"
// ============================================================
function renderQuotes(area) {
  _pbInjectStyles();
  _proposalsFilter = { status: '', q: '' };
  area.innerHTML = _buildProposalsListShell();
  _bindProposalsListEvents(area);
  _loadProposalStats(area);
  _loadProposals(area);
}

// ------------------------------------------------------------
// Bind events for proposals list
// ------------------------------------------------------------
function _bindProposalsListEvents(area) {
  // FB-26/27 final: Oportunidades deletada. Botao "+ Nova Proposta" volta
  // como entrada unica de criacao — abre Wizard que agora captura tambem
  // o Levantamento Tecnico (Step 1 collapsible).
  var btnGerar = document.getElementById('btn-gerar-proposta');
  if (btnGerar) btnGerar.addEventListener('click', function () {
    renderProposalBuilder(document.getElementById('section-content'));
  });

  var filterStatus = document.getElementById('pb-filter-status');
  var filterType   = document.getElementById('pb-filter-type');
  var filterQ      = document.getElementById('pb-filter-q');

  if (filterStatus) filterStatus.addEventListener('change', function() {
    _proposalsFilter.status = this.value;
    _renderProposalsTable();
  });
  if (filterType) filterType.addEventListener('change', function() {
    _proposalsFilter.type = this.value;
    _renderProposalsTable();
  });
  if (filterQ) filterQ.addEventListener('input', function() {
    _proposalsFilter.q = this.value.toLowerCase();
    _renderProposalsTable();
  });

  var btnClear = document.getElementById('btn-pb-clear-filter');
  if (btnClear) btnClear.addEventListener('click', function() {
    _proposalsFilter = { status: '', q: '', type: '' };
    if (filterStatus) filterStatus.value = '';
    if (filterType)   filterType.value   = '';
    if (filterQ)      filterQ.value      = '';
    _renderProposalsTable();
  });

  var btnDetailClose  = document.getElementById('btn-pb-detail-close');
  var btnDetailCancel = document.getElementById('btn-pb-detail-cancel');
  if (btnDetailClose)  btnDetailClose.addEventListener('click',  _closeProposalDetailModal);
  if (btnDetailCancel) btnDetailCancel.addEventListener('click', _closeProposalDetailModal);

  var btnDetailPrint = document.getElementById('btn-pb-detail-print');
  if (btnDetailPrint) btnDetailPrint.addEventListener('click', function() {
    var id = btnDetailPrint.getAttribute('data-proposal-id');
    if (id) _printProposal(id);
  });

  var detailModal = document.getElementById('pb-detail-modal');
  if (detailModal) detailModal.addEventListener('click', function(e) {
    if (e.target === detailModal) _closeProposalDetailModal();
  });
}

// ------------------------------------------------------------
// Load proposal stats
// ------------------------------------------------------------
function _loadProposalStats() {
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.ok) return;
      var d = res.data || {};
      var elTotal = document.getElementById('pbs-total');
      var elValue = document.getElementById('pbs-value');
      var elDraft = document.getElementById('pbs-draft');
      var elSent  = document.getElementById('pbs-sent');
      if (elTotal) elTotal.textContent = d.total || 0;
      if (elValue) elValue.textContent = formatBRL(d.totalValue || 0);
      var byStatus = d.byStatus || {};
      if (elDraft) elDraft.textContent = byStatus['RASCUNHO'] || 0;
      if (elSent)  elSent.textContent  = (byStatus['ENVIADO'] || 0) + (byStatus['REVISADO'] || 0);
    })
    .withFailureHandler(function() {})
    .Api_getProposalStats();
}

// ------------------------------------------------------------
// Load proposals list
// ------------------------------------------------------------
function _loadProposals() {
  var wrap = document.getElementById('pb-table-wrap');
  if (wrap) {
    if (window.SGA && SGA.skeleton) SGA.skeleton(wrap, { type:'list', count:4 });
    else wrap.innerHTML = '<div class="sga-skeleton-list" style="padding:16px"><div class="sga-skeleton sga-skeleton--row"></div><div class="sga-skeleton sga-skeleton--row"></div><div class="sga-skeleton sga-skeleton--row"></div></div>';
  }

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.ok) {
        var w = document.getElementById('pb-table-wrap');
        if (w) {
          if (window.SGA && SGA.empty) SGA.empty(w, { variant:'error', icon:'⚠️', title:'Erro ao carregar propostas', text:'Tente novamente.' });
          else w.innerHTML = '<div class="sga-empty sga-empty--error"><div class="sga-empty__icon">⚠️</div><h3 class="sga-empty__title">Erro ao carregar propostas</h3></div>';
        }
        return;
      }
      _proposals = res.data || [];
      // FB-23 Test E: ordena DESC por created_at (mais recente primeiro).
      // Api_getProposals ja ordena no backend, mas reforco aqui defensivo.
      _proposals.sort(function (a, b) {
        return String(b.created_at || '').localeCompare(String(a.created_at || ''));
      });
      _renderProposalsTable();
    })
    .withFailureHandler(function() {
      var w = document.getElementById('pb-table-wrap');
      if (w) {
        if (window.SGA && SGA.empty) SGA.empty(w, { variant:'error', icon:'⚠️', title:'Falha ao carregar propostas' });
        else w.innerHTML = '<div class="sga-empty sga-empty--error"><div class="sga-empty__icon">⚠️</div><h3 class="sga-empty__title">Falha ao carregar propostas</h3></div>';
      }
    })
    .Api_getProposals();
}

// ------------------------------------------------------------
// Render proposals table
// ------------------------------------------------------------
function _renderProposalsTable() {
  var wrap = document.getElementById('pb-table-wrap');
  if (!wrap) return;

  var filter = _proposalsFilter || {};
  var filtered = _proposals.filter(function(p) {
    var matchStatus = !filter.status || p.status === filter.status;
    var matchType   = !filter.type   || p.type === filter.type;
    var matchQ = !filter.q || (
      (p.client_name || '').toLowerCase().indexOf(filter.q) !== -1 ||
      (p.id          || '').toLowerCase().indexOf(filter.q) !== -1
    );
    return matchStatus && matchType && matchQ;
  });

  if (filtered.length === 0) {
    var hasAnyProposal = _proposals && _proposals.length > 0;
    if (window.SGA && SGA.empty) {
      if (hasAnyProposal) {
        SGA.empty(wrap, {
          icon: '🔍',
          title: 'Nenhuma proposta neste filtro',
          text: 'Tente ajustar os filtros ou limpar a busca para ver outras propostas.',
          variant: 'filtered'
        });
      } else {
        SGA.empty(wrap, {
          icon: '📄',
          title: 'Nenhuma proposta ainda',
          text: 'Crie sua primeira proposta para começar a registrar suas oportunidades.',
          action: {
            label: '+ Nova Proposta',
            onClick: function () {
              var btn = document.getElementById('btn-gerar-proposta');
              if (btn) btn.click();
            }
          }
        });
      }
    } else {
      wrap.innerHTML = hasAnyProposal
        ? '<div class="sga-empty"><div class="sga-empty__icon">🔍</div><h3 class="sga-empty__title">Nenhuma proposta neste filtro</h3><p class="sga-empty__text">Tente ajustar os filtros.</p></div>'
        : '<div class="sga-empty"><div class="sga-empty__icon">📄</div><h3 class="sga-empty__title">Nenhuma proposta ainda</h3><p class="sga-empty__text">Clique em "+ Nova Proposta" no topo para criar a primeira.</p></div>';
    }
    return;
  }

  var rows = filtered.map(function(p) {
    var typeBadge = p.type === 'CONCRETO'
      ? '<span class="badge badge-gray">🏗️ Concreto</span>'
      : '<span class="badge badge-blue">🌾 Orgânico</span>';
    return [
      '<tr>',
      '  <td style="font-size:13px;font-weight:600;white-space:nowrap;">' + escapeHtml(p.id || '') + '</td>',
      '  <td>' + escapeHtml(p.client_name || '') + '</td>',
      '  <td>' + typeBadge + '</td>',
      '  <td style="white-space:nowrap;">' + formatBRL(p.total_value || 0) + '</td>',
      '  <td>' + _proposalStatusBadge(p.status) + '</td>',
      '  <td style="white-space:nowrap;">' + formatDate(p.created_at ? p.created_at.substring(0, 10) : '') + '</td>',
      '  <td style="white-space:nowrap;">',
      '    <button class="sga-btn sga-btn--ghost sga-btn--sm" style="margin-right:4px;" data-pb-view="' + escapeHtml(p.id) + '">Ver</button>',
      '    <button class="sga-btn sga-btn--ghost sga-btn--sm" data-pb-print="' + escapeHtml(p.id) + '">🖨️</button>',
      '    <button class="sga-btn sga-btn--ghost sga-btn--sm" data-pb-flow="' + escapeHtml(p.id) + '" title="Editar fluxograma da solução">🧩</button>',
      '    <button class="sga-btn sga-btn--ghost sga-btn--sm" data-pb-edit="' + escapeHtml(p.id) + '" title="Editar proposta (itens, textos, condições)">✏️</button>',
      '    <button class="sga-btn sga-btn--ghost sga-btn--sm" data-pb-stage="' + escapeHtml(p.id) + '" title="Avançar etapa do funil">➡️</button>',
      (p.status === 'ENVIADA' ? '    <button class="sga-btn sga-btn--ghost sga-btn--sm" data-pb-rev="' + escapeHtml(p.id) + '" title="Criar nova revisão (Rn+1)">📄+</button>' : ''),
      '  </td>',
      '</tr>'
    ].join('');
  }).join('');

  wrap.innerHTML = [
    '<table class="data-table">',
    '  <thead>',
    '    <tr>',
    '      <th>Nº Proposta</th>',
    '      <th>Cliente</th>',
    '      <th>Tipo</th>',
    '      <th>Valor Total</th>',
    '      <th>Status</th>',
    '      <th>Data</th>',
    '      <th></th>',
    '    </tr>',
    '  </thead>',
    '  <tbody>' + rows + '</tbody>',
    '</table>'
  ].join('');

  // Bind "Ver" and print buttons
  var viewBtns  = wrap.querySelectorAll('[data-pb-view]');
  var editBtns = wrap.querySelectorAll('[data-pb-edit]');
  for (var eb = 0; eb < editBtns.length; eb++) {
    editBtns[eb].addEventListener('click', function () { _pedOpen(this.getAttribute('data-pb-edit')); });
  }
  var stageBtns = wrap.querySelectorAll('[data-pb-stage]');
  for (var sb = 0; sb < stageBtns.length; sb++) {
    stageBtns[sb].addEventListener('click', function () { _pstOpen(this.getAttribute('data-pb-stage')); });
  }
  var revBtns = wrap.querySelectorAll('[data-pb-rev]');
  for (var rb = 0; rb < revBtns.length; rb++) {
    revBtns[rb].addEventListener('click', function () { _pedCriarRevisao(this.getAttribute('data-pb-rev')); });
  }
  var flowBtns = wrap.querySelectorAll('[data-pb-flow]');
  for (var fb = 0; fb < flowBtns.length; fb++) {
    flowBtns[fb].addEventListener('click', function () {
      _pflOpen(this.getAttribute('data-pb-flow'));
    });
  }
  var printBtns = wrap.querySelectorAll('[data-pb-print]');
  var i;
  for (i = 0; i < viewBtns.length; i++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        _openProposalDetailModal(btn.getAttribute('data-pb-view'));
      });
    })(viewBtns[i]);
  }
  for (i = 0; i < printBtns.length; i++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        _printProposal(btn.getAttribute('data-pb-print'));
      });
    })(printBtns[i]);
  }
}

// ------------------------------------------------------------
// Status badge helper
// ------------------------------------------------------------
function _proposalStatusBadge(status) {
  var cls = 'badge-gray';
  var s = status || '';
  if (s === 'RASCUNHO')  cls = 'badge-yellow';
  if (s === 'REVISADO')  cls = 'badge-blue';
  if (s === 'ENVIADO')   cls = 'badge-blue';
  if (s === 'APROVADO')  cls = 'badge-green';
  if (s === 'REPROVADO') cls = 'badge-red';
  if (s === 'CANCELADO') cls = 'badge-gray';
  var labels = { RASCUNHO: 'Rascunho', REVISADO: 'Revisado', ENVIADO: 'Enviado', APROVADO: 'Aprovado', REPROVADO: 'Reprovado', CANCELADO: 'Cancelado' };
  return '<span class="badge ' + cls + '">' + escapeHtml(labels[s] || s || 'Sem status') + '</span>';
}

// Detail modal for a proposal
// ------------------------------------------------------------
var _pbDetailId = null;

function _openProposalDetailModal(proposalId) {
  // FB-23 / FB-26-27: ao clicar numa proposta da lista, abre a Visao Proposta
  // (pagina dedicada full-screen) em vez do modal pequeno antigo.
  // O modal antigo fica como fallback caso renderPropostaVisao nao exista.
  if (typeof renderPropostaVisao === 'function') {
    var area = document.getElementById('section-content');
    if (area) { renderPropostaVisao(area, proposalId); return; }
  }
  // Fallback (legado): modal antigo
  _pbDetailId = proposalId;
  var modal = document.getElementById('pb-detail-modal');
  var body  = document.getElementById('pb-detail-body');
  var title = document.getElementById('pb-detail-title');
  var btnPrint = document.getElementById('btn-pb-detail-print');
  if (!modal || !body) return;

  // Find in local cache first
  var p = null;
  for (var i = 0; i < _proposals.length; i++) {
    if (_proposals[i].id === proposalId) { p = _proposals[i]; break; }
  }

  if (title) title.textContent = 'Proposta: ' + proposalId;
  if (btnPrint) btnPrint.setAttribute('data-proposal-id', proposalId);

  modal.classList.remove('hidden');
  modal.style.display = 'flex';

  if (p) {
    _renderProposalDetailBody(body, p);
  } else {
    if (window.SGA && SGA.skeleton) SGA.skeleton(body, { type:'list', count:4 });
    else body.innerHTML = '<div class="sga-skeleton-list"><div class="sga-skeleton sga-skeleton--row"></div><div class="sga-skeleton sga-skeleton--row"></div></div>';
    google.script.run
      .withSuccessHandler(function(res) {
        if (!res || !res.ok) {
          body.innerHTML = '<div class="sga-empty sga-empty--error"><div class="sga-empty__icon">⚠️</div><h3 class="sga-empty__title">Erro ao carregar proposta</h3></div>';
          return;
        }
        _renderProposalDetailBody(body, res.data);
      })
      .withFailureHandler(function() {
        body.innerHTML = '<div class="sga-empty sga-empty--error"><div class="sga-empty__icon">⚠️</div><h3 class="sga-empty__title">Falha ao carregar</h3></div>';
      })
      .Api_getProposal(proposalId);
  }
}

function _renderProposalDetailBody(body, p) {

        '<td>' + escapeHtml(it.description || '') + '</td>' +
        '<td style="text-align:center;">' + escapeHtml(String(it.qty || 1)) + '</td>' +

        '<td style="text-align:right;font-weight:600;">' + formatBRL(it.total || 0) + '</td>' +
        '</tr>';
    }).join('');

      '<table class="data-table" style="font-size:13px;">',
      '  <thead><tr><th>Código</th><th>Descrição</th><th>Qtd</th><th>V. Unit.</th><th>Total</th></tr></thead>',

    _pbDetailField('Nº Proposta', p.id),
    _pbDetailField('Tipo', typeLabel),
    _pbDetailField('Cliente', p.client_name),
    _pbDetailField('Local', p.location),
    _pbDetailField('Responsável', p.responsible),
    _pbDetailField('Status', p.status),
    _pbDetailField('Valor Total', formatBRL(p.total_value || 0)),
    _pbDetailField('Criado em', formatDate(p.created_at ? p.created_at.substring(0, 10) : '')),
    '</div>',

    '<div style="margin-bottom:16px;">',
    '  <div style="font-size:12px;color:var(--sga-text-soft);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;">Itens</div>',
    itemsHtml || '<div style="color:var(--sga-text-soft);font-size:13px;padding:8px 0;">Nenhum item</div>',
    '</div>',

    p.startup_value ? '<div style="margin-bottom:16px;">' + _pbDetailField('Start-Up / Comissionamento', formatBRL(p.startup_value)) + '</div>' : '',

    '<div style="margin-bottom:12px;">',
    '  <div style="font-size:12px;color:var(--sga-text-soft);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;">Escopo Técnico</div>',
    '  <div style="font-size:13px;color:var(--sga-text-default);line-height:1.6;padding:10px;background:var(--sga-bg-surface-alt);border-radius:var(--sga-radius-sm);white-space:pre-wrap;max-height:160px;overflow-y:auto;">' + scopePreview + '</div>',
    '</div>',

    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px;">',
    _pbDetailField('Condições de Pagamento', p.payment_terms),
    _pbDetailField('Prazo de Entrega', p.delivery_days ? p.delivery_days + ' dias' : '—'),
    _pbDetailField('Validade', p.validity_days ? p.validity_days + ' dias' : '—'),

// ============================================================
// _printProposal(proposalId)
// ============================================================
function _printProposal(proposalId) {
  setLoading(true);
  google.script.run
    .withSuccessHandler(function(r) {
      setLoading(false);
      if (!r || !r.ok) {
        showAlert('Erro ao gerar proposta: ' + (r ? r.error : '?'), 'error');
        return;
      }
      var win = window.open('', '_blank');
      win.document.write(r.html);
      win.document.close();
      setTimeout(function() { win.print(); }, 500);
    })
    .withFailureHandler(function(err) {
      setLoading(false);
      showAlert('Falha: ' + (err.message || 'erro'), 'error');
    })
    .Api_generateProposalHTML(proposalId);
}

  _pb.techExpanded = false;

  _pb.qty_sensors_ht = 0;
  _pb.qty_sensors_probe = 0;

  _pb.hydro_view = '';

  _pb.calcMoInfra = 0;
  _pb.calcMoStartup = 0;
  _pb.items = [];
  _pb.scopeText = '';
  _pb.startupValue = 0;
  _pb.paymentTerms = '50% na entrega; 50% 15 dias após a entrega.';
  _pb.deliveryDays = 45;
  _pb.validityDays = 10;
  _pb.observations = 'Estamos considerando frete CIF;\nNão estamos considerando mão de obra para automação dos equipamentos existentes.';
  _pb.aiReview = null;
  _pb.products = [];
  _pb.companies = [];

  _pb._area = area;

  _pbRenderStep(area, 1);

  // Load companies and products in parallel
  var pending = 2;
  function checkDone() {
    pending--;
    if (pending <= 0) {
      // If we're still on step 1, refresh the company dropdown
      if (_pb.step === 1) _pbPopulateCompanySelect();
    }
  }

  google.script.run
    .withSuccessHandler(function(res) {
      _pb.companies = (res && res.ok && res.data) ? res.data : [];
      checkDone();
    })
    .withFailureHandler(function() {
      _pb.companies = [];
      checkDone();
    })
    .Api_getCompanies();

  google.script.run
    .withSuccessHandler(function(res) {
      _pb.products = (res && res.ok && res.data) ? res.data : [];
      checkDone();
    })
    .withFailureHandler(function() {
      _pb.products = [];
      checkDone();
    })
    .Api_getProducts();
}

function _pbToggleTech() {
  _pb.techExpanded = !_pb.techExpanded;
  var body = document.getElementById('pb-tech-body');
  var btn  = document.getElementById('pb-tech-toggle-btn');
  if (!body || !btn) return;
  body.style.display = _pb.techExpanded ? 'block' : 'none';
  btn.textContent    = _pb.techExpanded ? '▼ recolher' : '▶ expandir';
  if (_pb.techExpanded) _pbTechRestoreInputs();
}

function _pbTechRestoreInputs() {
  var setVal = function (id, v) { var el = document.getElementById(id); if (el) el.value = (v == null ? '' : v); };
  setVal('pb-product',            _pb.product);
  setVal('pb-max-temp',           _pb.max_temp);
  setVal('pb-qty-xt',             _pb.qty_sensors_xt);
  setVal('pb-qty-ht',             _pb.qty_sensors_ht);
  setVal('pb-qty-probe',          _pb.qty_sensors_probe);
  setVal('pb-installation-point', _pb.installation_point);
  setVal('pb-automation-detail',  _pb.automation_detail);
  setVal('pb-hydro-view',         _pb.hydro_view);
  setVal('pb-tamanho-infra',      _pb.tamanho_infra);
  setVal('pb-infra-distance',     _pb.infra_distance);
  setVal('pb-tech-notes',         _pb.tech_notes);
}

function _pbSaveTechFromInputs() {
  var num = function (id) { var el = document.getElementById(id); return el ? Number(el.value || 0) : 0; };
  var str = function (id) { var el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; };
  _pb.product            = str('pb-product');
  _pb.max_temp           = str('pb-max-temp');
  _pb.qty_sensors_xt     = num('pb-qty-xt');
  _pb.qty_sensors_ht     = num('pb-qty-ht');

function _pbCalcInfraRun() {
  _pbSaveTechFromInputs();
  var tam = _pb.tamanho_infra || 0;
  var km  = _pb.infra_distance || 0;
  var out = document.getElementById('pb-calc-output');
  if (!out) return;
  if (tam <= 0 && km <= 0) {
    out.textContent = 'Preencha tamanho infra e distância para calcular automaticamente.';
    return;
  }
  google.script.run
    .withSuccessHandler(function (r) {
      if (!r || !r.ok) {
        out.innerHTML = '<span style="color:#b91c1c">Erro: ' + ((r && r.error) || 'desconhecido') + '</span>';
        return;
      }
      var d = r.data || {};
      _pb.calcKitInfra  = d.kit_infra  || 0;
      _pb.calcMoInfra   = d.mo_infra   || 0;
      _pb.calcMoStartup = d.mo_startup || 0;
      var fmt = function (v) { return typeof formatBRL === 'function' ? formatBRL(v) : ('R$ ' + (v || 0)); };
      out.innerHTML =
        '<div style="font-size:12.5px;color:#1f2937">' +
          '<div>📐 Kit Infra: <b>' + fmt(d.kit_infra) + '</b></div>' +
          '<div>👷 MO Infra: <b>' + fmt(d.mo_infra) + '</b></div>' +
          '<div>🚀 MO Startup: <b>' + fmt(d.mo_startup) + '</b></div>' +
          '<div style="font-size:11px;color:#94a3b8;margin-top:4px">⚙️ Editar coeficientes na aba SETUP_CALC (categoria CALC_INFRA)</div>' +
        '</div>';
    })
    .withFailureHandler(function (err) {
      out.innerHTML = '<span style="color:#b91c1c">Erro: ' + (err && err.message ? err.message : String(err)) + '</span>';
    })
    .Api_calcInfra({ tamanho_infra: tam, dist_curitiba: km });
}

// FB-19: carrega contatos ativos da empresa e popula o select de Responsavel
function _pbLoadContactsForClient(clientId) {
  var sel  = document.getElementById('pb-responsible-select');

// FB-19: monta as options do select de Responsavel a partir de _pb.contacts
function _pbPopulateResponsibleSelect() {
  var sel  = document.getElementById('pb-responsible-select');
  var hint = document.getElementById('pb-responsible-hint');
  if (!sel) return;

  var contacts = _pb.contacts || [];
  if (!contacts.length) {
    sel.disabled = true;
    sel.innerHTML = '<option value="">Sem contatos cadastrados</option>';
    if (hint) {
      hint.style.color = '#b45309';
      hint.textContent = 'Esta empresa nao tem contatos cadastrados. Cadastre um contato antes de criar a proposta.';
    }
    return;
  }

  sel.disabled = false;
  var opts = ['<option value="">Selecione o responsavel</option>'];
  for (var i = 0; i < contacts.length; i++) {
    var c = contacts[i];
    var cid   = c.id    || '';
    var cname = c.name  || '(sem nome)';
    var cphone= c.phone || '';
    var cemail= c.email || '';
    var crole = c.role  || '';
    // value = "id|phone|email" — encoda os 3 dados (encodeURIComponent evita conflito com '|')
    var value = encodeURIComponent(cid) + '|' + encodeURIComponent(cphone) + '|' + encodeURIComponent(cemail);
    var label = cname + (crole ? ' (' + crole + ')' : '');
    if (!cemail && !cphone) label += ' (sem email/telefone cadastrado)';
    else if (!cemail)       label += ' (sem email cadastrado)';
    else if (!cphone)       label += ' (sem telefone cadastrado)';
    var selected = (_pb.contact_id && cid === _pb.contact_id) ? ' selected' : '';
    opts.push('<option value="' + escapeHtml(value) + '"' + selected + ' data-name="' + escapeHtml(cname) + '">' + escapeHtml(label) + '</option>');
  }
  sel.innerHTML = opts.join('');
  if (hint) { hint.style.color = '#6b7280'; hint.textContent = ''; }
}

// FB-19: handler de mudanca no select de Responsavel — atualiza snapshot no estado
function _pbOnResponsibleChange(sel) {
  var val = sel.value || '';
  if (!val) {
    _pb.contact_id    = '';
    _pb.contact_phone = '';
    _pb.contact_email = '';
    _pb.responsible   = '';
    return;
  }
  var parts = val.split('|');
  _pb.contact_id    = decodeURIComponent(parts[0] || '');
  _pb.contact_phone = decodeURIComponent(parts[1] || '');
  _pb.contact_email = decodeURIComponent(parts[2] || '');
  var opt = sel.options[sel.selectedIndex];
  _pb.responsible = opt ? (opt.getAttribute('data-name') || '') : '';
}

// Populate the company dropdown from _pb.companies cache
function _pbPopulateCompanySelect() {
  var sel = document.getElementById('pb-client-select');
  if (!sel) return;

  if (!_pb.companies || !_pb.companies.length) {
    sel.innerHTML = '<option value="">Carregando clientes...</option>';
    return;
  }

  var opts = ['<option value="">Selecione um cliente</option>'];
  for (var i = 0; i < _pb.companies.length; i++) {
    var c = _pb.companies[i];

/* FB-20 (Test 3) helpers — auto-fill de Kit Infra / MO Infra / MO Startup
   com base nos coeficientes da calculadora preenchidos no Step 1.
   _pbCalcValorParaCodigo retorna:
     - numero positivo: usa este valor calculado
     - 0: codigo eh coberto pela calculadora mas Step 1 vazio
     - null: codigo nao eh coberto, deixa fluxo padrao */
function _pbCalcValorParaCodigo(code) {
  var c = String(code || '').toUpperCase();
  // Match heuristico — funciona com KIT-INFRA, KIT_INFRA, MO-INFRA, MO INFRA, MO-STARTUP, etc.
  var hasKit     = /\bKIT[-_ ]?INFRA\b/.test(c);
  var hasStartup = /STARTUP/.test(c) || /\bSTART[-_ ]?UP\b/.test(c);
  var hasMo      = /^MO[-_ ]/.test(c) || /\bMO[-_ ]?INFRA\b/.test(c);

  if (hasStartup)             return Number(_pb.calcMoStartup || 0);
  if (hasKit)                 return Number(_pb.calcKitInfra  || 0);
  if (hasMo && !hasStartup)   return Number(_pb.calcMoInfra   || 0);
  return null;
}

function _pbShowCalcHint(code, valor) {
  var box = document.getElementById('pb-calc-hint-step2');
  if (!box) {
    // Cria caixinha logo abaixo do pb-prod-price na primeira vez
    var priceInp = document.getElementById('pb-prod-price');
    if (!priceInp || !priceInp.parentNode) return;
    var div = document.createElement('div');
    div.id = 'pb-calc-hint-step2';
    div.style.cssText = 'margin-top:6px;font-size:11.5px;line-height:1.4';
    priceInp.parentNode.appendChild(div);
    box = div;
  }
  if (!code) { box.innerHTML = ''; return; }
  if (valor != null && valor > 0) {
    var fmt = (typeof formatBRL === 'function') ? formatBRL(valor) : ('R$ ' + valor);
    box.innerHTML = '<span style="color:#15803d">🧮 Valor calculado pelo motor (Step 1): <b>' + fmt + '</b></span>';
  } else {
    box.innerHTML =
      '<span style="color:#b91c1c">⚠️ Este item depende da calculadora. ' +
      '<a href="#" onclick="event.preventDefault();_pbRenderStep(_pb._area, 1);setTimeout(_pbToggleTech, 100)" style="color:#1a56db;font-weight:600">Volte ao Step 1</a> ' +
      'e preencha <b>Tamanho da Infra</b> e <b>Distância de Curitiba</b> no Levantamento Técnico.</span>';
  }
}

function _pbAddProduct() {
  var sel      = document.getElementById('pb-prod-select');
  var qtyInp   = document.getElementById('pb-prod-qty');
  var priceInp = document.getElementById('pb-prod-price');

  if (!sel || !sel.value) { showAlert('Selecione um produto.', 'error'); return; }

  var opt   = sel.options[sel.selectedIndex];
  var code  = sel.value;
  var desc  = opt.getAttribute('data-desc') || '';
  var ncm   = opt.getAttribute('data-ncm') || '';
  var qty   = parseInt(qtyInp ? qtyInp.value : '1', 10) || 1;
  var price = parseFloat(priceInp ? priceInp.value : '0') || 0;

  if (qty <= 0)   { showAlert('Quantidade inválida.', 'error'); return; }
  if (price <= 0) { showAlert('Informe o valor unitário.', 'error'); return; }

  _pb.items.push({
    code: code,
    description: desc,
    ncm: ncm,
    qty: qty,
    unit_price: price,
    total: qty * price
  });

  // Reset add form
  sel.value = '';
  if (qtyInp)   qtyInp.value   = '1';
  if (priceInp) priceInp.value = '';

  _pbRenderItemsTable();
  _pbUpdateGrandTotal();
}

function _pbRenderItemsTable() {
  var wrap = document.getElementById('pb-items-wrap');
  if (!wrap) return;

  if (!_pb.items || !_pb.items.length) {
    wrap.innerHTML = '<div class="sga-empty sga-empty--compact"><div class="sga-empty__icon">📦</div><h3 class="sga-empty__title">Nenhum produto adicionado ainda.</h3></div>';
    return;
  }

  var rows = _pb.items.map(function(item, idx) {
    var shortDesc = item.description.length > 40 ? item.description.substring(0, 40) + '…' : item.description;
    return [
      '<tr>',
      '  <td style="font-size:12px;font-weight:600;white-space:nowrap;">' + escapeHtml(item.code) + '</td>',
      '  <td title="' + escapeHtml(item.description) + '">' + escapeHtml(shortDesc) + '</td>',
      '  <td style="width:80px;text-align:center;">',
      '    <input type="number" class="qty-input" data-idx="' + idx + '" value="' + item.qty + '" min="1" style="width:60px;text-align:center;padding:4px 6px;border:1px solid #d1d5db;border-radius:4px;font-size:13px;">',
      '  </td>',
      '  <td style="text-align:right;">',
      '    <input type="number" class="price-input" data-idx="' + idx + '" value="' + item.unit_price + '" min="0" step="0.01" style="width:110px;text-align:right;padding:4px 6px;border:1px solid #d1d5db;border-radius:4px;font-size:13px;">',
      '  </td>',
      '  <td style="text-align:right;font-weight:600;white-space:nowrap;" id="pb-item-total-' + idx + '">' + formatBRL(item.total) + '</td>',
      '  <td style="text-align:center;"><button class="sga-btn sga-btn--ghost sga-btn--sm" data-remove-idx="' + idx + '" style="color:var(--sga-color-danger);padding:2px 8px;">×</button></td>',
      '</tr>'
    ].join('');
  }).join('');

  wrap.innerHTML = [
    '<table class="pb-items-table">',
    '  <thead>',
    '    <tr>',
    '      <th>Código</th>',
    '      <th>Descrição</th>',
    '      <th style="text-align:center;">Qtd</th>',
    '      <th style="text-align:right;">Valor Unit.</th>',
    '      <th style="text-align:right;">Total</th>',
    '      <th></th>',
    '    </tr>',
    '  </thead>',
    '  <tbody>' + rows + '</tbody>',
    '</table>'
  ].join('\n');

  // Bind qty inputs
  var qtyInputs = wrap.querySelectorAll('.qty-input');
  var i;
  for (i = 0; i < qtyInputs.length; i++) {
    (function(inp) {
      inp.addEventListener('input', function() {
        var idx = parseInt(this.getAttribute('data-idx'), 10);
        var qty = parseInt(this.value, 10) || 1;
        if (qty < 1) { this.value = 1; qty = 1; }
        _pb.items[idx].qty   = qty;
        _pb.items[idx].total = qty * _pb.items[idx].unit_price;
        var totalCell = document.getElementById('pb-item-total-' + idx);
        if (totalCell) totalCell.textContent = formatBRL(_pb.items[idx].total);
        _pbUpdateGrandTotal();
      });
    })(qtyInputs[i]);
  }

  // Bind price inputs
  var priceInputs = wrap.querySelectorAll('.price-input');
  for (i = 0; i < priceInputs.length; i++) {
    (function(inp) {
      inp.addEventListener('input', function() {
        var idx   = parseInt(this.getAttribute('data-idx'), 10);
        var price = parseFloat(this.value) || 0;
        _pb.items[idx].unit_price = price;
        _pb.items[idx].total      = _pb.items[idx].qty * price;
        var totalCell = document.getElementById('pb-item-total-' + idx);
        if (totalCell) totalCell.textContent = formatBRL(_pb.items[idx].total);
        _pbUpdateGrandTotal();
      });
    })(priceInputs[i]);
  }

  // Bind remove buttons
  var removeBtns = wrap.querySelectorAll('[data-remove-idx]');
  for (i = 0; i < removeBtns.length; i++) {
    (function(btn) {
      btn.addEventListener('click', function() {
        var idx = parseInt(this.getAttribute('data-remove-idx'), 10);
        _pb.items.splice(idx, 1);
        _pbRenderItemsTable();
        _pbUpdateGrandTotal();
      });
    })(removeBtns[i]);
  }
}

function _pbUpdateGrandTotal() {
  var itemsTotal = 0;
  for (var i = 0; i < _pb.items.length; i++) {
    itemsTotal += _pb.items[i].total || 0;
  }
  var startup = _pb.startupValue || 0;
  var grandTotal = itemsTotal + startup;

  var el = document.getElementById('pb-grand-total');
  if (el) el.textContent = formatBRL(grandTotal);
}

function _pbSaveStep3Fields() {

// FB-21: helpers do editor inline de fluxograma (prefixo _pbf — proposal builder flow)
function _pbfRenderRows() {
  var box = document.getElementById('pbf-rows');
  if (!box) return;
  if (!_pb.flowBoxes.length) {
    box.innerHTML = '<div style="font-size:12px;color:#94a3b8;padding:6px 0">Nenhuma caixa adicionada. A proposta usará o fluxo automático.</div>';
    return;
  }
  var html = '';
  for (var i = 0; i < _pb.flowBoxes.length; i++) {
    var b = _pb.flowBoxes[i];
    html +=
      '<div class="pbf-row" data-i="' + i + '" style="display:flex;gap:6px;align-items:center;background:#fff;border:1px solid #e5e7eb;border-radius:8px;padding:6px 8px">' +
        '<span style="font-size:11px;color:#94a3b8;min-width:18px">' + (i + 1) + '.</span>' +
        '<input type="text" class="form-input pbf-title" placeholder="Título da caixa" value="' + escapeHtml(b.title || '') + '" style="flex:1.2;font-weight:600;font-size:13px">' +
        '<input type="text" class="form-input pbf-sub"   placeholder="Subtítulo (opcional)" value="' + escapeHtml(b.sub || '') + '" style="flex:1.8;font-size:13px">' +
        '<button type="button" class="sga-btn sga-btn--ghost sga-btn--sm pbf-up"  title="Subir"   ' + (i === 0 ? 'disabled' : '') + '>↑</button>' +
        '<button type="button" class="sga-btn sga-btn--ghost sga-btn--sm pbf-dn"  title="Descer"  ' + (i === _pb.flowBoxes.length - 1 ? 'disabled' : '') + '>↓</button>' +
        '<button type="button" class="sga-btn sga-btn--ghost sga-btn--sm pbf-rm"  title="Remover" style="color:#b91c1c">✕</button>' +
      '</div>';
  }
  box.innerHTML = html;

  var rows = box.querySelectorAll('.pbf-row');
  for (var r = 0; r < rows.length; r++) {
    (function (row) {
      var i = parseInt(row.getAttribute('data-i'), 10);
      var inT = row.querySelector('.pbf-title');
      var inS = row.querySelector('.pbf-sub');
      inT.addEventListener('input', function () { _pb.flowBoxes[i].title = inT.value; _pbfRefreshPreview(); });
      inS.addEventListener('input', function () { _pb.flowBoxes[i].sub   = inS.value; _pbfRefreshPreview(); });
      row.querySelector('.pbf-up').addEventListener('click', function () {
        if (i === 0) return;
        var tmp = _pb.flowBoxes[i - 1]; _pb.flowBoxes[i - 1] = _pb.flowBoxes[i]; _pb.flowBoxes[i] = tmp;
        _pbfRenderRows(); _pbfRefreshPreview();
      });
      row.querySelector('.pbf-dn').addEventListener('click', function () {
        if (i === _pb.flowBoxes.length - 1) return;
        var tmp = _pb.flowBoxes[i + 1]; _pb.flowBoxes[i + 1] = _pb.flowBoxes[i]; _pb.flowBoxes[i] = tmp;
        _pbfRenderRows(); _pbfRefreshPreview();
      });
      row.querySelector('.pbf-rm').addEventListener('click', function () {
        _pb.flowBoxes.splice(i, 1); _pbfRenderRows(); _pbfRefreshPreview();
      });
    })(rows[r]);
  }
}

function _pbfReadRowsToState() {
  var box = document.getElementById('pbf-rows');
  if (!box) return;
  var rows = box.querySelectorAll('.pbf-row');
  var out = [];
  for (var r = 0; r < rows.length; r++) {
    var t = rows[r].querySelector('.pbf-title').value.trim();
    var s = rows[r].querySelector('.pbf-sub').value.trim();
    if (t || s) out.push({ title: t, sub: s });
  }
  _pb.flowBoxes = out;
}

function _pbfRefreshPreview() {
  var box = document.getElementById('pbf-preview');
  if (!box) return;
  if (!_pb.flowBoxes.length) {
    box.innerHTML = '<i>Preview vazio. A proposta usará o fluxograma automático.</i>';
    return;
  }
  var parts = [];
  for (var i = 0; i < _pb.flowBoxes.length; i++) {
    var b = _pb.flowBoxes[i];
    parts.push(
      '<div style="display:inline-block;background:#fff;border:1px solid #cbd5e1;border-radius:8px;padding:6px 10px;min-width:90px;text-align:center">' +
        '<div style="font-weight:700;font-size:12px;color:#14335f">' + escapeHtml(b.title || '(sem título)') + '</div>' +
        (b.sub ? '<div style="font-size:10.5px;color:#64748b">' + escapeHtml(b.sub) + '</div>' : '') +
      '</div>'
    );
  }
  box.innerHTML = parts.join('<span style="color:#94a3b8;margin:0 4px;font-size:14px">→</span>');
}

async function _pbfFillDefault() {
  // Sugestao baseada nos itens do _pb (mesma logica do PDF backend: codigo simples).
  if (_pb.flowBoxes.length) {
    var ok = (window.SGA && SGA.confirm)
      ? await SGA.confirm('Substituir as caixas atuais pela sugestão automática?')
      : confirm('Substituir as caixas atuais pela sugestão automática?');
    if (!ok) return;
  }
  var hasProd = false, hasSrv = false;
  for (var i = 0; i < _pb.items.length; i++) {
    if (_pb.items[i].isService) hasSrv = true; else hasProd = true;
  }
  var sugestao = [];
  if (hasProd) sugestao.push({ title: 'Fornecimento', sub: 'Equipamentos Hydronix' });
  if (hasSrv)  sugestao.push({ title: 'Instalação', sub: 'Equipe Allegro / Cliente' });
  sugestao.push({ title: 'Comissionamento', sub: 'Start-up e calibração inicial' });
  sugestao.push({ title: 'Operação Assistida', sub: 'Suporte remoto e treinamento' });
  _pb.flowBoxes = sugestao;
  _pbfRenderRows();
  _pbfRefreshPreview();
}

function _pbRunAIReview() {
  var ta = document.getElementById('pb-scope-textarea');
  var scopeText = ta ? ta.value.trim() : '';
  if (!scopeText) {
    showAlert('Digite o escopo técnico antes de revisar com IA.', 'warning');
    return;
  }
  _pb.scopeText = scopeText;

  var btnAI   = document.getElementById('pb-ai-review-btn');
  var loading = document.getElementById('pb-ai-loading');
  var panel   = document.getElementById('pb-ai-review-panel');

  if (btnAI)   btnAI.style.display   = 'none';
  if (loading) loading.style.display = 'inline-flex';
  if (panel)   panel.style.display   = 'none';

  google.script.run
    .withSuccessHandler(function(res) {
      if (btnAI)   btnAI.style.display   = 'inline-flex';
      if (loading) loading.style.display = 'none';
      if (!res || !res.ok) {
        showAlert('Erro na revisão IA: ' + (res ? res.error : 'sem resposta'), 'error');
        return;
      }
      _pb.aiReview = res.data || res.review || res;
      if (panel) {
        panel.style.display = 'block';
        panel.innerHTML = _pbBuildAIReviewPanel(_pb.aiReview);
        _pbBindApplyImprovedBtn();
      }
    })
    .withFailureHandler(function(err) {
      if (btnAI)   btnAI.style.display   = 'inline-flex';
      if (loading) loading.style.display = 'none';
      showAlert('Falha na revisão IA: ' + (err.message || 'erro'), 'error');
    })
    .Api_reviewProposalScope(null, scopeText, (document.getElementById('pb-ai-intensity') && document.getElementById('pb-ai-intensity').value) || 'medio');
}

function _pbBuildAIReviewPanel(review) {
  var strengths = '';
  var suggestions = '';
  var improved = '';

  if (typeof review === 'string') {
    improved = review;
  } else if (review) {
    strengths   = review.strengths   || review.pontos_fortes   || review.strong_points || '';
    suggestions = review.suggestions || review.sugestoes       || review.improvements  || '';
    improved    = review.improved    || review.versao_melhorada || review.improved_text || '';
  }

  return [
    '<div class="pb-ai-panel">',
    '  <div style="padding:10px 16px;background:#f8fafc;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;">',
    '    <span style="font-size:13px;font-weight:600;color:var(--sga-text-default);">🤖 Revisão da IA</span>',
    '    <button class="sga-btn sga-btn--ghost sga-btn--sm" id="pb-ai-dismiss-btn">Dispensar</button>',
    '  </div>',

    strengths ? [
      '  <div class="pb-ai-section pb-ai-strengths">',
      '    <div class="pb-ai-section-title">Pontos Fortes</div>',
      '    <div class="pb-ai-text">' + escapeHtml(strengths) + '</div>',
      '  </div>'
    ].join('\n') : '',

    suggestions ? [
      '  <div class="pb-ai-section pb-ai-suggestions">',
      '    <div class="pb-ai-section-title">Sugestões</div>',
      '    <div class="pb-ai-text">' + escapeHtml(suggestions) + '</div>',
      '  </div>'
    ].join('\n') : '',

    improved ? [
      '  <div class="pb-ai-section pb-ai-improved">',
      '    <div class="pb-ai-section-title" style="display:flex;justify-content:space-between;align-items:center;">',
      '      <span>Versão Melhorada</span>',
      '      <button class="sga-btn sga-btn--primary sga-btn--sm" id="pb-apply-improved-btn">Aplicar</button>',
      '    </div>',
      '    <div class="pb-ai-text" style="margin-top:8px;" id="pb-ai-improved-text">' + escapeHtml(improved) + '</div>',
      '  </div>'
    ].join('\n') : '',

    '</div>'
  ].join('\n');
}

function _pbBindApplyImprovedBtn() {
  var btnApply = document.getElementById('pb-apply-improved-btn');
  if (btnApply) btnApply.addEventListener('click', function() {
    var improvedEl = document.getElementById('pb-ai-improved-text');
    var ta = document.getElementById('pb-scope-textarea');
    if (ta && improvedEl) {
      ta.value = improvedEl.textContent || improvedEl.innerText || '';
      _pb.scopeText = ta.value;
      showAlert('Versão melhorada aplicada ao escopo.', 'success');
    }
  });

  var btnDismiss = document.getElementById('pb-ai-dismiss-btn');
  if (btnDismiss) btnDismiss.addEventListener('click', function() {
    var panel = document.getElementById('pb-ai-review-panel');
    if (panel) panel.style.display = 'none';
  });
}

function _pbSaveStep4Fields() {

  var validityEl   = document.getElementById('pb-validity-days');
  var obsEl        = document.getElementById('pb-observations');

  if (paymentEl)  _pb.paymentTerms  = paymentEl.value;
  if (deliveryEl) _pb.deliveryDays  = parseInt(deliveryEl.value, 10) || 45;
  if (validityEl) _pb.validityDays  = parseInt(validityEl.value, 10) || 10;
  if (obsEl)      _pb.observations  = obsEl.value;
}

// ------------------------------------------------------------
// Save proposal — called from step 4 action buttons
// ------------------------------------------------------------
function _pbSaveProposal(andPrint) {
  var btnDraft = document.getElementById('pb-save-draft-btn');
  var btnPrint = document.getElementById('pb-save-print-btn');

  if (btnDraft) { btnDraft.disabled = true; btnDraft.textContent = 'Salvando...'; }
  if (btnPrint) { btnPrint.disabled = true; btnPrint.textContent = 'Salvando...'; }

  // Calculate total
  var itemsTotal = 0;
  for (var i = 0; i < _pb.items.length; i++) {
    itemsTotal += _pb.items[i].total || 0;
  }
  var grandTotal = itemsTotal + (_pb.startupValue || 0);

  var payload = {
    type:           _pb.type,
    client_id:      _pb.clientId,
    client_name:    _pb.clientName,
    location:       _pb.location,
    responsible:    _pb.responsible,
    // FB-19: snapshot do contato-responsavel (FK + telefone + email)
    contact_id:     _pb.contact_id,
    contact_phone:  _pb.contact_phone,
    contact_email:  _pb.contact_email,
    // FB-20/26/27 — Levantamento tecnico migrado de Oportunidade
    product:            _pb.product,
    max_temp:           _pb.max_temp,
    qty_sensors_xt:     _pb.qty_sensors_xt,
    qty_sensors_ht:     _pb.qty_sensors_ht,
    qty_sensors_probe:  _pb.qty_sensors_probe,
    installation_point: _pb.installation_point,
    automation_detail:  _pb.automation_detail,
    hydro_view:         _pb.hydro_view,
    infra_distance:     _pb.infra_distance,
    tamanho_infra:      _pb.tamanho_infra,
    tech_notes:         _pb.tech_notes,
    items:          _pb.items,
    scope_text:     _pb.scopeText,
    // FB-21: fluxograma editado no Step 3 do wizard (vazio = backend usa automatico)
    flow_json:      (_pb.flowBoxes && _pb.flowBoxes.length) ? JSON.stringify(_pb.flowBoxes) : '',
    startup_value:  _pb.startupValue || 0,
    payment_terms:  _pb.paymentTerms,
    delivery_days:  _pb.deliveryDays,
    validity_days:  _pb.validityDays,
    observations:   _pb.observations,
    ai_review:      _pb.aiReview ? JSON.stringify(_pb.aiReview) : ''
  };

  google.script.run
    .withSuccessHandler(function(res) {
      if (btnDraft) { btnDraft.disabled = false; btnDraft.textContent = '💾 Salvar Rascunho'; }
      if (btnPrint) { btnPrint.disabled = false; btnPrint.textContent = '🖨️ Gerar e Imprimir'; }

      if (!res || !res.ok) {
        showAlert('Erro ao salvar proposta: ' + (res ? res.error : 'desconhecido'), 'error');
        return;
      }

      var created = res.data || {};
      var proposalId = created.id || res.id; // API em camadas retorna {ok, data:{id,...}}
      var propLabel = created.number || proposalId;
      showAlert('Proposta ' + propLabel + ' salva com sucesso!', 'success');

      if (andPrint) {
        _printProposal(proposalId);
      } else {
        showSection('quotes');
      }
    })
    .withFailureHandler(function(err) {
      if (btnDraft) { btnDraft.disabled = false; btnDraft.textContent = '💾 Salvar Rascunho'; }
      if (btnPrint) { btnPrint.disabled = false; btnPrint.textContent = '🖨️ Gerar e Imprimir'; }
      showAlert('Falha ao salvar proposta: ' + (err.message || 'erro desconhecido'), 'error');
    })
    .Api_createProposal(payload);
}

/* ===========================================================================
   EDITOR DE FLUXOGRAMA DA PROPOSTA (prefixo _pfl)
   Caixas com título/subtítulo: criar, duplicar, excluir, reordenar.
   Vazio = a proposta usa o fluxo automático derivado dos itens.
   =========================================================================== */

var _pflPropId = null;

function _pflEnsureModal() {
  if (document.getElementById('pfl-modal')) return;
  var html =
    '<div class="sga-modal-backdrop hidden" id="pfl-modal" style="z-index:1150">' +
      '<div class="modal" style="max-width:720px;width:95%;max-height:90vh;overflow:auto">' +
        '<div class="card"><div class="card-header" style="display:flex;justify-content:space-between;align-items:center">' +
          '<div class="card-title">🧩 Fluxograma da solução</div>' +
          '<button class="sga-btn sga-btn--ghost sga-btn--sm" id="pfl-close">✕</button>' +
        '</div>' +
        '<div class="card-body">' +
          '<p style="font-size:12px;color:#64748b;margin:0 0 10px">As caixas aparecem na seção Escopo da proposta, ligadas por setas, na ordem abaixo. Deixe vazio e salve para voltar ao fluxo automático.</p>' +
          '<div id="pfl-rows"></div>' +
          '<div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">' +
            '<button class="sga-btn sga-btn--ghost sga-btn--sm" id="pfl-add">+ caixa</button>' +
            '<button class="sga-btn sga-btn--ghost sga-btn--sm" id="pfl-default">↺ Carregar padrão (dos itens)</button>' +
            '<button class="sga-btn sga-btn--primary sga-btn--sm" id="pfl-save" style="margin-left:auto">Salvar fluxograma</button>' +
          '</div>' +
          '<div id="pfl-preview" style="margin-top:14px"></div>' +
        '</div></div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('pfl-close').addEventListener('click', _pflClose);
  document.getElementById('pfl-add').addEventListener('click', function () { _pflAddRow('', ''); _pflPreview(); });
  document.getElementById('pfl-default').addEventListener('click', _pflLoadDefault);
  document.getElementById('pfl-save').addEventListener('click', _pflSave);
  document.getElementById('pfl-modal').addEventListener('click', function (e) {
    if (e.target === document.getElementById('pfl-modal')) _pflClose();
  });
}

function _pflClose() {
  var m = document.getElementById('pfl-modal');
  if (m) { m.classList.add('hidden'); m.style.display = 'none'; }
}

function _pflOpen(proposalId) {
  _pflPropId = proposalId;
  _pflEnsureModal();
  var m = document.getElementById('pfl-modal');
  m.classList.remove('hidden'); m.style.display = 'flex';
  document.getElementById('pfl-rows').innerHTML = '<div class="spinner-ring"></div>';
  google.script.run.withSuccessHandler(function (r) {
    var p = (r && r.ok && r.data) ? r.data : null;
    var boxes = [];
    if (p && p.flow_json) { try { boxes = JSON.parse(p.flow_json) || []; } catch (e) {} }
    document.getElementById('pfl-rows').innerHTML = '';
    if (boxes.length) {
      for (var i = 0; i < boxes.length; i++) _pflAddRow(boxes[i].title || '', boxes[i].sub || '');
      _pflPreview();
    } else {
      _pflLoadDefault();
    }
  }).withFailureHandler(function (e) {
    showAlert('Erro ao carregar: ' + (e.message || e), 'error');
  }).Api_getProposal(proposalId);
}

function _pflLoadDefault() {
  document.getElementById('pfl-rows').innerHTML = '<div class="spinner-ring"></div>';
  google.script.run.withSuccessHandler(function (r) {
    document.getElementById('pfl-rows').innerHTML = '';
    var boxes = (r && r.ok && r.data) ? r.data : [];
    for (var i = 0; i < boxes.length; i++) _pflAddRow(boxes[i].title, boxes[i].sub);
    _pflPreview();
  }).Api_propGetDefaultFlow(_pflPropId);
}

function _pflAddRow(title, sub) {
  var row = document.createElement('div');
  row.className = 'pfl-row';
  row.style.cssText = 'display:flex;gap:6px;align-items:center;margin-bottom:6px';
  row.innerHTML =
    '<input class="form-input pfl-title" type="text" placeholder="título da caixa" value="' + escapeHtml(title || '') + '" style="flex:1.1">' +
    '<input class="form-input pfl-sub" type="text" placeholder="subtítulo (opcional)" value="' + escapeHtml(sub || '') + '" style="flex:1.4">' +
    '<button class="sga-btn sga-btn--ghost sga-btn--sm pfl-up" title="subir">↑</button>' +
    '<button class="sga-btn sga-btn--ghost sga-btn--sm pfl-down" title="descer">↓</button>' +
    '<button class="sga-btn sga-btn--ghost sga-btn--sm pfl-dup" title="duplicar">⎘</button>' +
    '<button class="sga-btn sga-btn--ghost sga-btn--sm pfl-del" title="excluir">🗑</button>';
  row.querySelector('.pfl-up').addEventListener('click', function () {
    if (row.previousElementSibling) row.parentNode.insertBefore(row, row.previousElementSibling);
    _pflPreview();
  });
  row.querySelector('.pfl-down').addEventListener('click', function () {
    if (row.nextElementSibling) row.parentNode.insertBefore(row.nextElementSibling, row);
    _pflPreview();
  });
  row.querySelector('.pfl-dup').addEventListener('click', function () {
    _pflAddRow(row.querySelector('.pfl-title').value, row.querySelector('.pfl-sub').value);
    row.parentNode.insertBefore(row.parentNode.lastElementChild, row.nextElementSibling);
    _pflPreview();
  });
  row.querySelector('.pfl-del').addEventListener('click', function () {
    row.parentNode.removeChild(row); _pflPreview();
  });
  row.querySelector('.pfl-title').addEventListener('input', _pflPreview);
  row.querySelector('.pfl-sub').addEventListener('input', _pflPreview);
  document.getElementById('pfl-rows').appendChild(row);
}

function _pflCollect() {
  var boxes = [];
  var rows = document.querySelectorAll('#pfl-rows .pfl-row');
  for (var i = 0; i < rows.length; i++) {
    var t = rows[i].querySelector('.pfl-title').value.trim();
    if (t) boxes.push({ title: t, sub: rows[i].querySelector('.pfl-sub').value.trim() });
  }
  return boxes;
}

function _pflPreview() {
  var boxes = _pflCollect();
  var html = '';
  for (var i = 0; i < boxes.length; i++) {
    if (i) html += '<span style="color:#1a56db;font-weight:800;padding:0 4px">→</span>';
    html += '<span style="display:inline-block;border:1.5px solid #1a56db;background:#f3f7ff;border-radius:8px;padding:4px 8px;font-size:11px;text-align:center;vertical-align:middle">' +
      '<b style="color:#14335f">' + escapeHtml(boxes[i].title) + '</b>' +
      (boxes[i].sub ? '<br><span style="color:#64748b;font-size:10px">' + escapeHtml(boxes[i].sub) + '</span>' : '') + '</span>';
  }
  document.getElementById('pfl-preview').innerHTML = html ? '<div style="font-size:11px;color:#94a3b8;margin-bottom:4px">Prévia:</div>' + html : '';
}

function _pflSave() {
  var boxes = _pflCollect();
  var btn = document.getElementById('pfl-save');
  btn.disabled = true; btn.textContent = 'Salvando...';
  google.script.run.withSuccessHandler(function (res) {
    btn.disabled = false; btn.textContent = 'Salvar fluxograma';
    if (!res || !res.ok) { showAlert('Erro: ' + (res ? res.error : '?'), 'error'); return; }
    showAlert(boxes.length ? 'Fluxograma salvo — sai na próxima impressão da proposta.' : 'Fluxograma limpo — a proposta volta ao fluxo automático.', 'success');
    _pflClose();
  }).withFailureHandler(function (e) {
    btn.disabled = false; btn.textContent = 'Salvar fluxograma';
    showAlert('Falha: ' + (e.message || e), 'error');
  }).Api_updateProposal(_pflPropId, { flow_json: boxes.length ? JSON.stringify(boxes) : '' });
}


/* ===========================================================================
   EDITOR COMPLETO DA PROPOSTA (prefixo _ped)
   Autonomia total enquanto em elaboração/revisão; o servidor trava a partir
   de APROVADA_ENVIO (imutável — mudanças = nova revisão Rn+1).
   =========================================================================== */

var _pedPropId = null;
var _pedProducts = [];

function _pedEnsureModal() {
  if (document.getElementById('ped-modal')) return;
  document.body.insertAdjacentHTML('beforeend',
    '<div class="sga-modal-backdrop hidden" id="ped-modal" style="z-index:1140">' +
      '<div class="modal" style="max-width:920px;width:96%;max-height:94vh;overflow:auto">' +
        '<div class="card"><div class="card-header" style="display:flex;justify-content:space-between;align-items:center">' +
          '<div class="card-title" id="ped-title">✏️ Editar proposta</div>' +
          '<button class="sga-btn sga-btn--ghost sga-btn--sm" id="ped-close">✕</button>' +
        '</div><div class="card-body" id="ped-body"></div></div>' +
      '</div></div>');
  document.getElementById('ped-close').addEventListener('click', _pedClose);
  document.getElementById('ped-modal').addEventListener('click', function (e) {
    if (e.target === document.getElementById('ped-modal')) _pedClose();
  });
}

function _pedClose() {
  var m = document.getElementById('ped-modal');
  if (m) { m.classList.add('hidden'); m.style.display = 'none'; }
}

function _pedOpen(proposalId) {
  _pedPropId = proposalId;
  _pedEnsureModal();
  var m = document.getElementById('ped-modal');
  m.classList.remove('hidden'); m.style.display = 'flex';
  document.getElementById('ped-body').innerHTML = '<div class="spinner-ring" style="margin:20px auto"></div>';

  var build = function (p) {
    var travados = ['APROVADA_ENVIO', 'ENVIADA', 'FECHADA', 'RECUSADA', 'SUBSTITUIDA', 'CANCELADA'];
    var locked = travados.indexOf(p.status) !== -1;
    document.getElementById('ped-title').textContent = '✏️ ' + (p.number || p.id) + ' · ' + (p.revision_num || 'R0') + ' — ' + p.status;
    var b = document.getElementById('ped-body');
    b.innerHTML =
      (locked ? '<div style="background:#fef3c7;border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:13px">🔒 Proposta <b>' + escapeHtml(p.status) + '</b> é imutável (rastreabilidade). Para alterar, crie uma <b>nova revisão</b>' + (p.status === 'ENVIADA' ? ' com o botão 📄+ na lista' : '') + '.</div>' : '') +
      '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
        '<label style="font-size:12px;flex:1;min-width:160px">Local<br><input class="form-input" id="ped-location" value="' + escapeHtml(p.location || '') + '"></label>' +
        '<label style="font-size:12px;flex:1;min-width:160px">A/C (responsável no cliente)<br><input class="form-input" id="ped-resp" value="' + escapeHtml(p.responsible || '') + '"></label>' +
        '<label style="font-size:12px;width:130px">Entrega (dias úteis)<br><input class="form-input" id="ped-delivery" type="number" min="0" value="' + (p.delivery_days || '') + '"></label>' +
        '<label style="font-size:12px;width:130px">Validade (dias)<br><input class="form-input" id="ped-validity" type="number" min="0" value="' + (p.validity_days || '') + '"></label>' +
      '</div>' +
      '<label style="font-size:12px;display:block;margin-top:8px">Condições de pagamento<br><input class="form-input" id="ped-payment" value="' + escapeHtml(p.payment_terms || '') + '"></label>' +

      '<div class="form-label" style="font-weight:700;margin:14px 0 4px">Itens</div>' +
      '<div id="ped-items"></div>' +
      '<button class="sga-btn sga-btn--ghost sga-btn--sm" id="ped-add-item"' + (locked ? ' disabled' : '') + '>+ item</button>' +
      '<div style="display:flex;gap:14px;align-items:center;margin-top:8px;flex-wrap:wrap">' +
        '<label style="font-size:12px">Start-up (R$)<br><input class="form-input" id="ped-startup" type="number" min="0" step="0.01" value="' + (p.startup_value || 0) + '" style="width:140px"></label>' +
        '<div style="margin-left:auto;font-weight:800;color:#14335f" id="ped-total"></div>' +
      '</div>' +

      '<label style="font-size:12px;display:block;margin-top:12px">Escopo de fornecimento<br><textarea class="form-input" id="ped-scope" rows="5">' + escapeHtml(p.scope_text || '') + '</textarea></label>' +
      '<label style="font-size:12px;display:block;margin-top:8px">Observações<br><textarea class="form-input" id="ped-obs" rows="3">' + escapeHtml(p.observations || '') + '</textarea></label>' +

      '<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">' +
        '<button class="sga-btn sga-btn--ghost sga-btn--sm" id="ped-flow">🧩 Fluxograma</button>' +
        '<button class="sga-btn sga-btn--ghost sga-btn--sm" id="ped-print">🖨️ Visualizar</button>' +
        '<button class="sga-btn sga-btn--primary" id="ped-save" style="margin-left:auto"' + (locked ? ' disabled' : '') + '>Salvar alterações</button>' +
      '</div>';

    var itens = [];
    try { itens = JSON.parse(p.items_json || '[]') || []; } catch (e) {}
    for (var i = 0; i < itens.length; i++) _pedAddItemRow(itens[i], locked);
    _pedRecalc();

    document.getElementById('ped-add-item').addEventListener('click', function () { _pedAddItemRow(null, false); });
    document.getElementById('ped-startup').addEventListener('input', _pedRecalc);
    document.getElementById('ped-flow').addEventListener('click', function () { _pflOpen(_pedPropId); });
    document.getElementById('ped-print').addEventListener('click', function () { _printProposal(_pedPropId); });
    document.getElementById('ped-save').addEventListener('click', _pedSave);
  };

  var load = function () {
    google.script.run.withSuccessHandler(function (r) {
      if (!r || !r.ok || !r.data) { showAlert('Erro ao carregar proposta.', 'error'); _pedClose(); return; }
      build(r.data);
    }).Api_getProposal(proposalId);
  };

  if (_pedProducts.length) { load(); return; }
  google.script.run.withSuccessHandler(function (r) {
    _pedProducts = (r && r.ok && r.data) ? r.data : [];
    load();
  }).withFailureHandler(load).Api_getProducts();
}

function _pedProductOptions(code) {
  var html = '<option value="">— código —</option>';
  for (var i = 0; i < _pedProducts.length; i++) {
    html += '<option value="' + escapeHtml(_pedProducts[i].code) + '"' + (_pedProducts[i].code === code ? ' selected' : '') + '>' + escapeHtml(_pedProducts[i].code) + '</option>';
  }
  return html;
}

function _pedAddItemRow(item, locked) {
  item = item || { code: '', description: '', ncm: '', qty: 1, unit_price: 0 };
  var row = document.createElement('div');
  row.className = 'ped-item-row';
  row.style.cssText = 'display:flex;gap:6px;align-items:center;margin-bottom:6px';
  row.innerHTML =
    '<select class="form-input ped-it-code" style="width:140px"' + (locked ? ' disabled' : '') + '>' + _pedProductOptions(item.code) + '</select>' +
    '<input class="form-input ped-it-desc" value="' + escapeHtml(item.description || '') + '" placeholder="descrição" style="flex:1"' + (locked ? ' disabled' : '') + '>' +
    '<input class="form-input ped-it-qty" type="number" min="1" value="' + (item.qty || 1) + '" style="width:64px" title="qtde"' + (locked ? ' disabled' : '') + '>' +
    '<input class="form-input ped-it-price" type="number" min="0" step="0.01" value="' + (item.unit_price || 0) + '" style="width:120px" title="preço unit. R$"' + (locked ? ' disabled' : '') + '>' +
    '<button class="sga-btn sga-btn--ghost sga-btn--sm ped-it-dup" title="duplicar"' + (locked ? ' disabled' : '') + '>⎘</button>' +
    '<button class="sga-btn sga-btn--ghost sga-btn--sm ped-it-del" title="excluir"' + (locked ? ' disabled' : '') + '>🗑</button>';
  row.querySelector('.ped-it-code').addEventListener('change', function () {
    var prod = null;
    for (var i = 0; i < _pedProducts.length; i++) { if (_pedProducts[i].code === this.value) { prod = _pedProducts[i]; break; } }
    if (prod) {
      row.querySelector('.ped-it-desc').value = prod.description || '';
      if (!parseFloat(row.querySelector('.ped-it-price').value)) {
        row.querySelector('.ped-it-price').value = prod.selling_price_brl || 0;
      }
      _pedRecalc();
    }
  });
  row.querySelector('.ped-it-qty').addEventListener('input', _pedRecalc);
  row.querySelector('.ped-it-price').addEventListener('input', _pedRecalc);
  row.querySelector('.ped-it-dup').addEventListener('click', function () { _pedAddItemRow(_pedRowToItem(row), false); _pedRecalc(); });
  row.querySelector('.ped-it-del').addEventListener('click', function () { row.parentNode.removeChild(row); _pedRecalc(); });
  document.getElementById('ped-items').appendChild(row);
}

function _pedRowToItem(row) {
  var code = row.querySelector('.ped-it-code').value;
  var prod = null;
  for (var i = 0; i < _pedProducts.length; i++) { if (_pedProducts[i].code === code) { prod = _pedProducts[i]; break; } }
  var qty = parseFloat(row.querySelector('.ped-it-qty').value) || 1;
  var up  = parseFloat(row.querySelector('.ped-it-price').value) || 0;
  return {
    code: code,
    description: row.querySelector('.ped-it-desc').value,
    ncm: prod ? (prod.ncm || '') : '',
    qty: qty, unit_price: up, total: Math.round(qty * up * 100) / 100
  };
}

function _pedCollectItems() {
  var items = [];
  var rows = document.querySelectorAll('#ped-items .ped-item-row');
  for (var i = 0; i < rows.length; i++) {
    var it = _pedRowToItem(rows[i]);
    if (it.code || it.description) items.push(it);
  }
  return items;
}

function _pedRecalc() {
  var items = _pedCollectItems();
  var total = 0;
  for (var i = 0; i < items.length; i++) total += items[i].total;
  total += parseFloat(document.getElementById('ped-startup').value) || 0;
  document.getElementById('ped-total').textContent = 'TOTAL: ' + formatBRL(total);
}

function _pedSave() {
  var items = _pedCollectItems();
  var startup = parseFloat(document.getElementById('ped-startup').value) || 0;
  var total = startup;
  for (var i = 0; i < items.length; i++) total += items[i].total;
  var btn = document.getElementById('ped-save');
  btn.disabled = true; btn.textContent = 'Salvando...';
  google.script.run.withSuccessHandler(function (res) {
    btn.disabled = false; btn.textContent = 'Salvar alterações';
    if (!res || !res.ok) { showAlert('Erro: ' + (res ? res.error : '?'), 'error'); return; }
    showAlert('Proposta atualizada!', 'success');
    _pedClose();
    if (typeof _loadProposals === 'function') _loadProposals();
    else if (typeof renderQuotes === 'function') { var area = document.getElementById('content-area'); if (area) renderQuotes(area); }
  }).withFailureHandler(function (e) {
    btn.disabled = false; btn.textContent = 'Salvar alterações';
    showAlert('Falha: ' + (e.message || e), 'error');
  }).Api_updateProposal(_pedPropId, {
    location:      document.getElementById('ped-location').value,
    responsible:   document.getElementById('ped-resp').value,
    delivery_days: document.getElementById('ped-delivery').value,
    validity_days: document.getElementById('ped-validity').value,
    payment_terms: document.getElementById('ped-payment').value,
    scope_text:    document.getElementById('ped-scope').value,
    observations:  document.getElementById('ped-obs').value,
    items_json:    JSON.stringify(items),
    startup_value: startup,
    total_value:   Math.round(total * 100) / 100
  });
}

async function _pedCriarRevisao(proposalId) {
  var ok = await SGA.confirm('Criar nova revisão (Rn+1)? A proposta atual fica SUBSTITUÍDA (preservada para rastreabilidade) e a revisão nasce editável.', { okLabel: 'Criar revisão' });
  if (!ok) return;
  google.script.run.withSuccessHandler(function (res) {
    if (!res || !res.ok) { showAlert('Erro: ' + (res ? res.error : '?'), 'error'); return; }
    var nova = res.data || {};
    showAlert('Revisão ' + (nova.revision_num || '') + ' criada (' + (nova.number || nova.id) + ') — edite e siga o fluxo de revisão.', 'success');
    if (typeof _loadProposals === 'function') _loadProposals();
    _pedOpen(nova.id);
  }).withFailureHandler(function (e) {
    showAlert('Falha: ' + (e.message || e), 'error');
  }).Api_propCriarRevisao(proposalId);
}

/* ===========================================================================
   ETAPAS DO FUNIL (prefixo _pst) — avanço de status com as regras do servidor
   =========================================================================== */

var _PST_NEXT = {
  'DEMANDA':         ['LEVANTAMENTO', 'PROPOSTA_GERADA'],
  'LEVANTAMENTO':    ['PROPOSTA_GERADA'],
  'PROPOSTA_GERADA': ['EM_REVISAO'],
  'EM_REVISAO':      ['APROVADA_ENVIO'],
  'APROVADA_ENVIO':  ['ENVIADA'],
  'ENVIADA':         ['FECHADA', 'RECUSADA']
};
var _PST_LABEL = {
  'LEVANTAMENTO': '📐 Levantamento técnico', 'PROPOSTA_GERADA': '📄 Proposta gerada',
  'EM_REVISAO': '🔍 Enviar para revisão (Financeiro)', 'APROVADA_ENVIO': '✅ Aprovar para envio',
  'ENVIADA': '📧 Marcar como ENVIADA ao cliente', 'FECHADA': '🏆 FECHADA — negócio ganho!',
  'RECUSADA': '❌ Recusada (informar motivo)'
};

function _pstOpen(proposalId) {
  google.script.run.withSuccessHandler(function (r) {
    if (!r || !r.ok || !r.data) { showAlert('Erro ao carregar.', 'error'); return; }
    var p = r.data;
    var nexts = _PST_NEXT[p.status] || [];
    if (!nexts.length) { showAlert('Status ' + p.status + ' é terminal — sem próximas etapas.' + (p.status === 'ENVIADA' ? '' : ' Use 📄+ para revisar uma ENVIADA.'), 'info'); return; }

    // Monta corpo do modal com botoes de escolha (uma janela so para todo o fluxo)
    var bodyHtml = '<p style="margin:0 0 12px 0;color:var(--sga-text-muted)">Proposta <strong>' + (p.number || p.id) + '</strong> está em <strong>' + p.status + '</strong>. Escolha a próxima etapa:</p>';
    bodyHtml += '<div id="pst-choice-list" style="display:flex;flex-direction:column;gap:8px">';
    for (var i = 0; i < nexts.length; i++) {
      bodyHtml += '<button type="button" class="sga-btn sga-btn--secondary" data-pst-target="' + nexts[i] + '" style="justify-content:flex-start;text-align:left">' + _PST_LABEL[nexts[i]] + '</button>';
    }
    bodyHtml += '</div>';
    bodyHtml += '<div id="pst-motivo-wrap" style="display:none;margin-top:12px">' +
                  '<div class="sga-form-group">' +
                    '<label class="sga-form-label">Motivo da perda <span class="sga-form-required">*</span></label>' +
                    '<textarea id="pst-motivo-input" class="sga-form-textarea" rows="3" placeholder="Obrigatório para aprendizado do funil..."></textarea>' +
                  '</div>' +
                '</div>';

    var modalHandle = SGA.openModal({
      id: 'pst-modal',
      title: 'Avançar status',
      size: 'sm',
      body: bodyHtml,
      footer: [
        { label: 'Cancelar', variant: 'ghost', onClick: 'close' }
      ]
    });

    var modalEl = modalHandle.modal;
    var chosen = null;

    modalEl.querySelectorAll('[data-pst-target]').forEach(function (btn) {
      btn.addEventListener('click', async function () {
        var alvo = btn.getAttribute('data-pst-target');
        var opcoes = {};

        if (alvo === 'RECUSADA') {
          if (chosen !== 'RECUSADA') {
            // 1o clique: mostra textarea
            chosen = 'RECUSADA';
            modalEl.querySelector('#pst-motivo-wrap').style.display = '';
            modalEl.querySelector('#pst-choice-list').style.display = 'none';
            // troca rodape pra ter Confirmar
            var footer = modalEl.querySelector('.sga-modal__footer');
            footer.innerHTML = '<button class="sga-btn sga-btn--ghost" id="pst-back-btn">Voltar</button><button class="sga-btn sga-btn--danger" id="pst-confirm-recusada">Confirmar recusa</button>';
            modalEl.querySelector('#pst-back-btn').addEventListener('click', function () {
              chosen = null;
              modalEl.querySelector('#pst-motivo-wrap').style.display = 'none';
              modalEl.querySelector('#pst-choice-list').style.display = '';
              footer.innerHTML = '<button class="sga-btn sga-btn--ghost" type="button">Cancelar</button>';
              footer.firstChild.addEventListener('click', function () { modalHandle.close(); });
            });
            modalEl.querySelector('#pst-confirm-recusada').addEventListener('click', function () {
              var motivo = (modalEl.querySelector('#pst-motivo-input').value || '').trim();
              if (!motivo) { SGA.toast('Informe o motivo da perda', 'warning'); return; }
              opcoes.motivo_perda = motivo;
              _pstExecutar(proposalId, 'RECUSADA', opcoes, modalHandle);
            });
            return;
          }
        }

        if (alvo === 'FECHADA') {
          var okFech = await SGA.confirm('Confirmar FECHADA? Isso registra o aceite comercial, cria o PROJETO e libera a geração de PO.', { okLabel: 'Confirmar FECHADA' });
          if (!okFech) return;
        }

        _pstExecutar(proposalId, alvo, opcoes, modalHandle);
      });
    });
  }).Api_getProposal(proposalId);
}

function _pstExecutar(proposalId, alvo, opcoes, modalHandle) {
  google.script.run.withSuccessHandler(function (res) {
    if (!res || !res.ok) { showAlert('⛔ ' + (res ? res.error : '?'), 'error'); return; }
    showAlert('Proposta avançou para ' + alvo + '!', 'success');
    if (modalHandle) modalHandle.close();
    if (typeof _loadProposals === 'function') _loadProposals();
  }).withFailureHandler(function (e) {
    showAlert('Falha: ' + (e.message || e), 'error');
  }).Api_propUpdateStatus(proposalId, alvo, opcoes);
}

</script>
