<div id="map-view" class="module-view" style="display:none">
  <div class="module-header">
    <h2>&#x1F5FA;&#xFE0F; Mapa de Clientes</h2>
    <div style="display:flex;gap:8px;align-items:center">
      <button onclick="loadMap()" class="sga-btn sga-btn--primary sga-btn--sm">Atualizar</button>
      <button onclick="Api_companiesGeocodeBatch_run()" class="sga-btn sga-btn--secondary sga-btn--sm" id="btn-geocode">Geocodificar Pendentes</button>
    </div>
  </div>

  <div id="map-filters" style="margin:8px 0;display:flex;gap:16px;flex-wrap:wrap;align-items:center">
    <label style="display:flex;align-items:center;gap:4px;cursor:pointer">
      <input type="checkbox" id="filt-ativo" checked onchange="_mapOnFilterChange()"> Ativo
    </label>
    <label style="display:flex;align-items:center;gap:4px;cursor:pointer">
      <input type="checkbox" id="filt-prospect" checked onchange="_mapOnFilterChange()"> Prospect
    </label>
    <label style="display:flex;align-items:center;gap:4px;cursor:pointer">
      <input type="checkbox" id="filt-inativo" onchange="_mapOnFilterChange()"> Inativo
    </label>
    <div style="display:flex;gap:12px;align-items:center;margin-left:8px;font-size:12px;color:var(--sga-text-muted)">
      <span style="display:inline-flex;align-items:center;gap:4px">
        <span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#f59e0b;border:2px solid #fff;box-shadow:0 0 0 1px #94a3b8"></span>
        Org&acirc;nico
      </span>
      <span style="display:inline-flex;align-items:center;gap:4px">
        <span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:#94a3b8;border:2px solid #fff;box-shadow:0 0 0 1px #64748b"></span>
        Inorg&acirc;nico / Prospect
      </span>
    </div>
    <span style="margin-left:auto;font-size:13px;color:var(--sga-text-muted)" id="map-count-label"></span>
  </div>

  <div id="map-container" style="width:100%;height:500px;background:var(--sga-bg-surface-alt);border-radius:var(--sga-radius-md);border:1px solid var(--sga-border-default);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative">
    <p style="color:var(--sga-text-soft);font-size:14px">Clique em <strong>Atualizar</strong> para carregar o mapa.</p>
  </div>

  <div id="map-list" style="margin-top:16px"></div>
</div>

<script>
'use strict';

var _mapCompanies = [];
var _mapLeaflet = null;        // instância do mapa Leaflet
var _mapMarkersLayer = null;   // layer group dos marcadores
var _mapTileLayer = null;      // tile layer atual (light/dark)
var _mapLibLoading = null;     // Promise de carregamento da CDN (1x só)

/** Carrega empresas do backend e renderiza. */
function loadMap() {
  var container = document.getElementById('map-container');
  // só mostra spinner se o mapa ainda não foi criado (preserva mapa ao recarregar)
  if (!_mapLeaflet) {
    if (window.SGA && SGA.skeleton) {
      SGA.skeleton(container, { type: 'card' });
    } else {
      container.innerHTML = '<div class="sga-skeleton sga-skeleton--card" style="width:100%;height:100%"></div>';
    }
  }

  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.ok) {
        _mapCompanies = res.data || [];
        renderMapList();
        renderMapEmbed();
      } else {
        showToast('Erro ao carregar empresas: ' + (res ? res.error : 'resposta inválida'));
        container.innerHTML = '<p style="color:var(--sga-color-danger);padding:20px">Erro ao carregar dados.</p>';
      }
    })
    .withFailureHandler(function(err) {
      showToast('Erro ao carregar mapa: ' + err);
      container.innerHTML = '<p style="color:var(--sga-color-danger);padding:20px">Falha na comunicação com o servidor.</p>';
    })
    .Api_getCompanies();
}

/** Handler unificado para mudança de filtro: re-renderiza lista E marcadores. */
function _mapOnFilterChange() {
  renderMapList();
  _mapRenderMarkers();
}

/** Filtra empresas conforme checkboxes. */
function _mapGetFiltered() {
  var filtAtivo    = document.getElementById('filt-ativo')    ? document.getElementById('filt-ativo').checked    : true;
  var filtProspect = document.getElementById('filt-prospect') ? document.getElementById('filt-prospect').checked : true;
  var filtInativo  = document.getElementById('filt-inativo')  ? document.getElementById('filt-inativo').checked  : false;

  return _mapCompanies.filter(function(c) {
    var tipo = String(c.client_type || '').toLowerCase();
    var ativo = String(c.active || '').toUpperCase() === 'TRUE' || c.active === true;

    if (!ativo && !filtInativo) return false;
    if (ativo) {
      if (tipo === 'prospect' && !filtProspect) return false;
      if (tipo !== 'prospect' && !filtAtivo) return false;
    }
    return true;
  });
}

/** Determina se um cliente é "orgânico" (amarelo) ou "inorgânico/prospect" (cinza). */
function _mapIsOrganico(c) {
  var tipo = String(c.client_type || '').toLowerCase();
  var ativo = String(c.active || '').toUpperCase() === 'TRUE' || c.active === true;
  // Orgânico = cliente ativo que NÃO é prospect (Empresa, Órgão, Produtor, Cooperativa).
  // Prospect e inativos são considerados "inorgânicos" (cinza).
  return ativo && tipo !== 'prospect';
}

/** Renderiza tabela de clientes geocodificados. */
function renderMapList() {
  var filtered = _mapGetFiltered();
  var comGeo   = filtered.filter(function(c) { return c.lat && c.lng; });
  var semGeo   = filtered.filter(function(c) { return !c.lat || !c.lng; });

  var label = document.getElementById('map-count-label');
  if (label) {
    label.textContent = comGeo.length + ' geocodificados · ' + semGeo.length + ' pendentes';
  }

  if (!filtered.length) {
    document.getElementById('map-list').innerHTML =
      '<div class="sga-empty sga-empty--compact">' +
        '<div class="sga-empty__icon">🔍</div>' +
        '<h3 class="sga-empty__title">Nenhuma empresa</h3>' +
        '<p class="sga-empty__text">Nenhuma empresa encontrada com os filtros selecionados.</p>' +
      '</div>';
    return;
  }

  var html = '<h4 style="font-size:13px;font-weight:600;color:var(--sga-text-default);margin:0 0 8px">Clientes geocodificados (' + comGeo.length + ')</h4>';
  if (comGeo.length) {
    html += '<div class="sga-table-wrap"><table class="sga-table"><thead><tr>'
      + '<th class="sga-table__th">Empresa</th>'
      + '<th class="sga-table__th">Cidade</th>'
      + '<th class="sga-table__th">Tipo</th>'
      + '<th class="sga-table__th">Endere&ccedil;o</th>'
      + '<th class="sga-table__th">Dist&acirc;ncia</th>'
      + '<th class="sga-table__th">Tempo</th>'
      + '</tr></thead><tbody>';
    comGeo.forEach(function(c) {
      html += '<tr class="sga-table__row">'
        + '<td class="sga-table__td">' + _esc(c.name) + '</td>'
        + '<td class="sga-table__td">' + _esc(c.city) + '</td>'
        + '<td class="sga-table__td">' + _esc(c.client_type) + '</td>'
        + '<td class="sga-table__td" style="max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + _esc(c.address) + '</td>'
        + '<td class="sga-table__td">' + (c.distancia_base_km ? Number(c.distancia_base_km).toFixed(0) + ' km' : '&mdash;') + '</td>'
        + '<td class="sga-table__td">' + (c.tempo_viagem_min  ? c.tempo_viagem_min + ' min' : '&mdash;') + '</td>'
        + '</tr>';
    });
    html += '</tbody></table></div>';
  }

  if (semGeo.length) {
    html += '<h4 style="font-size:13px;font-weight:600;color:var(--sga-text-muted);margin:16px 0 8px">Sem geocodifica&ccedil;&atilde;o (' + semGeo.length + ')</h4>';
    html += '<div class="sga-table-wrap"><table class="sga-table"><thead><tr>'
      + '<th class="sga-table__th">Empresa</th>'
      + '<th class="sga-table__th">Cidade</th>'
      + '<th class="sga-table__th">Tipo</th>'
      + '<th class="sga-table__th">Endere&ccedil;o cadastrado</th>'
      + '</tr></thead><tbody>';
    semGeo.forEach(function(c) {
      html += '<tr class="sga-table__row">'
        + '<td class="sga-table__td">' + _esc(c.name) + '</td>'
        + '<td class="sga-table__td">' + _esc(c.city) + '</td>'
        + '<td class="sga-table__td">' + _esc(c.client_type) + '</td>'
        + '<td class="sga-table__td" style="color:var(--sga-text-soft)">' + (_esc(c.address) || (c.city ? '<em>' + _esc(c.city + (c.state ? '/' + c.state : '')) + ' (cidade/UF — geocodificável)</em>' : '<em>sem endereço nem cidade</em>')) + '</td>'
        + '</tr>';
    });
    html += '</tbody></table></div>';
  }

  document.getElementById('map-list').innerHTML = html;
}

/** Carrega Leaflet (CSS + JS) via CDN dinamicamente. Idempotente. */
function _mapLoadLeaflet() {
  if (typeof L !== 'undefined' && L && L.map) {
    return Promise.resolve();
  }
  if (_mapLibLoading) return _mapLibLoading;

  _mapLibLoading = new Promise(function(resolve, reject) {
    // CSS
    if (!document.getElementById('leaflet-css')) {
      var link = document.createElement('link');
      link.id = 'leaflet-css';
      link.rel = 'stylesheet';
      link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
      document.head.appendChild(link);
    }

    // JS
    var existing = document.getElementById('leaflet-js');
    if (existing) {
      // outro chamador já injetou; espera load
      existing.addEventListener('load', function() { resolve(); });
      existing.addEventListener('error', function() { reject(new Error('Falha ao carregar Leaflet')); });
      return;
    }

    var script = document.createElement('script');
    script.id = 'leaflet-js';
    script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    script.onload = function() { resolve(); };
    script.onerror = function() {
      _mapLibLoading = null; // permite retry
      reject(new Error('Falha ao carregar Leaflet'));
    };
    document.head.appendChild(script);
  });

  return _mapLibLoading;
}

/** Retorna URL do tile layer adequado ao tema atual. */
function _mapTileUrl() {
  var isDark = document.body && document.body.classList && document.body.classList.contains('theme-dark');
  if (isDark) {
    return 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
  }
  return 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
}

/** Retorna atribuição do tile layer adequado ao tema atual. */
function _mapTileAttribution() {
  var isDark = document.body && document.body.classList && document.body.classList.contains('theme-dark');
  if (isDark) {
    return '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>';
  }
  return '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
}

/** Cria um divIcon colorido para o marcador. */
function _mapMarkerIcon(isOrganico) {
  var color = isOrganico ? '#f59e0b' : '#94a3b8';
  var borderColor = isOrganico ? '#b45309' : '#475569';
  var html = '<div style="'
    + 'width:16px;height:16px;border-radius:50%;'
    + 'background:' + color + ';'
    + 'border:2px solid #fff;'
    + 'box-shadow:0 0 0 1.5px ' + borderColor + ',0 1px 3px rgba(0,0,0,0.35);'
    + '"></div>';
  return L.divIcon({
    className: 'sga-map-marker',
    html: html,
    iconSize: [16, 16],
    iconAnchor: [8, 8],
    popupAnchor: [0, -8]
  });
}

/** Re-renderiza apenas os marcadores (mantém o mapa instanciado). */
function _mapRenderMarkers() {
  if (!_mapLeaflet || typeof L === 'undefined') return;

  if (_mapMarkersLayer) {
    _mapMarkersLayer.clearLayers();
  } else {
    _mapMarkersLayer = L.layerGroup().addTo(_mapLeaflet);
  }

  var filtered = _mapGetFiltered();
  var pins = filtered.filter(function(c) {
    var lat = parseFloat(c.lat);
    var lng = parseFloat(c.lng);
    return isFinite(lat) && isFinite(lng) && !(lat === 0 && lng === 0);
  });

  pins.forEach(function(c) {
    var lat = parseFloat(c.lat);
    var lng = parseFloat(c.lng);
    var organico = _mapIsOrganico(c);
    var marker = L.marker([lat, lng], { icon: _mapMarkerIcon(organico) });

    var cityUf = _esc(c.city || '') + (c.state ? '/' + _esc(c.state) : '');
    var tipoLabel = organico ? 'Orgânico' : 'Inorgânico / Prospect';
    var popup = '<div style="font-size:13px;min-width:160px">'
      + '<div style="font-weight:600;margin-bottom:4px">' + _esc(c.name || 'Sem nome') + '</div>'
      + '<div style="color:#64748b;font-size:12px">' + (cityUf || '<em>sem cidade</em>') + '</div>'
      + '<div style="margin-top:4px;font-size:12px">'
      + '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + (organico ? '#f59e0b' : '#94a3b8') + ';margin-right:5px"></span>'
      + tipoLabel
      + (c.client_type ? ' &middot; ' + _esc(c.client_type) : '')
      + '</div>'
      + '</div>';
    marker.bindPopup(popup);
    _mapMarkersLayer.addLayer(marker);
  });
}

/** Renderiza o mapa Leaflet com marcadores por cliente. Idempotente. */
function renderMapEmbed() {
  var container = document.getElementById('map-container');
  if (!container) return;

  _mapLoadLeaflet().then(function() {
    var justCreated = false;
    // Substitui o conteúdo do container por um div próprio do Leaflet
    // (evita conflito com o flexbox usado pra mensagens iniciais)
    if (!document.getElementById('leaflet-map') || !_mapLeaflet) {
      justCreated = true;
      container.innerHTML = '';
      container.style.display = 'block';
      container.style.padding = '0';
      var mapDiv = document.createElement('div');
      mapDiv.id = 'leaflet-map';
      mapDiv.style.width = '100%';
      mapDiv.style.height = '500px';
      mapDiv.style.borderRadius = '10px';
      container.appendChild(mapDiv);

      // Destrói instância anterior (caso de re-render)
      if (_mapLeaflet) {
        try { _mapLeaflet.remove(); } catch (e) {}
        _mapLeaflet = null;
        _mapMarkersLayer = null;
        _mapTileLayer = null;
      }

      _mapLeaflet = L.map('leaflet-map', {
        center: [-15.77, -47.92],
        zoom: 4,
        zoomControl: true,
        scrollWheelZoom: true
      });

      _mapTileLayer = L.tileLayer(_mapTileUrl(), {
        attribution: _mapTileAttribution(),
        maxZoom: 18
      }).addTo(_mapLeaflet);

      // Garante render correto após inserção no DOM
      setTimeout(function() {
        if (_mapLeaflet) _mapLeaflet.invalidateSize();
      }, 50);
    }

    _mapRenderMarkers();

    // Auto-fit aos marcadores apenas na primeira criação do mapa
    // (preserva zoom/pan do usuário em chamadas subsequentes)
    if (justCreated && _mapMarkersLayer && _mapMarkersLayer.getLayers().length > 0) {
      var bounds = L.featureGroup(_mapMarkersLayer.getLayers()).getBounds();
      if (bounds.isValid()) {
        _mapLeaflet.fitBounds(bounds, { padding: [30, 30], maxZoom: 7 });
      }
    }
  }).catch(function(err) {
    container.innerHTML = '<div style="text-align:center;padding:24px">'
      + '<p style="color:var(--sga-color-danger);font-size:14px;margin:0 0 8px">Não foi possível carregar o mapa: ' + _esc(String(err && err.message || err)) + '</p>'
      + '<p style="color:var(--sga-text-soft);font-size:12px;margin:0">Verifique sua conexão com a internet e clique em <strong>Atualizar</strong>.</p>'
      + '</div>';
  });
}

/** Chama Api_companiesGeocodeBatch no backend (apenas DIRETOR_TECNICO). */
function Api_companiesGeocodeBatch_run() {
  var btns = [document.getElementById('btn-geocode'), document.getElementById('btn-geocode-empty')];
  btns.forEach(function (b) { if (b) { b.disabled = true; b.textContent = 'Processando... (~1-2 min)'; } });

  google.script.run
    .withSuccessHandler(function(res) {
      btns.forEach(function (b) { if (b) { b.disabled = false; b.textContent = 'Geocodificar Pendentes'; } });
      if (res && res.ok) {
        var d = res.data || {};
        var msg = (d.geocodificadas || 0) + ' empresa(s) posicionada(s)';
        if (d.sem_dados) msg += ' · ' + d.sem_dados + ' sem cidade (não dá para mapear)';
        if (d.parcial) msg += ' · ' + (d.msg || 'rode de novo para continuar');
        showToast(msg);
        loadMap();
      } else {
        showToast('Erro: ' + (res ? res.error : 'falha desconhecida'));
      }
    })
    .withFailureHandler(function(err) {
      btns.forEach(function (b) { if (b) { b.disabled = false; b.textContent = 'Geocodificar Pendentes'; } });
      showToast('Erro: ' + err);
    })
    .Api_companiesGeocodeBatch();
}

/** Escapa HTML básico. */
function _esc(v) {
  if (!v) return '';
  return String(v)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
</script>
