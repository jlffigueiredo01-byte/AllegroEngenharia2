<script>
// =============================================================================
// ComprasUI.html — SGA (Sistema de Gestão Allegro)
// Purchase Orders: lista, criação (fornecedor + itens), emitir e cancelar.
// Prefixo _po. ES5.
// =============================================================================

var _poList = [];
var _poSuppliers = [];

function renderCompras(area) {
  area.innerHTML =
    '<div class="page-header" style="display:flex;justify-content:space-between;align-items:center">' +
      '<div class="page-header-left">' +
        '<h1 class="page-title">📦 Compras (PO)</h1>' +
        '<p class="page-subtitle">Ordens de compra para Hydronix e fornecedores nacionais.</p>' +
      '</div>' +
      '<div style="display:flex;gap:8px">' +
        '<button class="sga-btn sga-btn--secondary" id="po-btn-from-prop">📄→📦 Gerar da proposta</button>' +
        '<button class="sga-btn sga-btn--primary" id="po-btn-new">+ Nova PO</button>' +
      '</div>' +
    '</div>' +
    '<div id="po-form-wrap" class="hidden" style="margin-bottom:16px"></div>' +
    '<div id="po-list-wrap"></div>';
  (function(){ var sk = document.getElementById('po-list-wrap'); if (sk && window.SGA && SGA.skeleton) SGA.skeleton(sk, { type: 'list', count: 5 }); })();
  document.getElementById('po-btn-new').addEventListener('click', _poShowForm);
  document.getElementById('po-btn-from-prop').addEventListener('click', _poFromProposalForm);
  _poLoad();
}

function _poLoad() {
  var wrap = document.getElementById('po-list-wrap');
  if (wrap && window.SGA && SGA.skeleton) SGA.skeleton(wrap, { type: 'list', count: 5 });
  google.script.run.withSuccessHandler(function (r) {
    _poList = (r && r.ok && r.data) ? r.data : [];
    _poRenderList();
  }).withFailureHandler(function (e) {
    var w = document.getElementById('po-list-wrap');
    if (w) w.innerHTML = '<div class="sga-empty sga-empty--error"><div class="sga-empty__icon">⚠️</div><h3 class="sga-empty__title">Não foi possível carregar</h3><p class="sga-empty__text">' + escapeHtml(e.message || e) + '</p></div>';
  }).Api_poGetAll();
}

function _poBadge(st) {
  var map = { RASCUNHO: 'badge-gray', APROVADA: 'badge-yellow', EMITIDA: 'badge-blue', RECEBIDA_PARCIAL: 'badge-yellow', RECEBIDA: 'badge-green', CANCELADA: 'badge-red' };
  return map[st] || 'badge-gray';
}

function _poRenderList() {
  var w = document.getElementById('po-list-wrap');
  if (!w) return;
  if (!_poList.length) {
    if (window.SGA && SGA.empty) {
      SGA.empty(w, {
        icon: '🛒',
        title: 'Nenhuma ordem de compra ainda',
        text: 'Crie a primeira PO para começar a registrar pedidos a fornecedores.',
        action: {
          label: '+ Nova PO',
          onClick: function () {
            var btn = document.getElementById('po-btn-new');
            if (btn) btn.click();
          }
        }
      });
    } else {
      w.innerHTML = '<div class="sga-empty">' +
        '<div class="sga-empty__icon">🛒</div>' +
        '<h3 class="sga-empty__title">Nenhuma ordem de compra ainda</h3>' +
        '<p class="sga-empty__text">Crie a primeira PO com o botão acima.</p>' +
      '</div>';
    }
    return;
  }
  var rows = '';
  for (var i = 0; i < _poList.length; i++) {
    var p = _poList[i];
    var nItems = 0;
    try { nItems = (JSON.parse(p.items_json || '[]') || []).length; } catch (e) {}
    rows += '<tr class="sga-table__row">' +
      '<td class="sga-table__td"><b>' + escapeHtml(p.po_number || p.id) + '</b></td>' +
      '<td class="sga-table__td" style="font-size:12px">' + escapeHtml(p.supplier_id || '') + '</td>' +
      '<td class="sga-table__td"><span class="badge ' + _poBadge(p.status) + '">' + escapeHtml(p.status || '') + '</span></td>' +
      '<td class="sga-table__td" style="text-align:right">' + escapeHtml(p.currency || 'USD') + ' ' + (Number(p.total_amount || 0)).toFixed(2) + '</td>' +
      '<td class="sga-table__td" style="text-align:center">' + nItems + '</td>' +
      '<td class="sga-table__td" style="font-size:12px">' + escapeHtml(p.proposal_id || '') + '</td>' +
      '<td class="sga-table__td sga-table__td--actions" style="white-space:nowrap">' +
        '<button class="sga-btn sga-btn--ghost sga-btn--sm po-view" data-id="' + escapeHtml(p.id) + '">📄 Ver</button> ' +
        (p.status === 'RASCUNHO'
          ? '<button class="sga-btn sga-btn--secondary sga-btn--sm po-approve" data-id="' + escapeHtml(p.id) + '">Aprovar</button> ' +
            '<button class="sga-btn sga-btn--ghost sga-btn--sm po-cancel" data-id="' + escapeHtml(p.id) + '">Cancelar</button>'
          : (p.status === 'APROVADA'
            ? '<button class="sga-btn sga-btn--primary sga-btn--sm po-emit" data-id="' + escapeHtml(p.id) + '">Emitir + enviar</button> ' +
              '<button class="sga-btn sga-btn--ghost sga-btn--sm po-cancel" data-id="' + escapeHtml(p.id) + '">Cancelar</button>'
            : '')) +
      '</td>' +
    '</tr>';
  }
  w.innerHTML =
    '<div class="sga-table-wrap"><table class="sga-table">' +
      '<thead><tr>' +
        '<th class="sga-table__th">PO</th>' +
        '<th class="sga-table__th">Fornecedor</th>' +
        '<th class="sga-table__th">Status</th>' +
        '<th class="sga-table__th" style="text-align:right">Total</th>' +
        '<th class="sga-table__th">Itens</th>' +
        '<th class="sga-table__th">Proposta</th>' +
        '<th class="sga-table__th sga-table__th--actions"></th>' +
      '</tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';

  var views = w.querySelectorAll('.po-view');
  for (var v = 0; v < views.length; v++) {
    views[v].addEventListener('click', function () { _poVerDocumento(this.getAttribute('data-id')); });
  }
  var approves = w.querySelectorAll('.po-approve');
  for (var ap = 0; ap < approves.length; ap++) {
    approves[ap].addEventListener('click', function () {
      var id = this.getAttribute('data-id');
      google.script.run
        .withSuccessHandler(function (res) {
          if (!res || !res.ok) { showAlert('Erro: ' + (res ? res.error : '?'), 'error'); return; }
          showAlert('PO aprovada! Agora você pode emitir e enviar ao fornecedor.', 'success'); _poLoad();
        })
        .withFailureHandler(function (e) { showAlert('Falha: ' + (e.message || e), 'error'); })
        .Api_poAprovar(id);
    });
  }
  var emits = w.querySelectorAll('.po-emit');
  for (var a = 0; a < emits.length; a++) {
    emits[a].addEventListener('click', function () {
      var id = this.getAttribute('data-id');
      var go = function () {
        google.script.run
          .withSuccessHandler(function (res) {
            if (!res || !res.ok) { showAlert('Erro: ' + (res ? res.error : '?'), 'error'); return; }
            var em = res.email || {};
            showAlert('PO emitida!' + (em.sent ? ' Documento enviado para ' + em.to : (em.error ? ' (e-mail NÃO enviado: ' + em.error + ')' : '')), em.sent ? 'success' : 'warning');
            _poLoad();
          })
          .withFailureHandler(function (e) { showAlert('Falha: ' + (e.message || e), 'error'); })
          .Api_poEmitir(id);
      };
      var msg = 'Emitir esta PO e enviar o documento por e-mail ao fornecedor cadastrado?';
      if (window.SGA && SGA.confirm) { SGA.confirm(msg, { title: 'Emitir + enviar', okLabel: 'Emitir' }).then(function (ok) { if (ok) go(); }); }
      else if (confirm(msg)) { go(); }
    });
  }
  var cancels = w.querySelectorAll('.po-cancel');
  for (var c = 0; c < cancels.length; c++) {
    cancels[c].addEventListener('click', function () {
      var id = this.getAttribute('data-id');
      var doCancel = function (motivo) {
        if (!motivo) return;
        google.script.run.withSuccessHandler(function (res) {
          if (!res || !res.ok) { showAlert('Erro: ' + (res ? res.error : '?'), 'error'); return; }
          showAlert('PO cancelada.', 'success'); _poLoad();
        }).Api_poCancelar(id, motivo);
      };
      if (window.SGA && SGA.openModal) {
        SGA.openModal({
          title: 'Cancelar PO',
          size: 'sm',
          body: '<div class="sga-form-group"><label class="sga-form-label" for="po-cancel-motivo">Motivo do cancelamento</label>' +
                '<textarea id="po-cancel-motivo" class="sga-form-textarea" rows="3" data-sga-autofocus placeholder="explique o motivo..."></textarea></div>',
          footer: [
            { label: 'Voltar', variant: 'ghost', onClick: 'close' },
            { label: 'Cancelar PO', variant: 'danger', primary: true, onClick: function (ctx) {
              var v = (ctx.modal.querySelector('#po-cancel-motivo').value || '').trim();
              if (!v) { showAlert('Informe o motivo.', 'warning'); return false; }
              doCancel(v);
            }}
          ]
        });
      } else {
        var motivo = prompt('Motivo do cancelamento:');
        doCancel(motivo);
      }
    });
  }
}

/* ── Geração a partir de proposta FECHADA ── */

function _poFromProposalForm() {
  var w = document.getElementById('po-form-wrap');
  w.classList.remove('hidden');
  w.innerHTML =
    '<div class="card"><div class="card-header"><div class="card-title">Gerar PO de proposta FECHADA</div></div>' +
    '<div class="card-body"><div style="display:flex;gap:10px;flex-wrap:wrap">' +
      '<select class="sga-form-select" id="pofp-prop" style="flex:1;min-width:220px"><option value="">Carregando propostas...</option></select>' +
      '<select class="sga-form-select" id="pofp-sup" style="flex:1;min-width:220px"><option value="">⚙️ Automático (pelo produto)</option></select>' +
      '<button class="sga-btn sga-btn--primary" id="pofp-go">Gerar</button>' +
      '<button class="sga-btn sga-btn--ghost" id="pofp-cancel">Cancelar</button>' +
    '</div><p style="font-size:12px;color:var(--sga-text-soft);margin:8px 0 0">O fornecedor é definido pelo <b>supplier_id</b> de cada produto — gera 1 PO por fornecedor, na moeda dele. Os itens entram com preço de COMPRA (tabela − desconto); serviços são ignorados.</p></div></div>';

  document.getElementById('pofp-cancel').addEventListener('click', function () { w.classList.add('hidden'); w.innerHTML = ''; });
  document.getElementById('pofp-go').addEventListener('click', function () {
    var prop = document.getElementById('pofp-prop').value;
    var sup  = document.getElementById('pofp-sup').value;
    if (!prop) { showAlert('Escolha a proposta.', 'warning'); return; }
    google.script.run.withSuccessHandler(function (res) {
      if (!res || !res.ok) { showAlert('Erro: ' + (res ? res.error : '?'), 'error'); return; }
      var po = res.data || {};
      var msg = (po.count > 1)
        ? (po.count + ' POs criadas em rascunho (1 por fornecedor)!')
        : ('PO ' + (po.po_number || po.id) + ' criada em rascunho!');
      showAlert(msg, 'success');
      w.classList.add('hidden'); w.innerHTML = '';
      _poLoad();
    }).Api_poCreateFromProposal(prop, sup);
  });

  google.script.run.withSuccessHandler(function (r) {
    var sel = document.getElementById('pofp-prop');
    if (!sel) return;
    var props = ((r && r.ok && r.data) ? r.data : []).filter(function (p) { return p.status === 'FECHADA'; });
    if (!props.length) { sel.innerHTML = '<option value="">— nenhuma proposta FECHADA —</option>'; return; }
    var html = '<option value="">— proposta —</option>';
    for (var i = 0; i < props.length; i++) {
      html += '<option value="' + escapeHtml(props[i].id) + '">' + escapeHtml((props[i].number || props[i].id) + ' — ' + (props[i].client_name || '')) + '</option>';
    }
    sel.innerHTML = html;
  }).Api_getProposals({});

  google.script.run.withSuccessHandler(function (r) {
    var sel = document.getElementById('pofp-sup');
    if (!sel) return;
    var sups = (r && r.ok && r.data) ? r.data : [];
    var html = '<option value="">⚙️ Automático (pelo produto)</option>';
    for (var i = 0; i < sups.length; i++) {
      html += '<option value="' + escapeHtml(sups[i].id) + '">Forçar: ' + escapeHtml(sups[i].name || sups[i].id) + '</option>';
    }
    sel.innerHTML = html;
  }).Api_supplierGetAll();
}

/* ── Criação ── */

function _poShowForm() {
  var w = document.getElementById('po-form-wrap');
  w.classList.remove('hidden');
  w.innerHTML =
    '<div class="card"><div class="card-header"><div class="card-title">Nova Ordem de Compra</div></div>' +
    '<div class="card-body">' +
      '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
        '<label style="font-size:12px;flex:1;min-width:220px">Fornecedor *<br>' +
          '<select class="sga-form-select" id="po-supplier"><option value="">Carregando...</option></select></label>' +
        '<label style="font-size:12px">Moeda<br><select class="sga-form-select" id="po-currency" style="width:100px">' +
          '<option>USD</option><option>BRL</option></select></label>' +
        '<label style="font-size:12px">Proposta vinculada<br><input class="sga-form-input" id="po-proposal" type="text" placeholder="opcional (id/numero)" style="width:180px"></label>' +
        '<label style="font-size:12px">Entrega prevista<br><input class="sga-form-input" id="po-eta" type="date" style="width:160px"></label>' +
      '</div>' +
      '<div class="sga-form-label" style="font-weight:700;margin:12px 0 4px">Itens</div>' +
      '<div id="po-items"></div>' +
      '<button class="sga-btn sga-btn--ghost sga-btn--sm" id="po-add-item">+ item</button>' +
      '<div style="margin-top:12px;display:flex;gap:8px;align-items:center">' +
        '<button class="sga-btn sga-btn--primary" id="po-save">Criar PO (rascunho)</button>' +
        '<button class="sga-btn sga-btn--ghost" id="po-form-cancel">Cancelar</button>' +
        '<span id="po-total-preview" style="margin-left:auto;font-weight:700"></span>' +
      '</div>' +
    '</div></div>';

  document.getElementById('po-add-item').addEventListener('click', function () { _poAddItemRow(); });
  document.getElementById('po-form-cancel').addEventListener('click', function () { w.classList.add('hidden'); w.innerHTML = ''; });
  document.getElementById('po-save').addEventListener('click', _poCreate);
  _poAddItemRow();

  if (_poSuppliers.length) { _poFillSuppliers(); return; }
  google.script.run.withSuccessHandler(function (r) {
    _poSuppliers = (r && r.ok && r.data) ? r.data : [];
    _poFillSuppliers();
  }).withFailureHandler(function () {
    document.getElementById('po-supplier').innerHTML = '<option value="">erro ao carregar — cadastre fornecedores</option>';
  }).Api_supplierGetAll();
}

function _poFillSuppliers() {
  var sel = document.getElementById('po-supplier');
  if (!sel) return;
  if (!_poSuppliers.length) {
    sel.innerHTML = '<option value="">— nenhum fornecedor cadastrado —</option>';
    return;
  }
  var html = '<option value="">— selecione —</option>';
  for (var i = 0; i < _poSuppliers.length; i++) {
    var s = _poSuppliers[i];
    html += '<option value="' + escapeHtml(s.id) + '">' + escapeHtml((s.name || s.trade_name || s.id) + (s.language ? ' (' + s.language + ')' : '')) + '</option>';
  }
  sel.innerHTML = html;
}

function _poAddItemRow() {
  var row = document.createElement('div');
  row.className = 'po-item-row';
  row.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:6px';
  row.innerHTML =
    '<input class="sga-form-input po-it-code" type="text" placeholder="código (ex.: HMXT01)" style="width:150px">' +
    '<input class="sga-form-input po-it-desc" type="text" placeholder="descrição" style="flex:1">' +
    '<input class="sga-form-input po-it-qty" type="number" min="1" value="1" style="width:70px" title="qtde">' +
    '<input class="sga-form-input po-it-price" type="number" min="0" step="0.01" value="0" style="width:110px" title="preço unit.">' +
    '<button class="sga-btn sga-btn--ghost sga-btn--sm po-row-del">🗑</button>';
  row.querySelector('.po-row-del').addEventListener('click', function () { row.parentNode.removeChild(row); _poPreviewTotal(); });
  row.querySelector('.po-it-qty').addEventListener('input', _poPreviewTotal);
  row.querySelector('.po-it-price').addEventListener('input', _poPreviewTotal);
  document.getElementById('po-items').appendChild(row);
}

function _poCollectItems() {
  var items = [];
  var rows = document.querySelectorAll('#po-items .po-item-row');
  for (var i = 0; i < rows.length; i++) {
    var code = rows[i].querySelector('.po-it-code').value.trim();
    var desc = rows[i].querySelector('.po-it-desc').value.trim();
    var qty  = parseFloat(rows[i].querySelector('.po-it-qty').value) || 0;
    var pr   = parseFloat(rows[i].querySelector('.po-it-price').value) || 0;
    if (code || desc) items.push({ code: code, description: desc, qty: qty, unit_price: pr, total: qty * pr });
  }
  return items;
}

function _poPreviewTotal() {
  var items = _poCollectItems();
  var t = 0;
  for (var i = 0; i < items.length; i++) t += items[i].total;
  var el = document.getElementById('po-total-preview');
  if (el) el.textContent = 'Total: ' + t.toFixed(2);
}

function _poCreate() {
  var supplier = document.getElementById('po-supplier').value;
  if (!supplier) { showAlert('Selecione o fornecedor.', 'warning'); return; }
  var items = _poCollectItems();
  if (!items.length) { showAlert('Adicione ao menos um item.', 'warning'); return; }
  var total = 0;
  for (var i = 0; i < items.length; i++) total += items[i].total;

  var payload = {
    supplier_id:       supplier,
    proposal_id:       document.getElementById('po-proposal').value || '',
    currency:          document.getElementById('po-currency').value || 'USD',
    expected_delivery: document.getElementById('po-eta').value || '',
    items_json:        items,
    total_amount:      total
  };
  var btn = document.getElementById('po-save');
  btn.disabled = true; btn.textContent = 'Criando...';
  google.script.run
    .withSuccessHandler(function (res) {
      btn.disabled = false; btn.textContent = 'Criar PO (rascunho)';
      if (!res || !res.ok) { showAlert('Erro: ' + (res ? res.error : '?'), 'error'); return; }
      var po = res.data || {};
      showAlert('PO ' + (po.po_number || po.id || '') + ' criada como rascunho.', 'success');
      var w = document.getElementById('po-form-wrap');
      w.classList.add('hidden'); w.innerHTML = '';
      _poLoad();
    })
    .withFailureHandler(function (err) {
      btn.disabled = false; btn.textContent = 'Criar PO (rascunho)';
      showAlert('Falha: ' + (err.message || err), 'error');
    })
    .Api_poCreate(payload);
}

/* FB-029: visualização do documento "Solicitação de Compra — SC". */
function _poVerDocumento(id) {
  showAlert('Gerando documento...', 'info');
  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.ok) { showAlert('Erro: ' + (res ? res.error : '?'), 'error'); return; }
      var html = res.data || '';
      if (window.SGA && SGA.openModal) {
        SGA.openModal({
          title: '📄 Solicitação de Compra — documento',
          size: 'lg',
          body: '<div style="max-height:68vh;overflow:auto;background:#fff;border:1px solid var(--sga-border-default);border-radius:6px">' + html + '</div>',
          footer: [
            { label: '🖨 Imprimir / PDF', variant: 'secondary', onClick: function () { _poImprimir(html); return false; } },
            { label: 'Fechar', variant: 'ghost', onClick: 'close' }
          ]
        });
      } else {
        _poImprimir(html);
      }
    })
    .withFailureHandler(function (e) { showAlert('Falha: ' + (e.message || e), 'error'); })
    .Api_poGerarHTML(id);
}

function _poImprimir(html) {
  var win = window.open('', '_blank');
  if (!win) { showAlert('Permita pop-ups para imprimir/salvar em PDF.', 'warning'); return; }
  win.document.write('<html><head><meta charset="utf-8"><title>Solicitação de Compra</title></head><body>' + html + '</body></html>');
  win.document.close();
  win.focus();
  setTimeout(function () { try { win.print(); } catch (e) {} }, 500);
}
</script>
