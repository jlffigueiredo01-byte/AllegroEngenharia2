<script>
// =============================================================================
// OpportunitiesUI.html — ALLEGRO Business System
// Opportunities view: pipeline summary, filter bar, table, modals
// ES5 only
// =============================================================================

var _opps = [];
var _oppsFilter = { status: '', q: '' };

var _OPP_STATUSES = [
  'Lead',
  'Elaborando proposta',
  'Proposta enviada',
  'Proposta fechada',
  'Proposta recusada',
  'Cancelada',
  'Não elaborada'
];

// Badge class map
function _oppBadgeClass(status) {
  var map = {
    'Lead': 'badge-blue',
    'Elaborando proposta': 'badge-yellow',
    'Proposta enviada': 'badge-blue',
    'Proposta fechada': 'badge-green',
    'Proposta recusada': 'badge-red',
    'Cancelada': 'badge-red',
    'Não elaborada': 'badge-gray'
  };
  return map[status] || 'badge-gray';
}

// Short label for pipeline summary cards
function _oppShortLabel(status) {
  var map = {
    'Lead': 'Lead',
    'Elaborando proposta': 'Elaborando',
    'Proposta enviada': 'Enviada',
    'Proposta fechada': 'Fechada',
    'Proposta recusada': 'Recusada',
    'Cancelada': 'Cancelada',
    'Não elaborada': 'Não elaborada'
  };
  return map[status] || status;
}

// ---------------------------------------------------------------------------
// Main render entry point
// ---------------------------------------------------------------------------
function renderOpportunities(area) {
  area.innerHTML = '<div class="spinner-ring" id="opp-spinner"></div>';
  setLoading(true);

  google.script.run
    .withSuccessHandler(function (res) {
      setLoading(false);
      if (!res || !res.ok) {
        showAlert('Erro ao carregar oportunidades: ' + (res ? res.error : 'desconhecido'), 'error');
        area.innerHTML = '<div class="empty-state">Falha ao carregar dados.</div>';
        return;
      }
      _opps = res.data || [];
      _oppsFilter = { status: '', q: '' };
      area.innerHTML = _buildOpportunitiesHTML();
      _bindOpportunitiesEvents(area);
    })
    .withFailureHandler(function (err) {
      setLoading(false);
      showAlert('Erro: ' + err.message, 'error');
      area.innerHTML = '<div class="empty-state">Falha ao carregar dados.</div>';
    })
    .Api_getOpportunities();
}

// ---------------------------------------------------------------------------
// Build full HTML string
// ---------------------------------------------------------------------------
function _buildOpportunitiesHTML() {
  return (
    '<div class="page-header">' +
      '<div class="page-header-left">' +
        '<div class="page-title">Oportunidades</div>' +
        '<div class="page-subtitle">Pipeline de negócios e propostas</div>' +
      '</div>' +
      '<button class="btn btn-primary" id="opp-btn-new">+ Nova Oportunidade</button>' +
    '</div>' +

    _buildPipelineSummary() +
    _buildFilterBar() +

    '<div class="card">' +
      '<div class="card-body" style="padding:0">' +
        '<div class="table-wrap" id="opp-table-wrap">' +
          _buildTable(_getFilteredOpps()) +
        '</div>' +
      '</div>' +
    '</div>' +

    _buildNewOppModal() +
    _op_buildDetailModal()
  );
}

// ---------------------------------------------------------------------------
// Pipeline summary: count per key status
// ---------------------------------------------------------------------------
function _buildPipelineSummary() {
  var summaryStatuses = [
    'Lead',
    'Elaborando proposta',
    'Proposta enviada',
    'Proposta fechada',
    'Proposta recusada'
  ];

  var counts = {};
  for (var s = 0; s < summaryStatuses.length; s++) counts[summaryStatuses[s]] = 0;
  for (var i = 0; i < _opps.length; i++) {
    var st = _opps[i].status || '';
    if (counts.hasOwnProperty(st)) counts[st]++;
  }

  var html = '<div class="stat-grid" style="margin-bottom:16px">';
  for (var j = 0; j < summaryStatuses.length; j++) {
    var label = _oppShortLabel(summaryStatuses[j]);
    var badgeClass = _oppBadgeClass(summaryStatuses[j]);
    html +=
      '<div class="card" style="padding:12px 16px;cursor:pointer" data-filter-status="' + escapeHtml(summaryStatuses[j]) + '" title="Filtrar por ' + escapeHtml(label) + '">' +
        '<div style="font-size:11px;color:#6b7280;margin-bottom:4px">' + escapeHtml(label) + '</div>' +
        '<div style="display:flex;align-items:center;gap:8px">' +
          '<span style="font-size:22px;font-weight:700">' + counts[summaryStatuses[j]] + '</span>' +
          '<span class="badge ' + badgeClass + '">' + escapeHtml(label) + '</span>' +
        '</div>' +
      '</div>';
  }
  html += '</div>';
  return html;
}

// ---------------------------------------------------------------------------
// Filter bar
// ---------------------------------------------------------------------------
function _buildFilterBar() {
  var options = '<option value="">Todos os status</option>';
  for (var i = 0; i < _OPP_STATUSES.length; i++) {
    var sel = _oppsFilter.status === _OPP_STATUSES[i] ? ' selected' : '';
    options += '<option value="' + escapeHtml(_OPP_STATUSES[i]) + '"' + sel + '>' + escapeHtml(_OPP_STATUSES[i]) + '</option>';
  }

  return (
    '<div class="card" style="margin-bottom:12px">' +
      '<div class="card-body">' +
        '<div class="form-row-2" style="align-items:flex-end">' +
          '<div class="form-group" style="margin-bottom:0">' +
            '<label class="form-label">Status</label>' +
            '<select class="form-input" id="opp-filter-status">' + options + '</select>' +
          '</div>' +
          '<div class="form-group" style="margin-bottom:0">' +
            '<label class="form-label">Buscar empresa</label>' +
            '<input class="form-input" id="opp-filter-q" type="text" placeholder="Nome da empresa..." value="' + escapeHtml(_oppsFilter.q) + '">' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

// ---------------------------------------------------------------------------
// Table
// ---------------------------------------------------------------------------
function _buildTable(rows) {
  if (!rows || rows.length === 0) {
    return '<div class="empty-state">Nenhuma oportunidade encontrada.</div>';
  }

  var html =
    '<table class="data-table">' +
      '<thead><tr>' +
        '<th>Empresa</th>' +
        '<th>Representante</th>' +
        '<th>Produto</th>' +
        '<th>Temp. Máx.</th>' +
        '<th>Status</th>' +
        '<th>Data</th>' +
        '<th></th>' +
      '</tr></thead>' +
      '<tbody>';

  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var badgeClass = _oppBadgeClass(r.status || '');
    html +=
      '<tr>' +
        '<td>' + escapeHtml(r.company_name || r.company_id || '—') + '</td>' +
        '<td>' + escapeHtml(r.representative || '—') + '</td>' +
        '<td>' + escapeHtml(r.product || '—') + '</td>' +
        '<td>' + escapeHtml(r.max_temp || '—') + '</td>' +
        '<td><span class="badge ' + badgeClass + '">' + escapeHtml(r.status || '—') + '</span></td>' +
        '<td>' + escapeHtml(formatDate(r.created_at || r.form_date || '')) + '</td>' +
        '<td>' +
          '<button class="btn btn-ghost btn-sm opp-btn-view" data-id="' + escapeHtml(r.id) + '">Ver</button>' +
        '</td>' +
      '</tr>';
  }

  html += '</tbody></table>';
  return html;
}

// ---------------------------------------------------------------------------
// New Opportunity Modal
// ---------------------------------------------------------------------------
function _buildNewOppModal() {
  var statusOptions = '';
  for (var i = 0; i < _OPP_STATUSES.length; i++) {
    statusOptions += '<option value="' + escapeHtml(_OPP_STATUSES[i]) + '">' + escapeHtml(_OPP_STATUSES[i]) + '</option>';
  }

  return (
    '<div id="opp-modal-new" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center">' +
      '<div class="card" style="width:520px;max-width:96vw;max-height:90vh;overflow-y:auto">' +
        '<div class="card-header">' +
          '<div class="card-title">Nova Oportunidade</div>' +
        '</div>' +
        '<div class="card-body">' +
          '<div class="form-group">' +
            '<label class="form-label">Empresa *</label>' +
            '<select class="form-input" id="opp-new-company">' +
              '<option value="">Carregando empresas...</option>' +
            '</select>' +
          '</div>' +
          '<div class="form-group">' +
            '<label class="form-label">Representante</label>' +
            '<input class="form-input" id="opp-new-representative" type="text" placeholder="Nome do representante">' +
          '</div>' +
          '<div class="form-group">' +
            '<label class="form-label">Produto</label>' +
            '<input class="form-input" id="opp-new-product" type="text" placeholder="Produto / solução">' +
          '</div>' +
          '<div class="form-group">' +
            '<label class="form-label">Status</label>' +
            '<select class="form-input" id="opp-new-status">' + statusOptions + '</select>' +
          '</div>' +
          '<div class="form-group">' +
            '<label class="form-label">Notas</label>' +
            '<textarea class="form-input" id="opp-new-notes" rows="3" placeholder="Observações iniciais..."></textarea>' +
          '</div>' +
          '<div style="display:flex;gap:8px;justify-content:flex-end">' +
            '<button class="btn btn-ghost" id="opp-modal-new-cancel">Cancelar</button>' +
            '<button class="btn btn-primary" id="opp-modal-new-save">Criar Oportunidade</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

// ---------------------------------------------------------------------------
// Detail Modal
// ---------------------------------------------------------------------------
function _op_buildDetailModal() {
  var statusOptions = '';
  for (var i = 0; i < _OPP_STATUSES.length; i++) {
    statusOptions += '<option value="' + escapeHtml(_OPP_STATUSES[i]) + '">' + escapeHtml(_OPP_STATUSES[i]) + '</option>';
  }

  return (
    '<div id="opp-modal-detail" class="hidden" style="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;display:flex;align-items:center;justify-content:center">' +
      '<div class="card" style="width:600px;max-width:96vw;max-height:90vh;overflow-y:auto">' +
        '<div class="card-header" style="display:flex;justify-content:space-between;align-items:center">' +
          '<div class="card-title" id="opp-detail-title">Oportunidade</div>' +
          '<button class="btn btn-ghost btn-sm" id="opp-modal-detail-close">✕</button>' +
        '</div>' +
        '<div class="card-body" id="opp-detail-body">' +
          '<div class="spinner-ring"></div>' +
        '</div>' +
        '<div class="card-body" style="border-top:1px solid #e5e7eb">' +
          '<div class="card-title" style="font-size:13px;margin-bottom:8px">Mudar Status</div>' +
          '<div class="form-row-2" style="align-items:flex-end">' +
            '<div class="form-group" style="margin-bottom:0">' +
              '<label class="form-label">Novo Status</label>' +
              '<select class="form-input" id="opp-detail-status-sel">' + statusOptions + '</select>' +
            '</div>' +
            '<div class="form-group" style="margin-bottom:0">' +
              '<label class="form-label">Nota (opcional)</label>' +
              '<input class="form-input" id="opp-detail-status-note" type="text" placeholder="Adicionar nota...">' +
            '</div>' +
          '</div>' +
          '<div style="margin-top:10px;text-align:right">' +
            '<button class="btn btn-primary btn-sm" id="opp-detail-status-confirm">Confirmar Mudança</button>' +
            '<button class="btn btn-success btn-sm" id="opp-detail-motor-btn" style="margin-left:8px">\uD83D\uDCB0 Gerar Proposta (Motor)</button>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

// ---------------------------------------------------------------------------
// Filter helpers
// ---------------------------------------------------------------------------
function _getFilteredOpps() {
  var result = [];
  for (var i = 0; i < _opps.length; i++) {
    var o = _opps[i];
    if (_oppsFilter.status && o.status !== _oppsFilter.status) continue;
    if (_oppsFilter.q) {
      var haystack = (o.company_name || '').toLowerCase();
      if (haystack.indexOf(_oppsFilter.q.toLowerCase()) === -1) continue;
    }
    result.push(o);
  }
  return result;
}

function _refreshTable() {
  var wrap = document.getElementById('opp-table-wrap');
  if (wrap) wrap.innerHTML = _buildTable(_getFilteredOpps());
  _bindTableEvents();
}

// ---------------------------------------------------------------------------
// Event binding
// ---------------------------------------------------------------------------
function _bindOpportunitiesEvents(area) {
  // Pipeline summary card filter
  var summaryCards = area.querySelectorAll('[data-filter-status]');
  for (var c = 0; c < summaryCards.length; c++) {
    (function (card) {
      card.addEventListener('click', function () {
        var st = card.getAttribute('data-filter-status');
        _oppsFilter.status = (_oppsFilter.status === st) ? '' : st;
        var sel = document.getElementById('opp-filter-status');
        if (sel) sel.value = _oppsFilter.status;
        _refreshTable();
      });
    })(summaryCards[c]);
  }

  // Filter status dropdown
  var filterSel = document.getElementById('opp-filter-status');
  if (filterSel) {
    filterSel.addEventListener('change', function () {
      _oppsFilter.status = this.value;
      _refreshTable();
    });
  }

  // Filter search input
  var filterQ = document.getElementById('opp-filter-q');
  if (filterQ) {
    filterQ.addEventListener('input', function () {
      _oppsFilter.q = this.value;
      _refreshTable();
    });
  }

  // New opportunity button
  var btnNew = document.getElementById('opp-btn-new');
  if (btnNew) {
    btnNew.addEventListener('click', function () {
      _op_openNewModal();
    });
  }

  // New modal cancel
  var btnCancel = document.getElementById('opp-modal-new-cancel');
  if (btnCancel) {
    btnCancel.addEventListener('click', function () {
      _op_closeNewModal();
    });
  }

  // New modal save
  var btnSave = document.getElementById('opp-modal-new-save');
  if (btnSave) {
    btnSave.addEventListener('click', function () {
      _submitNewOpp();
    });
  }

  // Detail modal close
  var btnDetailClose = document.getElementById('opp-modal-detail-close');
  if (btnDetailClose) {
    btnDetailClose.addEventListener('click', function () {
      _op_closeDetailModal();
    });
  }

  // Detail status confirm
  // (bind do motor agora é por delegação global — ver _opmDelegate no fim do arquivo)

  var btnStatusConfirm = document.getElementById('opp-detail-status-confirm');
  if (btnStatusConfirm) {
    btnStatusConfirm.addEventListener('click', function () {
      _submitStatusChange();
    });
  }

  // Backdrop close for new modal
  var newModal = document.getElementById('opp-modal-new');
  if (newModal) {
    newModal.addEventListener('click', function (e) {
      if (e.target === newModal) _op_closeNewModal();
    });
  }

  // Backdrop close for detail modal
  var detailModal = document.getElementById('opp-modal-detail');
  if (detailModal) {
    detailModal.addEventListener('click', function (e) {
      if (e.target === detailModal) _op_closeDetailModal();
    });
  }

  _bindTableEvents();
}

function _bindTableEvents() {
  var viewBtns = document.querySelectorAll('.opp-btn-view');
  for (var i = 0; i < viewBtns.length; i++) {
    (function (btn) {
      btn.addEventListener('click', function () {
        var id = btn.getAttribute('data-id');
        _op_openDetailModal(id);
      });
    })(viewBtns[i]);
  }
}

// ---------------------------------------------------------------------------
// New Opportunity Modal
// ---------------------------------------------------------------------------
var _currentDetailId = null;

function _op_openNewModal() {
  var modal = document.getElementById('opp-modal-new');
  if (!modal) return;
  modal.classList.remove('hidden');
  modal.style.display = 'flex';

  // Clear fields
  var fields = ['opp-new-representative', 'opp-new-product', 'opp-new-notes'];
  for (var i = 0; i < fields.length; i++) {
    var el = document.getElementById(fields[i]);
    if (el) el.value = '';
  }
  var statusSel = document.getElementById('opp-new-status');
  if (statusSel) statusSel.value = 'Lead';

  // Load companies
  var companySel = document.getElementById('opp-new-company');
  if (companySel) {
    companySel.innerHTML = '<option value="">Carregando...</option>';
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res || !res.ok) {
          companySel.innerHTML = '<option value="">Erro ao carregar</option>';
          return;
        }
        var opts = '<option value="">Selecione a empresa</option>';
        var companies = res.data || [];
        companies.sort(function (a, b) {
          return (a.name || '').localeCompare(b.name || '');
        });
        for (var i = 0; i < companies.length; i++) {
          opts += '<option value="' + escapeHtml(companies[i].id) + '" data-name="' + escapeHtml(companies[i].name || '') + '">' +
            escapeHtml(companies[i].name || companies[i].id) + '</option>';
        }
        companySel.innerHTML = opts;
      })
      .withFailureHandler(function () {
        companySel.innerHTML = '<option value="">Erro ao carregar</option>';
      })
      .Api_getCompanies();
  }
}

function _op_closeNewModal() {
  var modal = document.getElementById('opp-modal-new');
  if (!modal) return;
  modal.classList.add('hidden');
  modal.style.display = 'none';
}

function _submitNewOpp() {
  var companySel = document.getElementById('opp-new-company');
  var company_id = companySel ? companySel.value : '';
  var company_name = '';
  if (companySel && companySel.selectedIndex >= 0) {
    var opt = companySel.options[companySel.selectedIndex];
    company_name = opt ? (opt.getAttribute('data-name') || opt.text || '') : '';
  }

  if (!company_id) {
    showAlert('Selecione uma empresa.', 'warning');
    return;
  }

  var data = {
    company_id: company_id,
    company_name: company_name,
    representative: (document.getElementById('opp-new-representative') || {}).value || '',
    product: (document.getElementById('opp-new-product') || {}).value || '',
    status: (document.getElementById('opp-new-status') || {}).value || 'Lead',
    notes: (document.getElementById('opp-new-notes') || {}).value || ''
  };

  var btnSave = document.getElementById('opp-modal-new-save');
  if (btnSave) { btnSave.disabled = true; btnSave.textContent = 'Salvando...'; }

  google.script.run
    .withSuccessHandler(function (res) {
      if (btnSave) { btnSave.disabled = false; btnSave.textContent = 'Criar Oportunidade'; }
      if (!res || !res.ok) {
        showAlert('Erro ao criar: ' + (res ? res.error : 'desconhecido'), 'error');
        return;
      }
      showAlert('Oportunidade criada com sucesso!', 'success');
      _op_closeNewModal();
      // Reload list
      google.script.run
        .withSuccessHandler(function (r2) {
          if (r2 && r2.ok) {
            _opps = r2.data || [];
            _refreshTable();
          }
        })
        .Api_getOpportunities();
    })
    .withFailureHandler(function (err) {
      if (btnSave) { btnSave.disabled = false; btnSave.textContent = 'Criar Oportunidade'; }
      showAlert('Erro: ' + err.message, 'error');
    })
    .Api_createOpportunity(data);
}

// ---------------------------------------------------------------------------
// Detail Modal
// ---------------------------------------------------------------------------
function _op_openDetailModal(id) {
  _currentDetailId = id;
  var modal = document.getElementById('opp-modal-detail');
  if (!modal) return;
  modal.classList.remove('hidden');
  modal.style.display = 'flex';

  var body = document.getElementById('opp-detail-body');
  if (body) body.innerHTML = '<div class="spinner-ring"></div>';

  var title = document.getElementById('opp-detail-title');
  if (title) title.textContent = 'Carregando...';

  google.script.run
    .withSuccessHandler(function (res) {
      if (!res || !res.ok) {
        if (body) body.innerHTML = '<div class="empty-state">Erro ao carregar oportunidade.</div>';
        return;
      }
      var opp = res.data;
      if (title) title.textContent = escapeHtml(opp.company_name || opp.id || 'Oportunidade');

      // Sync status select to current
      var sel = document.getElementById('opp-detail-status-sel');
      if (sel) sel.value = opp.status || '';

      if (body) body.innerHTML = _buildDetailBody(opp);
    })
    .withFailureHandler(function (err) {
      if (body) body.innerHTML = '<div class="empty-state">Erro: ' + escapeHtml(err.message) + '</div>';
    })
    .Api_getOpportunity(id);
}

function _buildDetailBody(opp) {
  var badge = '<span class="badge ' + _oppBadgeClass(opp.status || '') + '">' + escapeHtml(opp.status || '—') + '</span>';

  var rows = [
    ['ID', opp.id],
    ['Empresa', opp.company_name || opp.company_id],
    ['Representante', opp.representative],
    ['Tipo de Cliente', opp.client_type],
    ['Produto', opp.product],
    ['Temperatura Máx.', opp.max_temp],
    ['Sensores XT', opp.qty_sensors_xt],
    ['Sensores HT', opp.qty_sensors_ht],
    ['Sensores Probe', opp.qty_sensors_probe],
    ['Ponto de Instalação', opp.installation_point],
    ['Detalhe Automação', opp.automation_detail],
    ['Hydro View', opp.hydro_view],
    ['Distância Infra', opp.infra_distance],
    ['Notas Técnicas', opp.tech_notes],
    ['Notas', opp.notes],
    ['Data Formulário', formatDate(opp.form_date)],
    ['Nº Proposta Legacy', opp.legacy_quote_number],
    ['Fonte Importação', opp.import_source],
    ['Criado em', formatDate(opp.created_at)]
  ];

  var html = '<div style="margin-bottom:12px">' + badge + '</div>';
  html += '<table style="width:100%;border-collapse:collapse;font-size:13px">';
  for (var i = 0; i < rows.length; i++) {
    var val = rows[i][1];
    if (!val && val !== 0) continue;
    html +=
      '<tr style="border-bottom:1px solid #f3f4f6">' +
        '<td style="padding:6px 8px;color:#6b7280;width:40%;vertical-align:top">' + escapeHtml(rows[i][0]) + '</td>' +
        '<td style="padding:6px 8px;vertical-align:top">' + escapeHtml(String(val)) + '</td>' +
      '</tr>';
  }
  html += '</table>';
  return html;
}

function _op_closeDetailModal() {
  _currentDetailId = null;
  var modal = document.getElementById('opp-modal-detail');
  if (!modal) return;
  modal.classList.add('hidden');
  modal.style.display = 'none';

  var note = document.getElementById('opp-detail-status-note');
  if (note) note.value = '';
}

function _submitStatusChange() {
  if (!_currentDetailId) return;

  var sel = document.getElementById('opp-detail-status-sel');
  var note = document.getElementById('opp-detail-status-note');
  var newStatus = sel ? sel.value : '';
  var noteVal = note ? note.value : '';

  if (!newStatus) {
    showAlert('Selecione um status.', 'warning');
    return;
  }

  var btn = document.getElementById('opp-detail-status-confirm');
  if (btn) { btn.disabled = true; btn.textContent = 'Salvando...'; }

  var id = _currentDetailId;

  google.script.run
    .withSuccessHandler(function (res) {
      if (btn) { btn.disabled = false; btn.textContent = 'Confirmar Mudança'; }
      if (!res || !res.ok) {
        showAlert('Erro: ' + (res ? res.error : 'desconhecido'), 'error');
        return;
      }
      showAlert('Status atualizado com sucesso!', 'success');

      // Update local cache
      for (var i = 0; i < _opps.length; i++) {
        if (_opps[i].id === id) { _opps[i].status = newStatus; break; }
      }

      // Refresh detail body with updated data
      _op_openDetailModal(id);
      _refreshTable();

      if (note) note.value = '';
    })
    .withFailureHandler(function (err) {
      if (btn) { btn.disabled = false; btn.textContent = 'Confirmar Mudança'; }
      showAlert('Erro: ' + err.message, 'error');
    })
    .Api_updateOpportunityStatus(id, newStatus, noteVal);
}

/* ===========================================================================
   MOTOR DE PRECIFICAÇÃO (F4) — Oportunidade → Proposta calculada
   Prefixo _opm para evitar colisão de namespace global entre telas.
   =========================================================================== */

var _opmOppId    = null;
var _opmProducts = [];
var _opmCalc     = null;
var _opmOppData  = null;

function _opmEnsureModal() {
  if (document.getElementById('opm-modal')) return;
  var html =
    '<div class="modal-backdrop hidden" id="opm-modal" style="z-index:1100">' +
      '<div class="modal" style="max-width:860px;width:95%;max-height:92vh;overflow:auto">' +
        '<div class="card">' +
          '<div class="card-header" style="display:flex;justify-content:space-between;align-items:center">' +
            '<div class="card-title">\uD83D\uDCB0 Motor de Precifica\u00e7\u00e3o</div>' +
            '<button class="btn btn-ghost btn-sm" id="opm-close">\u2715</button>' +
          '</div>' +
          '<div class="card-body">' +

            '<div class="form-label" style="font-weight:700;margin-bottom:4px">Equipamentos (Hydronix)</div>' +
            '<div id="opm-items"></div>' +
            '<button class="btn btn-ghost btn-sm" id="opm-add-item">+ adicionar item</button>' +

            '<div class="form-label" style="font-weight:700;margin:14px 0 4px">Pontos de instala\u00e7\u00e3o (infra)</div>' +
            '<div id="opm-points"></div>' +
            '<button class="btn btn-ghost btn-sm" id="opm-add-point">+ adicionar ponto</button>' +

            '<div class="form-label" style="font-weight:700;margin:14px 0 4px">Log\u00edstica</div>' +
            '<div style="display:flex;gap:10px;flex-wrap:wrap">' +
              '<label style="font-size:12px">Dist\u00e2ncia (km, ida)<br><input class="form-input" id="opm-km" type="number" min="0" value="0" style="width:110px"></label>' +
              '<label style="font-size:12px">Pessoas<br><input class="form-input" id="opm-pessoas" type="number" min="1" value="2" style="width:80px"></label>' +
              '<label style="font-size:12px">Viagens<br><input class="form-input" id="opm-viagens" type="number" min="1" value="1" style="width:80px"></label>' +
              '<label style="font-size:12px">T\u00e9cnicos<br><input class="form-input" id="opm-tecnicos" type="number" min="1" value="1" style="width:80px"></label>' +
            '</div>' +

            '<div style="margin-top:14px;display:flex;gap:8px">' +
              '<button class="btn btn-primary" id="opm-calc">Calcular</button>' +
              '<button class="btn btn-success hidden" id="opm-create">Criar Proposta com este c\u00e1lculo</button>' +
            '</div>' +
            '<div id="opm-result" style="margin-top:14px"></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  document.body.insertAdjacentHTML('beforeend', html);

  document.getElementById('opm-close').addEventListener('click', _opmClose);
  document.getElementById('opm-add-item').addEventListener('click', function () { _opmAddItemRow('', 1); });
  document.getElementById('opm-add-point').addEventListener('click', function () { _opmAddPointRow('', '', 1.0); });
  document.getElementById('opm-calc').addEventListener('click', _opmCalcular);
  document.getElementById('opm-create').addEventListener('click', _opmCriarProposta);
  document.getElementById('opm-modal').addEventListener('click', function (e) {
    if (e.target === document.getElementById('opm-modal')) _opmClose();
  });
}

function _opmClose() {
  var m = document.getElementById('opm-modal');
  if (m) { m.classList.add('hidden'); m.style.display = 'none'; }
}

function _opmOpen(oppId) {
  console.log('[Motor] abrindo para', oppId);
  if (!oppId) { showAlert('Abra uma oportunidade antes de gerar a proposta.', 'warning'); return; }
  _opmOppId = oppId;
  _opmCalc  = null;
  _opmEnsureModal();
  if (!document.getElementById('opm-modal')) {
    showAlert('Falha ao montar a janela do motor (opm-modal não criado).', 'error');
    return;
  }

  var m = document.getElementById('opm-modal');
  m.classList.remove('hidden');
  m.style.display = 'flex';
  document.getElementById('opm-result').innerHTML = '';
  document.getElementById('opm-create').classList.add('hidden');
  document.getElementById('opm-items').innerHTML = '';
  document.getElementById('opm-points').innerHTML = '';

  var boot = function (oppFetched) {
    _opmOppData = oppFetched || null;
    // Pré-popula a partir da oportunidade (lista local ou busca direta)
    var opp = oppFetched || null;
    if (!opp) {
      for (var i = 0; i < _opps.length; i++) { if (_opps[i].id === oppId) { opp = _opps[i]; break; } }
    }

    var pts = [];
    if (opp && opp.points_json) {
      try { pts = JSON.parse(opp.points_json) || []; } catch (e) { pts = []; }
    }
    if (!pts.length && opp && Number(opp.infra_distance) > 0) {
      pts = [{ descricao: 'Ponto 1', comprimento_m: Number(opp.infra_distance), fd: 1.0 }];
    }
    if (!pts.length) pts = [{ descricao: 'Ponto 1', comprimento_m: 10, fd: 1.0 }];
    for (var p = 0; p < pts.length; p++) {
      _opmAddPointRow(pts[p].descricao || ('Ponto ' + (p + 1)), pts[p].comprimento_m || 0, pts[p].fd || 1.0);
    }
    _opmAddItemRow('', 1);
  };

  var startBoot = function () {
    // Em contextos fora da tela de Oportunidades (ex.: Visão 360), a opp
    // pode não estar em _opps — busca direta para pré-popular corretamente.
    var local = null;
    for (var i = 0; i < _opps.length; i++) { if (_opps[i].id === oppId) { local = _opps[i]; break; } }
    if (local) { boot(local); return; }
    google.script.run
      .withSuccessHandler(function (r) { boot((r && r.ok && r.data) ? r.data : null); })
      .withFailureHandler(function () { boot(null); })
      .Api_getOpportunity(oppId);
  };

  if (_opmProducts.length) { startBoot(); return; }
  google.script.run
    .withSuccessHandler(function (res) {
      _opmProducts = (res && res.ok && res.data) ? res.data : [];
      startBoot();
    })
    .withFailureHandler(function () { _opmProducts = []; startBoot(); })
    .Api_getProducts();
}

function _opmProductOptions(selected) {
  var html = '<option value="">— produto —</option>';
  for (var i = 0; i < _opmProducts.length; i++) {
    var pr = _opmProducts[i];
    var sel = (pr.code === selected) ? ' selected' : '';
    html += '<option value="' + escapeHtml(pr.code) + '"' + sel + '>' +
            escapeHtml(pr.code + ' — ' + (pr.description || '')) + '</option>';
  }
  return html;
}

function _opmAddItemRow(code, qty) {
  var row = document.createElement('div');
  row.className = 'opm-item-row';
  row.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:6px';
  row.innerHTML =
    '<div style="display:flex;gap:8px;align-items:center">' +
      '<select class="form-input opm-item-code" style="flex:1">' + _opmProductOptions(code) + '</select>' +
      '<input class="form-input opm-item-qty" type="number" min="1" value="' + (qty || 1) + '" style="width:70px" title="Qtde">' +
      '<button class="btn btn-ghost btn-sm opm-row-del" title="remover">\uD83D\uDDD1</button>' +
    '</div>' +
    '<div class="opm-item-desc" style="font-size:11px;color:#64748b;margin:2px 0 0 4px"></div>';
  row.style.cssText = 'display:block;margin-bottom:8px';
  var updateDesc = function () {
    var sel = row.querySelector('.opm-item-code').value;
    var prod = null;
    for (var pi = 0; pi < _opmProducts.length; pi++) { if (_opmProducts[pi].code === sel) { prod = _opmProducts[pi]; break; } }
    row.querySelector('.opm-item-desc').textContent = (prod && prod.long_description) ? prod.long_description : '';
  };
  row.querySelector('.opm-item-code').addEventListener('change', updateDesc);
  updateDesc();
  row.querySelector('.opm-row-del').addEventListener('click', function () { row.parentNode.removeChild(row); });
  document.getElementById('opm-items').appendChild(row);
}

function _opmAddPointRow(desc, metros, fd) {
  var row = document.createElement('div');
  row.className = 'opm-point-row';
  row.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:6px';
  row.innerHTML =
    '<input class="form-input opm-pt-desc" type="text" value="' + escapeHtml(desc || '') + '" placeholder="descri\u00e7\u00e3o" style="flex:1">' +
    '<input class="form-input opm-pt-m" type="number" min="0" step="0.5" value="' + (metros || 0) + '" style="width:90px" title="metros">' +
    '<select class="form-input opm-pt-fd" style="width:150px" title="dificuldade">' +
      '<option value="1.0"'  + (fd == 1.0 ? ' selected' : '') + '>FD 1,0 — piso</option>' +
      '<option value="1.3"'  + (fd == 1.3 ? ' selected' : '') + '>FD 1,3 — altura &gt;3m</option>' +
      '<option value="1.5"'  + (fd == 1.5 ? ' selected' : '') + '>FD 1,5 — ATEX/HT</option>' +
      '<option value="1.8"'  + (fd == 1.8 ? ' selected' : '') + '>FD 1,8 — parada restrita</option>' +
    '</select>' +
    '<button class="btn btn-ghost btn-sm opm-row-del" title="remover">\uD83D\uDDD1</button>';
  row.querySelector('.opm-row-del').addEventListener('click', function () { row.parentNode.removeChild(row); });
  document.getElementById('opm-points').appendChild(row);
}

function _opmCollectInput() {
  var items = [];
  var itemRows = document.querySelectorAll('#opm-items .opm-item-row');
  for (var i = 0; i < itemRows.length; i++) {
    var code = itemRows[i].querySelector('.opm-item-code').value;
    var qty  = parseInt(itemRows[i].querySelector('.opm-item-qty').value, 10) || 1;
    if (code) items.push({ code: code, qty: qty });
  }
  var points = [];
  var ptRows = document.querySelectorAll('#opm-points .opm-point-row');
  for (var p = 0; p < ptRows.length; p++) {
    var m = parseFloat(ptRows[p].querySelector('.opm-pt-m').value) || 0;
    if (m > 0) {
      points.push({
        descricao:     ptRows[p].querySelector('.opm-pt-desc').value || ('Ponto ' + (p + 1)),
        comprimento_m: m,
        fd:            parseFloat(ptRows[p].querySelector('.opm-pt-fd').value) || 1.0
      });
    }
  }
  return {
    items:        items,
    points:       points,
    distancia_km: parseFloat(document.getElementById('opm-km').value) || 0,
    n_pessoas:    parseInt(document.getElementById('opm-pessoas').value, 10) || 2,
    n_viagens:    parseInt(document.getElementById('opm-viagens').value, 10) || 1,
    n_tecnicos:   parseInt(document.getElementById('opm-tecnicos').value, 10) || 1
  };
}

function _opmCalcular() {
  var input = _opmCollectInput();
  if (!input.items.length) { showAlert('Adicione ao menos um equipamento.', 'warning'); return; }
  var btn = document.getElementById('opm-calc');
  btn.disabled = true; btn.textContent = 'Calculando...';
  google.script.run
    .withSuccessHandler(function (res) {
      btn.disabled = false; btn.textContent = 'Calcular';
      if (!res || !res.ok) { showAlert('Erro no c\u00e1lculo: ' + (res ? res.error : '?'), 'error'); return; }
      _opmCalc = res.data;
      _opmRenderResult(res.data);
      document.getElementById('opm-create').classList.remove('hidden');
    })
    .withFailureHandler(function (err) {
      btn.disabled = false; btn.textContent = 'Calcular';
      showAlert('Falha no c\u00e1lculo: ' + (err.message || err), 'error');
    })
    .Api_prcCalcProposta(input);
}

function _opmRenderResult(c) {
  var margemPct = ((c.margem_global || 0) * 100).toFixed(1);
  var alertas = '';
  if (c.alertas && c.alertas.length) {
    alertas = '<div style="background:#fef3c7;border-radius:8px;padding:8px 12px;margin-top:8px;font-size:12px">' +
      '\u26A0\uFE0F ' + c.alertas.map(escapeHtml).join('<br>\u26A0\uFE0F ') + '</div>';
  }
  document.getElementById('opm-result').innerHTML =
    '<table class="data-table" style="font-size:13px">' +
      '<tr><td>Materiais (venda)</td><td style="text-align:right;font-weight:600">' + formatBRL(c.materiais.subtotal_venda_brl) + '</td></tr>' +
      '<tr><td>Infraestrutura + Start-up + Deslocamento (com impostos e margem de servi\u00e7o)</td><td style="text-align:right;font-weight:600">' + formatBRL(c.servicos_gross_up.preco_brl) + '</td></tr>' +
      '<tr><td style="font-weight:700">TOTAL DA PROPOSTA</td><td style="text-align:right;font-weight:700;color:#16a34a">' + formatBRL(c.total_proposta_brl) + '</td></tr>' +
      '<tr><td>Margem global estimada</td><td style="text-align:right">' + margemPct + '%</td></tr>' +
      '<tr><td style="color:#64748b;font-size:12px">D\u00f3lar usado</td><td style="text-align:right;color:#64748b;font-size:12px">R$ ' + (c.dolar_venda || 0).toFixed(2) + '</td></tr>' +
    '</table>' + alertas;
}

function _opmCriarProposta() {
  if (!_opmCalc) return;
  var opp = _opmOppData || null;
  if (!opp) {
    for (var i = 0; i < _opps.length; i++) { if (_opps[i].id === _opmOppId) { opp = _opps[i]; break; } }
  }
  if (!opp) { showAlert('Oportunidade n\u00e3o encontrada \u2014 recarregue a tela.', 'error'); return; }

  // Itens da proposta: materiais (do motor) + linha de serviços (gross-up)
  var items = [];
  var mi = _opmCalc.materiais.items || [];
  for (var k = 0; k < mi.length; k++) {
    var prod = null;
    for (var j = 0; j < _opmProducts.length; j++) { if (_opmProducts[j].code === mi[k].code) { prod = _opmProducts[j]; break; } }
    items.push({
      code:        mi[k].code,
      description: prod ? (prod.description || mi[k].code) : mi[k].code,
      qty:         mi[k].qty,
      unit_price:  mi[k].preco_unit_brl,
      total:       mi[k].preco_total_brl
    });
  }
  items.push({
    code: 'SERV-INSTALACAO',
    description: 'Infraestrutura, instala\u00e7\u00e3o, start-up e deslocamento',
    qty: 1,
    unit_price: _opmCalc.servicos_gross_up.preco_brl,
    total: _opmCalc.servicos_gross_up.preco_brl
  });

  var payload = {
    type:          opp.client_type === 'CONCRETO' ? 'CONCRETO' : (opp.product || 'ORGANICO'),
    client_id:     opp.company_id,
    client_name:   opp.company_name,
    responsible:   opp.representative || '',
    items:         items,
    scope_text:    'Proposta gerada pelo motor de precifica\u00e7\u00e3o a partir da oportunidade ' + opp.id + '.',
    startup_value: 0, // start-up já está dentro da linha de serviços (gross-up)
    pricing_json:  _opmCalc,
    opportunity_id: opp.id
  };

  var btn = document.getElementById('opm-create');
  btn.disabled = true; btn.textContent = 'Criando...';
  google.script.run
    .withSuccessHandler(function (res) {
      btn.disabled = false; btn.textContent = 'Criar Proposta com este c\u00e1lculo';
      if (!res || !res.ok) { showAlert('Erro ao criar proposta: ' + (res ? res.error : '?'), 'error'); return; }
      var created = res.data || {};
      showAlert('Proposta ' + (created.number || created.id) + ' criada pelo motor! Total ' + formatBRL(_opmCalc.total_proposta_brl), 'success');
      _opmClose();
      _op_closeDetailModal();
      showSection('quotes');
    })
    .withFailureHandler(function (err) {
      btn.disabled = false; btn.textContent = 'Criar Proposta com este c\u00e1lculo';
      showAlert('Falha: ' + (err.message || err), 'error');
    })
    .Api_propCreate(payload);
}


// Delegação global: funciona independentemente de quando a modal foi renderizada
document.addEventListener('click', function (ev) {
  var t = ev.target;
  if (t && (t.id === 'opp-detail-motor-btn' || (t.closest && t.closest('#opp-detail-motor-btn')))) {
    try {
      _opmOpen(_currentDetailId);
    } catch (e) {
      console.error('[Motor]', e);
      if (typeof showAlert === 'function') showAlert('Erro ao abrir o motor: ' + (e && e.message ? e.message : e), 'error');
      else alert('Erro ao abrir o motor: ' + (e && e.message ? e.message : e));
    }
  }
});

</script>
