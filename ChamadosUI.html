<script>
// =============================================================================
// ChamadosUI.html — SGA (Sistema de Gestão Allegro)
// Pós-venda com workflow 8D-lite (adaptação Volvo PIL → equipe de 4):
//   ABERTO (1D descrever) → EM_ATENDIMENTO (2D assumir / 3D conter / 4D analisar)
//   → [AGUARDANDO_CLIENTE] → RESOLVIDO (5D validar, exige solução + causa raiz)
//   → FECHADO (7D/8D lição aprendida).
// Prefixo _tkt. ES5. Todos os botões com estado de envio (anti duplo-clique).
// =============================================================================

var _tktList = [];
var _tktFiltroStatus = 'ABERTOS';
var _tktDetailId = null;

function renderChamados(area) {
  area.innerHTML =
    '<div class="page-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">' +
      '<div class="page-header-left">' +
        '<h1 class="page-title">🛠️ Chamados</h1>' +
        '<p class="page-subtitle">Pós-venda com método: descrever → atender → resolver (causa raiz) → fechar (lição aprendida).</p>' +
      '</div>' +
      '<select class="form-input" id="tkt-filtro" style="width:200px">' +
        '<option value="ABERTOS"' + (_tktFiltroStatus === 'ABERTOS' ? ' selected' : '') + '>Em aberto (todos)</option>' +
        '<option value="ABERTO">Abertos (novos)</option>' +
        '<option value="EM_ATENDIMENTO">Em atendimento</option>' +
        '<option value="AGUARDANDO_CLIENTE">Aguardando cliente</option>' +
        '<option value="RESOLVIDO">Resolvidos</option>' +
        '<option value="FECHADO">Fechados</option>' +
        '<option value="TODOS">Todos</option>' +
      '</select>' +
    '</div>' +
    '<div id="tkt-list-wrap"><div class="spinner-ring" style="margin:24px auto"></div></div>';
  document.getElementById('tkt-filtro').addEventListener('change', function () {
    _tktFiltroStatus = this.value;
    _tktRenderList();
  });
  _tktLoad();
}

function _tktLoad() {
  google.script.run.withSuccessHandler(function (r) {
    _tktList = (r && r.ok && r.data) ? r.data : [];
    _tktRenderList();
  }).withFailureHandler(function (e) {
    var w = document.getElementById('tkt-list-wrap');
    if (w) w.innerHTML = '<div class="empty-state">Erro: ' + escapeHtml(e.message || e) + '</div>';
  }).Api_tktGetAll({});
}

function _tktBadge(st) {
  var map = { ABERTO: 'badge-red', EM_ATENDIMENTO: 'badge-yellow', AGUARDANDO_CLIENTE: 'badge-blue',
              RESOLVIDO: 'badge-green', FECHADO: 'badge-gray' };
  return map[st] || 'badge-gray';
}

function _tktSlaInfo(t) {
  if (t.status === 'RESOLVIDO' || t.status === 'FECHADO') return '';
  var abertoEm = new Date(t.opened_at || t.created_at);
  var horas = Number(t.sla_resolution_h || 0);
  if (!horas || isNaN(abertoEm.getTime())) return '';
  var limite = new Date(abertoEm.getTime() + horas * 3600000);
  var resta = limite - new Date();
  if (resta < 0) return '<span style="color:#b42318;font-weight:700;font-size:11px">SLA estourado</span>';
  if (resta < 24 * 3600000) return '<span style="color:#b54708;font-weight:700;font-size:11px">SLA &lt; 24h</span>';
  return '<span style="color:#98a2b3;font-size:11px">SLA ' + Math.floor(resta / 86400000) + 'd</span>';
}

function _tktRenderList() {
  var w = document.getElementById('tkt-list-wrap');
  if (!w) return;
  var ABERTOS = { ABERTO: 1, EM_ATENDIMENTO: 1, AGUARDANDO_CLIENTE: 1 };
  var lista = _tktList.filter(function (t) {
    if (_tktFiltroStatus === 'TODOS') return true;
    if (_tktFiltroStatus === 'ABERTOS') return ABERTOS[t.status];
    return t.status === _tktFiltroStatus;
  });
  if (!lista.length) {
    w.innerHTML = '<div class="card"><div class="card-body"><div class="empty-state" style="padding:28px 0">' +
      '<div class="empty-icon">🛠️</div><div class="empty-title">Nenhum chamado neste filtro</div>' +
      '<div class="empty-desc">Chamados nascem na Visão 360 do cliente, já vinculados.</div></div></div></div>';
    return;
  }
  var rows = '';
  for (var i = 0; i < lista.length; i++) {
    var t = lista[i];
    rows += '<tr style="cursor:pointer" class="tkt-row" data-id="' + escapeHtml(t.id) + '">' +
      '<td><code style="font-size:11px">' + escapeHtml(t.id) + '</code></td>' +
      '<td>' + escapeHtml(t.company_name || t.company_id || '') + '</td>' +
      '<td><b>' + escapeHtml(t.title || '') + '</b></td>' +
      '<td style="text-align:center"><span class="badge ' + (t.priority === 'CRITICA' || t.priority === 'ALTA' ? 'badge-red' : 'badge-gray') + '">' + escapeHtml(t.priority || '') + '</span></td>' +
      '<td style="text-align:center"><span class="badge ' + _tktBadge(t.status) + '">' + escapeHtml(t.status || '') + '</span></td>' +
      '<td style="text-align:center">' + _tktSlaInfo(t) + '</td>' +
      '<td style="font-size:11px;color:#98a2b3">' + formatDate(t.opened_at || t.created_at) + '</td>' +
    '</tr>';
  }
  w.innerHTML =
    '<div class="card"><div class="table-wrap"><table class="data-table">' +
      '<thead><tr><th>ID</th><th>Cliente</th><th>Título</th><th>Prior.</th><th>Status</th><th>SLA</th><th>Aberto em</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div></div>';
  var trs = w.querySelectorAll('.tkt-row');
  for (var b = 0; b < trs.length; b++) {
    trs[b].addEventListener('click', function () { _tktOpen(this.getAttribute('data-id')); });
  }
}

/* ───────────────────── DETALHE (global: chamável da Visão 360) ───────────────────── */

function _tktEnsureModal() {
  if (document.getElementById('tkt-modal')) return;
  document.body.insertAdjacentHTML('beforeend',
    '<div class="modal-backdrop hidden" id="tkt-modal" style="z-index:1160">' +
      '<div class="modal" style="max-width:860px;width:96%;max-height:94vh;overflow:auto">' +
        '<div class="card"><div class="card-header" style="display:flex;justify-content:space-between;align-items:center">' +
          '<div class="card-title" id="tkt-m-title">🛠️ Chamado</div>' +
          '<button class="btn btn-ghost btn-sm" id="tkt-m-close">✕</button>' +
        '</div><div class="card-body" id="tkt-m-body"></div></div>' +
      '</div></div>');
  document.getElementById('tkt-m-close').addEventListener('click', _tktClose);
  document.getElementById('tkt-modal').addEventListener('click', function (e) {
    if (e.target === document.getElementById('tkt-modal')) _tktClose();
  });
}

function _tktClose() {
  var m = document.getElementById('tkt-modal');
  if (m) { m.classList.add('hidden'); m.style.display = 'none'; }
}

function _tktOpen(ticketId) {
  _tktDetailId = ticketId;
  _tktEnsureModal();
  var m = document.getElementById('tkt-modal');
  m.classList.remove('hidden'); m.style.display = 'flex';
  document.getElementById('tkt-m-body').innerHTML = '<div class="spinner-ring" style="margin:20px auto"></div>';
  google.script.run.withSuccessHandler(function (r) {
    if (!r || !r.ok) {
      document.getElementById('tkt-m-body').innerHTML = '<p style="color:#b42318">Erro: ' + escapeHtml(r ? r.error : '?') + '</p>';
      return;
    }
    _tktRenderDetail(r.data);
  }).withFailureHandler(function (e) {
    document.getElementById('tkt-m-body').innerHTML = '<p style="color:#b42318">Falha: ' + escapeHtml(e.message || e) + '</p>';
  }).Api_tktGetDetail(ticketId);
}

/* mapeamento 8D-lite: o que cada etapa significa na Allegro */
var _TKT_8D_HINT = {
  ABERTO:             '1D/2D — descrito; assuma o atendimento para iniciar',
  EM_ATENDIMENTO:     '3D/4D — contenção e análise: alimente o chamado com o diagnóstico',
  AGUARDANDO_CLIENTE: 'aguardando retorno/acesso do cliente — o relógio do cliente, não o nosso',
  RESOLVIDO:          '5D/6D — solução validada; feche com a lição aprendida',
  FECHADO:            '7D/8D — encerrado com aprendizado registrado'
};

function _tktRenderDetail(d) {
  var t = d.ticket;
  document.getElementById('tkt-m-title').textContent = '🛠️ ' + t.id + ' — ' + (t.title || '');
  var b = document.getElementById('tkt-m-body');

  var feed = '';
  if (t.description) {
    feed += '<div style="background:#f8fafc;border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:12.5px">' +
      '<b>Descrição (1D):</b> ' + escapeHtml(t.description) + '</div>';
  }
  for (var i = 0; i < d.updates.length; i++) {
    var u = d.updates[i];
    var icon = u.tipo === 'ANEXO' ? '📎' : (u.tipo === 'STATUS' ? '🔁' : '💬');
    feed += '<div style="display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:12.5px">' +
      '<span>' + icon + '</span>' +
      '<div style="flex:1">' +
        (u.anexo_url
          ? '<a href="' + escapeHtml(u.anexo_url) + '" target="_blank">' + escapeHtml(u.anexo_name || 'anexo') + '</a> '
          : '') +
        escapeHtml(u.texto || '') +
        '<div style="color:#98a2b3;font-size:11px">' + formatDate(u.timestamp) + ' · ' + escapeHtml(u.user_name || '') + '</div>' +
      '</div></div>';
  }
  if (!feed) feed = '<p style="color:#98a2b3;font-size:12px">Sem interações ainda — alimente o chamado abaixo.</p>';

  b.innerHTML =
    '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">' +
      '<div style="font-size:13px">' +
        '<b>' + escapeHtml((d.company && d.company.name) || t.company_id || '') + '</b>' +
        ((d.company && d.company.city) ? ' · ' + escapeHtml(d.company.city + (d.company.state ? '/' + d.company.state : '')) : '') +
        (t.serial_id ? ' · ⚙️ ' + escapeHtml(t.serial_id) : '') +
      '</div>' +
      '<div style="display:flex;gap:6px;align-items:center">' +
        '<span class="badge ' + (t.priority === 'CRITICA' || t.priority === 'ALTA' ? 'badge-red' : 'badge-gray') + '">' + escapeHtml(t.priority || '') + '</span>' +
        '<span class="badge ' + _tktBadge(t.status) + '">' + escapeHtml(t.status) + '</span>' +
        _tktSlaInfo(t) +
      '</div>' +
    '</div>' +
    '<div style="font-size:11.5px;color:#667085;margin:6px 0 12px">📋 ' + (_TKT_8D_HINT[t.status] || '') + '</div>' +
    (t.root_cause ? '<div style="background:#ecfdf3;border:1px solid #abefc6;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:12.5px"><b>Causa raiz (4D):</b> ' + escapeHtml(t.root_cause) + (t.resolution_notes ? '<br><b>Solução (5D):</b> ' + escapeHtml(t.resolution_notes) : '') + '</div>' : '') +
    '<div id="tkt-flow-btns" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px"></div>' +
    '<div class="form-label" style="font-weight:700;margin-bottom:4px">Linha do tempo do chamado</div>' +
    '<div style="max-height:300px;overflow:auto;margin-bottom:12px">' + feed + '</div>' +
    '<div style="display:flex;gap:8px;align-items:flex-start">' +
      '<textarea class="form-input" id="tkt-comment" rows="2" placeholder="alimentar o chamado: diagnóstico, contenção, contato com o cliente..." style="flex:1"></textarea>' +
      '<div style="display:flex;flex-direction:column;gap:6px">' +
        '<button class="btn btn-primary btn-sm" id="tkt-btn-comment">💬 Comentar</button>' +
        '<label class="btn btn-ghost btn-sm" style="text-align:center;cursor:pointer">📎 Anexar<input type="file" id="tkt-file" style="display:none"></label>' +
      '</div>' +
    '</div>';

  _tktRenderFlowButtons(t);
  document.getElementById('tkt-btn-comment').addEventListener('click', _tktComentar);
  document.getElementById('tkt-file').addEventListener('change', _tktAnexar);
}

function _tktRenderFlowButtons(t) {
  var box = document.getElementById('tkt-flow-btns');
  var btns = [];
  if (t.status === 'ABERTO') {
    btns.push({ label: '▶ Iniciar atendimento', cls: 'btn-primary', fn: function () { _tktMudarStatus('EM_ATENDIMENTO'); } });
  } else if (t.status === 'EM_ATENDIMENTO') {
    btns.push({ label: '⏸ Aguardando cliente', cls: 'btn-ghost', fn: function () { _tktMudarStatus('AGUARDANDO_CLIENTE'); } });
    btns.push({ label: '✅ Resolver (solução + causa raiz)', cls: 'btn-success', fn: _tktResolver });
  } else if (t.status === 'AGUARDANDO_CLIENTE') {
    btns.push({ label: '▶ Retomar atendimento', cls: 'btn-primary', fn: function () { _tktMudarStatus('EM_ATENDIMENTO'); } });
    btns.push({ label: '✅ Resolver (solução + causa raiz)', cls: 'btn-success', fn: _tktResolver });
  } else if (t.status === 'RESOLVIDO') {
    btns.push({ label: '🔒 Fechar com lição aprendida', cls: 'btn-primary', fn: _tktFechar });
    btns.push({ label: '↩ Reabrir atendimento', cls: 'btn-ghost', fn: function () { _tktMudarStatus('EM_ATENDIMENTO'); } });
  }
  var html = '';
  for (var i = 0; i < btns.length; i++) {
    html += '<button class="btn ' + btns[i].cls + ' btn-sm" data-fi="' + i + '">' + btns[i].label + '</button>';
  }
  box.innerHTML = html;
  var els = box.querySelectorAll('button');
  for (var j = 0; j < els.length; j++) {
    (function (el, fn) {
      el.addEventListener('click', function () { _tktBusy(true); fn(); });
    })(els[j], btns[parseInt(els[j].getAttribute('data-fi'), 10)].fn);
  }
}

function _tktBusy(on) {
  var box = document.getElementById('tkt-flow-btns');
  if (!box) return;
  var els = box.querySelectorAll('button');
  for (var i = 0; i < els.length; i++) els[i].disabled = !!on;
}

function _tktRefresh() {
  _tktOpen(_tktDetailId);
  if (typeof _tktLoad === 'function' && document.getElementById('tkt-list-wrap')) _tktLoad();
  if (typeof _v360Load === 'function' && typeof _v360Sel !== 'undefined' && _v360Sel &&
      typeof ALLEGRO !== 'undefined' && ALLEGRO.activeSection === 'visao360') _v360Load(_v360Sel);
}

function _tktMudarStatus(novo) {
  google.script.run.withSuccessHandler(function (r) {
    if (!r || !r.ok) { showAlert('Erro: ' + (r ? r.error : '?'), 'error'); _tktBusy(false); return; }
    showAlert('Chamado → ' + novo, 'success');
    _tktRefresh();
  }).withFailureHandler(function (e) { showAlert('Falha: ' + (e.message || e), 'error'); _tktBusy(false); })
  .Api_tktUpdateStatus(_tktDetailId, novo, '');
}

function _tktResolver() {
  var solucao = prompt('Solução aplicada (5D — o que resolveu o problema):');
  if (!solucao) { _tktBusy(false); return; }
  var causa = prompt('Causa raiz (4D — por que aconteceu):');
  if (causa === null) { _tktBusy(false); return; }
  google.script.run.withSuccessHandler(function (r) {
    if (!r || !r.ok) { showAlert('Erro: ' + (r ? r.error : '?'), 'error'); _tktBusy(false); return; }
    showAlert('Chamado resolvido ✅', 'success');
    _tktRefresh();
  }).withFailureHandler(function (e) { showAlert('Falha: ' + (e.message || e), 'error'); _tktBusy(false); })
  .Api_tktResolver(_tktDetailId, solucao, causa || '');
}

function _tktFechar() {
  var licao = prompt('Lição aprendida (7D/8D — o que evita a reincidência?). Opcional:');
  if (licao === null) { _tktBusy(false); return; }
  var fechar = function () {
    google.script.run.withSuccessHandler(function (r) {
      if (!r || !r.ok) { showAlert('Erro: ' + (r ? r.error : '?'), 'error'); _tktBusy(false); return; }
      showAlert('Chamado fechado 🔒', 'success');
      _tktRefresh();
    }).withFailureHandler(function (e) { showAlert('Falha: ' + (e.message || e), 'error'); _tktBusy(false); })
    .Api_tktFechar(_tktDetailId);
  };
  if (licao && licao.trim()) {
    google.script.run.withSuccessHandler(fechar).withFailureHandler(fechar)
      .Api_tktComentar(_tktDetailId, '📚 Lição aprendida: ' + licao.trim());
  } else {
    fechar();
  }
}

function _tktComentar() {
  var txt = document.getElementById('tkt-comment').value;
  if (!txt.trim()) { showAlert('Escreva o comentário.', 'warning'); return; }
  var btn = document.getElementById('tkt-btn-comment');
  btn.disabled = true; btn.textContent = 'Enviando...';
  google.script.run.withSuccessHandler(function (r) {
    if (!r || !r.ok) { showAlert('Erro: ' + (r ? r.error : '?'), 'error'); btn.disabled = false; btn.textContent = '💬 Comentar'; return; }
    _tktRefresh();
  }).withFailureHandler(function (e) {
    showAlert('Falha: ' + (e.message || e), 'error'); btn.disabled = false; btn.textContent = '💬 Comentar';
  }).Api_tktComentar(_tktDetailId, txt);
}

function _tktAnexar() {
  var input = document.getElementById('tkt-file');
  var file = input.files && input.files[0];
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { showAlert('Arquivo acima de 8 MB — envie um menor ou suba direto no Drive.', 'warning'); input.value = ''; return; }
  showAlert('Enviando ' + file.name + '...', 'info');
  var reader = new FileReader();
  reader.onload = function () {
    var base64 = String(reader.result).split(',')[1];
    google.script.run.withSuccessHandler(function (r) {
      if (!r || !r.ok) { showAlert('Erro: ' + (r ? r.error : '?'), 'error'); return; }
      showAlert('Anexo salvo na pasta do chamado 📎', 'success');
      _tktRefresh();
    }).withFailureHandler(function (e) { showAlert('Falha: ' + (e.message || e), 'error'); })
    .Api_tktAnexar(_tktDetailId, { base64: base64, mime: file.type, name: file.name });
  };
  reader.readAsDataURL(file);
  input.value = '';
}
</script>
