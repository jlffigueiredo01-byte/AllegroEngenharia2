<script>
// =============================================================================
// ChamadosUI.html — SGA (Sistema de Gestão Allegro)
// Pós-venda com workflow 8D-lite (adaptação Volvo PIL → equipe de 4):
//   ABERTO (1D descrever) → EM_ATENDIMENTO (2D assumir / 3D conter / 4D analisar)
//   → [AGUARDANDO_CLIENTE] → RESOLVIDO (5D validar, exige solução + causa raiz)
//   → FECHADO (7D/8D lição aprendida).
// Prefixo _tkt. ES5. Todos os botões com estado de envio (anti duplo-clique).
// =============================================================================

var _tktList = [];
var _tktFiltroStatus = 'ABERTOS';
var _tktDetailId = null;

function renderChamados(area) {
  area.innerHTML =
    '<div class="page-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">' +
      '<div class="page-header-left">' +
        '<h1 class="page-title">🛠️ Chamados</h1>' +
        '<p class="page-subtitle">Pós-venda com método: descrever → atender → resolver (causa raiz) → fechar (lição aprendida).</p>' +
      '</div>' +
      '<select class="sga-form-select" id="tkt-filtro" style="width:200px">' +
        '<option value="ABERTOS"' + (_tktFiltroStatus === 'ABERTOS' ? ' selected' : '') + '>Em aberto (todos)</option>' +
        '<option value="ABERTO">Abertos (novos)</option>' +
        '<option value="EM_ATENDIMENTO">Em atendimento</option>' +
        '<option value="AGUARDANDO_CLIENTE">Aguardando cliente</option>' +
        '<option value="RESOLVIDO">Resolvidos</option>' +
        '<option value="FECHADO">Fechados</option>' +
        '<option value="A_COBRAR">💸 Com cobrança pendente</option>' +
        '<option value="TODOS">Todos</option>' +
      '</select>' +
    '</div>' +
    '<div id="tkt-list-wrap"></div>';
  // skeleton enquanto carrega a lista
  (function(){ var sk = document.getElementById('tkt-list-wrap'); if (sk && window.SGA && SGA.skeleton) SGA.skeleton(sk, { type: 'list', count: 5 }); })();
  document.getElementById('tkt-filtro').addEventListener('change', function () {
    _tktFiltroStatus = this.value;
    _tktRenderList();
  });
  if (window._tktPendingId) {
    var pend = window._tktPendingId;
    window._tktPendingId = null;
    _tktOpen(pend);
    return;
  }
  _tktLoad();
}

function _tktLoad() {
  var wrap = document.getElementById('tkt-list-wrap');
  if (wrap && window.SGA && SGA.skeleton) SGA.skeleton(wrap, { type: 'list', count: 5 });
  google.script.run.withSuccessHandler(function (r) {
    _tktList = (r && r.ok && r.data) ? r.data : [];
    _tktRenderList();
  }).withFailureHandler(function (e) {
    var w = document.getElementById('tkt-list-wrap');
    if (w) w.innerHTML = '<div class="sga-empty sga-empty--error"><div class="sga-empty__icon">⚠️</div><h3 class="sga-empty__title">Não foi possível carregar</h3><p class="sga-empty__text">' + escapeHtml(e.message || e) + '</p></div>';
  }).Api_tktGetAll({});
}

function _tktBadge(st) {
  var map = { ABERTO: 'badge-red', EM_ATENDIMENTO: 'badge-yellow', AGUARDANDO_CLIENTE: 'badge-blue',
              RESOLVIDO: 'badge-green', FECHADO: 'badge-gray' };
  return map[st] || 'badge-gray';
}

function _tktSlaInfo(t) {
  if (t.status === 'RESOLVIDO' || t.status === 'FECHADO') return '';
  var abertoEm = new Date(t.opened_at || t.created_at);
  var horas = Number(t.sla_resolution_h || 0);
  if (!horas || isNaN(abertoEm.getTime())) return '';
  var limite = new Date(abertoEm.getTime() + horas * 3600000);
  var resta = limite - new Date();
  if (resta < 0) return '<span style="color:var(--sga-color-danger);font-weight:700;font-size:11px">SLA estourado</span>';
  if (resta < 24 * 3600000) return '<span style="color:var(--sga-color-warning);font-weight:700;font-size:11px">SLA &lt; 24h</span>';
  return '<span style="color:var(--sga-text-soft);font-size:11px">SLA ' + Math.floor(resta / 86400000) + 'd</span>';
}

function _tktRenderList() {
  var w = document.getElementById('tkt-list-wrap');
  if (!w) return;
  var ABERTOS = { ABERTO: 1, EM_ATENDIMENTO: 1, AGUARDANDO_CLIENTE: 1 };
  var lista = _tktList.filter(function (t) {
    if (_tktFiltroStatus === 'TODOS') return true;
    if (_tktFiltroStatus === 'ABERTOS') return ABERTOS[t.status];
    if (_tktFiltroStatus === 'A_COBRAR') return t.cobranca_status === 'PENDENTE';
    return t.status === _tktFiltroStatus;
  });
  if (!lista.length) {
    var hasAny = _tktList && _tktList.length > 0;
    if (window.SGA && SGA.empty) {
      if (hasAny) {
        SGA.empty(w, {
          icon: '🔍',
          title: 'Nenhum chamado neste filtro',
          text: 'Tente outro filtro de status para ver mais chamados.',
          variant: 'filtered'
        });
      } else {
        SGA.empty(w, {
          icon: '🎫',
          title: 'Nenhum chamado registrado',
          text: 'Chamados nascem na Visão 360 do cliente — abra uma empresa e use a aba de chamados para criar o primeiro.'
        });
      }
    } else {
      w.innerHTML = '<div class="sga-empty">' +
        '<div class="sga-empty__icon">' + (hasAny ? '🔍' : '🎫') + '</div>' +
        '<h3 class="sga-empty__title">' + (hasAny ? 'Nenhum chamado neste filtro' : 'Nenhum chamado registrado') + '</h3>' +
        '<p class="sga-empty__text">Chamados nascem na Visão 360 do cliente, já vinculados.</p>' +
      '</div>';
    }
    return;
  }
  var rows = '';
  for (var i = 0; i < lista.length; i++) {
    var t = lista[i];
    rows += '<tr style="cursor:pointer" class="sga-table__row tkt-row" data-id="' + escapeHtml(t.id) + '">' +
      '<td class="sga-table__td"><code style="font-size:11px">' + escapeHtml(t.id) + '</code></td>' +
      '<td class="sga-table__td">' + escapeHtml(t.company_name || t.company_id || '') + '</td>' +
      '<td class="sga-table__td"><b>' + escapeHtml(t.title || '') + '</b></td>' +
      '<td class="sga-table__td" style="text-align:center"><span class="badge ' + (t.priority === 'CRITICA' || t.priority === 'ALTA' ? 'badge-red' : 'badge-gray') + '">' + escapeHtml(t.priority || '') + '</span></td>' +
      '<td class="sga-table__td" style="text-align:center"><span class="badge ' + _tktBadge(t.status) + '">' + escapeHtml(t.status || '') + '</span></td>' +
      '<td class="sga-table__td" style="text-align:center">' + _tktSlaInfo(t) + '</td>' +
      '<td class="sga-table__td" style="text-align:right;font-size:12px">' +
        (Number(t.custo_total) > 0 ? formatBRL(Number(t.custo_total)) : '') +
        (t.cobranca_status === 'PENDENTE' ? ' <span class="badge badge-red" style="font-size:10px">a cobrar</span>' : '') +
        (t.cobranca_status === 'COBRADO' ? ' <span class="badge badge-green" style="font-size:10px">✓</span>' : '') +
      '</td>' +
      '<td class="sga-table__td" style="font-size:11px;color:var(--sga-text-soft)">' + formatDate(t.opened_at || t.created_at) + '</td>' +
    '</tr>';
  }
  w.innerHTML =
    '<div class="sga-table-wrap"><table class="sga-table sga-table--compact">' +
      '<thead><tr>' +
        '<th class="sga-table__th">ID</th>' +
        '<th class="sga-table__th">Cliente</th>' +
        '<th class="sga-table__th">Título</th>' +
        '<th class="sga-table__th">Prior.</th>' +
        '<th class="sga-table__th">Status</th>' +
        '<th class="sga-table__th">SLA</th>' +
        '<th class="sga-table__th">Custo</th>' +
        '<th class="sga-table__th">Aberto em</th>' +
      '</tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>';
  var trs = w.querySelectorAll('.tkt-row');
  for (var b = 0; b < trs.length; b++) {
    trs[b].addEventListener('click', function () { _tktOpen(this.getAttribute('data-id')); });
  }
}

/* ───────────────────── DETALHE (global: chamável da Visão 360) ───────────────────── */

function _tktOpen(ticketId) {
  _tktDetailId = ticketId;
  // PADRÃO DO SISTEMA: página dedicada na área de conteúdo, nunca popup.
  if (typeof ALLEGRO !== 'undefined' && ALLEGRO.activeSection !== 'chamados') {
    window._tktPendingId = ticketId;
    showSection('chamados');
    return;
  }
  var area = document.getElementById('section-content');
  area.innerHTML =
    '<button class="sga-btn sga-btn--ghost sga-btn--sm" id="tkt-voltar" style="margin-bottom:10px">← Voltar aos chamados</button>' +
    '<div class="card"><div class="card-body" id="tkt-m-body"></div></div>';
  (function(){ var sk = document.getElementById('tkt-m-body'); if (sk && window.SGA && SGA.skeleton) SGA.skeleton(sk, { type: 'lines', count: 4 }); })();
  document.getElementById('tkt-voltar').addEventListener('click', function () {
    renderChamados(document.getElementById('section-content'));
  });
  google.script.run.withSuccessHandler(function (r) {
    if (!r || !r.ok) {
      document.getElementById('tkt-m-body').innerHTML = '<p style="color:var(--sga-color-danger)">Erro: ' + escapeHtml(r ? r.error : 'sem resposta') + '</p>';
      return;
    }
    _tktRenderDetail(r.data);
  }).withFailureHandler(function (e) {
    document.getElementById('tkt-m-body').innerHTML = '<p style="color:var(--sga-color-danger)">Falha: ' + escapeHtml(e.message || e) + '</p>';
  }).Api_tktGetDetail(ticketId);
}

/* mapeamento 8D-lite: o que cada etapa significa na Allegro */
var _TKT_8D_HINT = {
  ABERTO:             '1D/2D — descrito; assuma o atendimento para iniciar',
  EM_ATENDIMENTO:     '3D/4D — contenção e análise: alimente o chamado com o diagnóstico',
  AGUARDANDO_CLIENTE: 'aguardando retorno/acesso do cliente — o relógio do cliente, não o nosso',
  RESOLVIDO:          '5D/6D — solução validada; feche com a lição aprendida',
  FECHADO:            '7D/8D — encerrado com aprendizado registrado'
};

function _tktRenderDetail(d) {
  var t = d.ticket;
  var b = document.getElementById('tkt-m-body');

  var feed = '';
  if (t.description) {
    feed += '<div style="background:var(--sga-bg-surface-alt);border-radius:var(--sga-radius-md);padding:8px 12px;margin-bottom:6px;font-size:12.5px">' +
      '<b>Descrição (1D):</b> ' + escapeHtml(t.description) + '</div>';
  }
  for (var i = 0; i < d.updates.length; i++) {
    var u = d.updates[i];
    var icon = u.tipo === 'ANEXO' ? '📎' : (u.tipo === 'STATUS' ? '🔁' : (u.tipo === 'CUSTO' ? '💸' : (u.tipo === 'SISTEMA' ? '🏁' : '💬')));
    feed += '<div style="display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--sga-border-default);font-size:12.5px">' +
      '<span>' + icon + '</span>' +
      '<div style="flex:1">' +
        (u.anexo_url
          ? '<a href="' + escapeHtml(u.anexo_url) + '" target="_blank">' + escapeHtml(u.anexo_name || 'anexo') + '</a> '
          : '') +
        escapeHtml(u.texto || '') +
        (u.tipo === 'CUSTO' && u.valor ? ' <b style="color:var(--sga-color-danger)">' + formatBRL(Number(u.valor)) + '</b>' : '') +
        '<div style="color:var(--sga-text-soft);font-size:11px">' + formatDate(u.timestamp) + ' · ' + escapeHtml(u.user_name || '') + '</div>' +
      '</div></div>';
  }
  if (!feed) feed = '<p style="color:var(--sga-text-soft);font-size:12px">Sem interações ainda — alimente o chamado abaixo.</p>';

  b.innerHTML =
    '<h2 style="margin:0 0 10px;font-size:19px">🛠️ ' + escapeHtml(t.id) + ' — ' + escapeHtml(t.title || '') + '</h2>' +
    '<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center">' +
      '<div style="font-size:13px">' +
        '<b>' + escapeHtml((d.company && d.company.name) || t.company_id || '') + '</b>' +
        ((d.company && d.company.city) ? ' · ' + escapeHtml(d.company.city + (d.company.state ? '/' + d.company.state : '')) : '') +
        (t.serial_id ? ' · ⚙️ ' + escapeHtml(t.serial_id) : '') +
      '</div>' +
      '<div style="display:flex;gap:6px;align-items:center">' +
        '<span class="badge ' + (t.priority === 'CRITICA' || t.priority === 'ALTA' ? 'badge-red' : 'badge-gray') + '">' + escapeHtml(t.priority || '') + '</span>' +
        '<span class="badge ' + _tktBadge(t.status) + '">' + escapeHtml(t.status) + '</span>' +
        (Number(t.custo_total) > 0 ? '<span class="badge badge-yellow" title="custos lançados">💸 ' + formatBRL(Number(t.custo_total)) + '</span>' : '') +
        (t.cobranca_status === 'PENDENTE' ? '<span class="badge badge-red">a cobrar: ' + escapeHtml(t.cobranca_de) + '</span>' : '') +
        (t.cobranca_status === 'COBRADO' ? '<span class="badge badge-green">cobrado ✓</span>' : '') +
        (t.origem_erro ? '<span class="badge badge-gray" title="origem do erro">' + escapeHtml(t.origem_erro) + '</span>' : '') +
        _tktSlaInfo(t) +
      '</div>' +
    '</div>' +
    '<div style="font-size:11.5px;color:var(--sga-text-muted);margin:6px 0 12px">📋 ' + (_TKT_8D_HINT[t.status] || '') + '</div>' +
    (t.root_cause ? '<div style="background:var(--sga-color-success-bg);border:1px solid var(--sga-color-success-border);border-radius:var(--sga-radius-md);padding:8px 12px;margin-bottom:10px;font-size:12.5px"><b>Causa raiz (4D):</b> ' + escapeHtml(t.root_cause) + (t.resolution_notes ? '<br><b>Solução (5D):</b> ' + escapeHtml(t.resolution_notes) : '') + '</div>' : '') +
    '<div id="tkt-flow-btns" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px"></div>' +
    '<div id="tkt-inline-form" style="margin-bottom:14px"></div>' +
    '<div class="form-label" style="font-weight:700;margin-bottom:4px">Linha do tempo do chamado</div>' +
    '<div style="max-height:300px;overflow:auto;margin-bottom:12px">' + feed + '</div>' +
    '<div style="display:flex;gap:8px;align-items:flex-start">' +
      '<textarea class="sga-form-textarea" id="tkt-comment" rows="2" placeholder="alimentar o chamado: diagnóstico, contenção, contato com o cliente..." style="flex:1"></textarea>' +
      '<div style="display:flex;flex-direction:column;gap:6px">' +
        '<button class="sga-btn sga-btn--primary sga-btn--sm" id="tkt-btn-comment">💬 Comentar</button>' +
        '<label class="sga-btn sga-btn--ghost sga-btn--sm" style="text-align:center;cursor:pointer">📎 Anexar<input type="file" id="tkt-file" style="display:none"></label>' +
      '</div>' +
    '</div>';

  _tktRenderFlowButtons(t);
  document.getElementById('tkt-btn-comment').addEventListener('click', _tktComentar);
  document.getElementById('tkt-file').addEventListener('change', _tktAnexar);
}

function _tktRenderFlowButtons(t) {
  var box = document.getElementById('tkt-flow-btns');
  var btns = [];
  if (t.status === 'ABERTO') {
    btns.push({ label: '▶ Iniciar atendimento', cls: 'sga-btn--primary', fn: function () { _tktMudarStatus('EM_ATENDIMENTO'); } });
  } else if (t.status === 'EM_ATENDIMENTO') {
    btns.push({ label: '⏸ Aguardando cliente', cls: 'sga-btn--ghost', fn: function () { _tktMudarStatus('AGUARDANDO_CLIENTE'); } });
    btns.push({ label: '✅ Resolver (solução + causa raiz)', cls: 'sga-btn--primary', fn: _tktResolver });
  } else if (t.status === 'AGUARDANDO_CLIENTE') {
    btns.push({ label: '▶ Retomar atendimento', cls: 'sga-btn--primary', fn: function () { _tktMudarStatus('EM_ATENDIMENTO'); } });
    btns.push({ label: '✅ Resolver (solução + causa raiz)', cls: 'sga-btn--primary', fn: _tktResolver });
  } else if (t.status === 'RESOLVIDO') {
    btns.push({ label: '🔒 Fechar (origem do erro + cobrança)', cls: 'sga-btn--primary', fn: function () { _tktFechar(t); } });
    btns.push({ label: '↩ Reabrir atendimento', cls: 'sga-btn--ghost', fn: function () { _tktMudarStatus('EM_ATENDIMENTO'); } });
  } else if (t.status === 'FECHADO' && t.cobranca_status === 'PENDENTE') {
    btns.push({ label: '✔ Marcar cobrança realizada (' + formatBRL(Number(t.custo_total || 0)) + ' de ' + t.cobranca_de + ')', cls: 'sga-btn--primary', fn: _tktMarcarCobrado });
  }
  if (t.status === 'EM_ATENDIMENTO' || t.status === 'AGUARDANDO_CLIENTE' || t.status === 'RESOLVIDO') {
    btns.push({ label: '💸 Lançar custo', cls: 'sga-btn--ghost', fn: _tktLancarCusto });
  }
  // FB-00037: editar, cancelar e abrir Action Card direto do chamado
  if (t.status !== 'FECHADO') {
    btns.push({ label: '✏️ Editar', cls: 'sga-btn--ghost', fn: function () { _tktEditarForm(t); } });
    btns.push({ label: '🗑 Cancelar chamado', cls: 'sga-btn--ghost', fn: function () { _tktCancelarForm(t); } });
  }
  btns.push({ label: '🗂 Abrir Action Card', cls: 'sga-btn--ghost', fn: function () { _tktNovoActionCard(t); } });
  var html = '';
  for (var i = 0; i < btns.length; i++) {
    html += '<button class="sga-btn ' + btns[i].cls + ' sga-btn--sm" data-fi="' + i + '">' + btns[i].label + '</button>';
  }
  box.innerHTML = html;
  var els = box.querySelectorAll('button');
  for (var j = 0; j < els.length; j++) {
    (function (el, fn) {
      el.addEventListener('click', function () { _tktBusy(true); fn(); });
    })(els[j], btns[parseInt(els[j].getAttribute('data-fi'), 10)].fn);
  }
}

function _tktBusy(on) {
  var box = document.getElementById('tkt-flow-btns');
  if (!box) return;
  var els = box.querySelectorAll('button');
  for (var i = 0; i < els.length; i++) els[i].disabled = !!on;
}

function _tktRefresh() {
  _tktOpen(_tktDetailId);
  if (typeof _tktLoad === 'function' && document.getElementById('tkt-list-wrap')) _tktLoad();
  if (typeof _v360Load === 'function' && typeof _v360Sel !== 'undefined' && _v360Sel &&
      typeof ALLEGRO !== 'undefined' && ALLEGRO.activeSection === 'visao360') _v360Load(_v360Sel);
}

function _tktMudarStatus(novo) {
  google.script.run.withSuccessHandler(function (r) {
    if (!r || !r.ok) { showAlert('Erro: ' + (r ? r.error : '?'), 'error'); _tktBusy(false); return; }
    showAlert('Chamado → ' + novo, 'success');
    _tktRefresh();
  }).withFailureHandler(function (e) { showAlert('Falha: ' + (e.message || e), 'error'); _tktBusy(false); })
  .Api_tktUpdateStatus(_tktDetailId, novo, '');
}

function _tktResolver() {
  _tktBusy(false);
  var box = document.getElementById('tkt-inline-form');
  box.innerHTML =
    '<div style="background:var(--sga-bg-surface-alt);border:1px solid var(--sga-border-default);border-radius:var(--sga-radius-md);padding:12px 14px">' +
      '<div style="font-weight:700;margin-bottom:8px">✅ Resolver — validação da solução (4D/5D)</div>' +
      '<label style="font-size:12px;display:block">Solução aplicada *<br><textarea class="sga-form-textarea" id="tktf-solucao" rows="2" placeholder="o que resolveu o problema"></textarea></label>' +
      '<label style="font-size:12px;display:block;margin-top:6px">Causa raiz *<br><input class="sga-form-input" id="tktf-causa" placeholder="por que o problema aconteceu"></label>' +
      '<div style="display:flex;gap:8px;margin-top:10px">' +
        '<button class="sga-btn sga-btn--primary sga-btn--sm" id="tktf-resolver-ok">Confirmar resolução</button>' +
        '<button class="sga-btn sga-btn--ghost sga-btn--sm" id="tktf-cancel">Cancelar</button>' +
      '</div>' +
    '</div>';
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  document.getElementById('tktf-cancel').addEventListener('click', function () { box.innerHTML = ''; });
  document.getElementById('tktf-resolver-ok').addEventListener('click', function () {
    var sol = document.getElementById('tktf-solucao').value;
    var causa = document.getElementById('tktf-causa').value;
    if (!sol.trim() || !causa.trim()) { showAlert('Solução e causa raiz são obrigatórias.', 'warning'); return; }
    var btn = this; btn.disabled = true; btn.textContent = 'Salvando...';
    google.script.run.withSuccessHandler(function (r) {
      if (!r || !r.ok) { showAlert('Erro: ' + (r ? r.error : '?'), 'error'); btn.disabled = false; btn.textContent = 'Confirmar resolução'; return; }
      showAlert('Chamado resolvido ✅', 'success');
      _tktRefresh();
    }).withFailureHandler(function (e) { showAlert('Falha: ' + (e.message || e), 'error'); btn.disabled = false; })
    .Api_tktResolver(_tktDetailId, sol.trim(), causa.trim());
  });
}

/* ── FB-00037: editar chamado, cancelar e abrir Action Card ── */

function _tktEditarForm(t) {
  _tktBusy(false);
  var box = document.getElementById('tkt-inline-form');
  var prioOpt = function (v, label) {
    return '<option value="' + v + '"' + (t.priority === v ? ' selected' : '') + '>' + label + '</option>';
  };
  box.innerHTML =
    '<div style="background:var(--sga-bg-surface-alt);border:1px solid var(--sga-border-default);border-radius:var(--sga-radius-md);padding:12px 14px">' +
      '<div style="font-weight:700;margin-bottom:8px">✏️ Editar chamado</div>' +
      '<label style="font-size:12px;display:block">Título *<br><input class="sga-form-input" id="tktf-ed-title" value="' + escapeHtml(t.title || '') + '"></label>' +

function _tktFechar(t) {
  _tktBusy(false);
  var custo = Number((t && t.custo_total) || 0);
  var box = document.getElementById('tkt-inline-form');
  var radio = function (name, val, label, checked) {
    return '<label style="display:block;font-size:12.5px;margin:3px 0"><input type="radio" name="' + name + '" value="' + val + '"' + (checked ? ' checked' : '') + '> ' + label + '</label>';
  };
  box.innerHTML =
    '<div style="background:var(--sga-bg-surface-alt);border:1px solid var(--sga-border-default);border-radius:var(--sga-radius-md);padding:12px 14px">' +
      '<div style="font-weight:700;margin-bottom:8px">🔒 Fechar chamado — endgate (classificação obrigatória)</div>' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">' +
        '<div><div style="font-size:11px;font-weight:700;color:var(--sga-color-primary-dark);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px">Onde o erro surgiu? *</div>' +
          radio('tktf-origem', 'CLIENTE', '👤 Cliente — mau uso, infra, operação', true) +
          radio('tktf-origem', 'HYDRONIX', '🏭 Hydronix — defeito de fabricação (garantia)') +
          radio('tktf-origem', 'ALLEGRO', '🔧 Allegro — especificação/instalação/config') +
          radio('tktf-origem', 'NAO_IDENTIFICADO', '❓ Não identificado / sem defeito') +
        '</div>' +
        (custo > 0
          ? '<div><div style="font-size:11px;font-weight:700;color:var(--sga-color-primary-dark);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px">Quem paga ' + formatBRL(custo) + '? *</div>' +
            radio('tktf-cobranca', 'HYDRONIX', '🏭 Hydronix — repassar ao fabricante') +
            radio('tktf-cobranca', 'CLIENTE', '👤 Cliente — faturar') +
            radio('tktf-cobranca', 'ALLEGRO', '🔵 Allegro — absorver', true) +
          '</div>'
          : '<div style="font-size:12px;color:var(--sga-text-soft);align-self:center">Sem custos lançados neste chamado.</div>') +
      '</div>' +
      '<label style="font-size:12px;display:block;margin-top:8px">Lição aprendida (7D/8D — opcional)<br>' +
        '<input class="sga-form-input" id="tktf-licao" placeholder="o que evita a reincidência?"></label>' +
      '<div style="display:flex;gap:8px;margin-top:10px">' +
        '<button class="sga-btn sga-btn--primary sga-btn--sm" id="tktf-fechar-ok">Fechar chamado</button>' +
        '<button class="sga-btn sga-btn--ghost sga-btn--sm" id="tktf-cancel2">Cancelar</button>' +
      '</div>' +
    '</div>';
  box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  // sugestão inteligente: origem seleciona o pagador correspondente
  var sync = { CLIENTE: 'CLIENTE', HYDRONIX: 'HYDRONIX', ALLEGRO: 'ALLEGRO', NAO_IDENTIFICADO: 'ALLEGRO' };
  var origens = document.querySelectorAll('input[name="tktf-origem"]');
  for (var i = 0; i < origens.length; i++) {
    origens[i].addEventListener('change', function () {
      var alvo = document.querySelector('input[name="tktf-cobranca"][value="' + sync[this.value] + '"]');
      if (alvo) alvo.checked = true;
    });
  }
  document.getElementById('tktf-cancel2').addEventListener('click', function () { box.innerHTML = ''; });
  document.getElementById('tktf-fechar-ok').addEventListener('click', function () {
    var origem = (document.querySelector('input[name="tktf-origem"]:checked') || {}).value;
    if (!origem) { showAlert('Selecione a origem do erro.', 'warning'); return; }
    var cobr = (document.querySelector('input[name="tktf-cobranca"]:checked') || {}).value || 'ALLEGRO';
    var btn = this; btn.disabled = true; btn.textContent = 'Fechando...';
    google.script.run.withSuccessHandler(function (r) {
      if (!r || !r.ok) { showAlert('Erro: ' + (r ? r.error : '?'), 'error'); btn.disabled = false; btn.textContent = 'Fechar chamado'; return; }
      showAlert('Chamado fechado 🔒', 'success');
      _tktRefresh();
    }).withFailureHandler(function (e) { showAlert('Falha: ' + (e.message || e), 'error'); btn.disabled = false; })
    .Api_tktClassificarEFechar(_tktDetailId, origem, cobr, document.getElementById('tktf-licao').value || '');
  });
}

      _tktRefresh();
    }).withFailureHandler(function (e) { showAlert('Falha: ' + (e.message || e), 'error'); btn.disabled = false; })
    .Api_tktLancarCusto(_tktDetailId, desc.trim(), v);
  });

function _tktMarcarCobrado() {
  var doMark = function () {
    google.script.run.withSuccessHandler(function (r) {
      if (!r || !r.ok) { showAlert('Erro: ' + (r ? r.error : '?'), 'error'); _tktBusy(false); return; }
      showAlert('Cobrança registrada como realizada ✓', 'success');
      _tktRefresh();
    }).withFailureHandler(function (e) { showAlert('Falha: ' + (e.message || e), 'error'); _tktBusy(false); })
    .Api_tktMarcarCobrado(_tktDetailId);
  };
  if (window.SGA && SGA.confirm) {
    SGA.confirm('Confirmar que a cobrança foi realizada (NF emitida / reembolso recebido)?', { title: 'Confirmar cobrança' })
      .then(function (ok) { if (!ok) { _tktBusy(false); return; } doMark(); });
  } else {
    if (!confirm('Confirmar que a cobrança foi realizada (NF emitida / reembolso recebido)?')) { _tktBusy(false); return; }
    doMark();
  }
}

function _tktComentar() {
  var txt = document.getElementById('tkt-comment').value;
  if (!txt.trim()) { showAlert('Escreva o comentário.', 'warning'); return; }
  var btn = document.getElementById('tkt-btn-comment');
  btn.disabled = true; btn.textContent = 'Enviando...';
  google.script.run.withSuccessHandler(function (r) {
    if (!r || !r.ok) { showAlert('Erro: ' + (r ? r.error : '?'), 'error'); btn.disabled = false; btn.textContent = '💬 Comentar'; return; }
    _tktRefresh();
  }).withFailureHandler(function (e) {
    showAlert('Falha: ' + (e.message || e), 'error'); btn.disabled = false; btn.textContent = '💬 Comentar';
  }).Api_tktComentar(_tktDetailId, txt);
}

function _tktAnexar() {
  var input = document.getElementById('tkt-file');
  var file = input.files && input.files[0];
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) { showAlert('Arquivo acima de 8 MB — envie um menor ou suba direto no Drive.', 'warning'); input.value = ''; return; }
  showAlert('Enviando ' + file.name + '...', 'info');
  var reader = new FileReader();
  reader.onload = function () {
    var base64 = String(reader.result).split(',')[1];
    google.script.run.withSuccessHandler(function (r) {
      if (!r || !r.ok) { showAlert('Erro: ' + (r ? r.error : '?'), 'error'); return; }
      showAlert('Anexo salvo na pasta do chamado 📎', 'success');
      _tktRefresh();
    }).withFailureHandler(function (e) { showAlert('Falha: ' + (e.message || e), 'error'); })
    .Api_tktAnexar(_tktDetailId, { base64: base64, mime: file.type, name: file.name });
  };
  reader.readAsDataURL(file);
  input.value = '';
}
