<script>
// =============================================================================
// ConfigUI — renderConfig(area)
// Overrides the placeholder renderConfig defined in Scripts.html.
// ES5 only. No arrow functions, no const/let, no template literals.
// =============================================================================

function renderConfig(area) {
  // ------------------------------------------------------------------
  // Access gate — only GERAL / ADMIN may open this panel
  // ------------------------------------------------------------------
  var user = ALLEGRO.currentUser;
  var hasAccess = user && (user.role === 'GERAL' || user.role === 'ADMIN');

  if (!hasAccess) {
    area.innerHTML =
      '<div style="max-width:480px;margin:48px auto">' +
        '<div class="sga-empty">' +
          '<div class="sga-empty__icon">🔒</div>' +
          '<h3 class="sga-empty__title">Acesso Restrito</h3>' +
          '<p class="sga-empty__text">Esta área é exclusiva para administradores do sistema.</p>' +
        '</div>' +
      '</div>';
    return;
  }

  // ------------------------------------------------------------------
  // Shell: header + tab buttons + two content panels
  // ------------------------------------------------------------------
  area.innerHTML =
    '<div class="page-header">' +
      '<div class="page-header-left">' +
        '<h1 class="page-title">⚙️ Configurações</h1>' +
        '<p class="page-subtitle">Gerencie usuários e parâmetros do sistema.</p>' +
      '</div>' +
    '</div>' +

    '<div style="display:flex;gap:8px;margin-bottom:24px;">' +
      '<button id="cfg-tab-users-btn"  class="sga-btn sga-btn--primary"  onclick="cfgShowTab(\'users\')" >Usuários</button>' +
      '<button id="cfg-tab-config-btn" class="sga-btn sga-btn--ghost"    onclick="cfgShowTab(\'config\')">Configurações do sistema</button>' +
    '</div>' +

    '<div id="cfg-tab-users"  >' + _cfgBuildUsersTab()  + '</div>' +
    '<div id="cfg-tab-config" class="hidden">' + _cfgBuildConfigTab() + '</div>';

  // Load data for both tabs
  _cfgLoadUsers();
  _cfgLoadConfigValues();
}

// ------------------------------------------------------------------
// Tab switching
// ------------------------------------------------------------------
function cfgShowTab(tab) {
  var usersDiv  = document.getElementById('cfg-tab-users');
  var configDiv = document.getElementById('cfg-tab-config');
  var usersBtn  = document.getElementById('cfg-tab-users-btn');
  var configBtn = document.getElementById('cfg-tab-config-btn');

  if (tab === 'users') {
    usersDiv.classList.remove('hidden');
    configDiv.classList.add('hidden');
    usersBtn.className  = 'sga-btn sga-btn--primary';
    configBtn.className = 'sga-btn sga-btn--ghost';
  } else {
    usersDiv.classList.add('hidden');
    configDiv.classList.remove('hidden');
    usersBtn.className  = 'sga-btn sga-btn--ghost';
    configBtn.className = 'sga-btn sga-btn--primary';
  }
}

// ===========================================================================
// TAB: Usuários
// ===========================================================================

function _cfgBuildUsersTab() {
  return '<div class="sga-card sga-card--bordered">' +
    '<div class="sga-card__header">' +
      '<h3 class="sga-card__title">Usuários</h3>' +
      '<button class="sga-btn sga-btn--primary sga-btn--sm" onclick="cfgOpenNewUserModal()">+ Novo Usuário</button>' +
    '</div>' +
    '<div class="sga-card__body">' +
      '<div id="cfg-users-spinner-wrap"></div>' +
      '<div class="sga-table-wrap">' +
        '<table class="sga-table" id="cfg-users-table">' +
          '<thead><tr>' +
            '<th class="sga-table__th">ID</th>' +
            '<th class="sga-table__th">Nome</th>' +
            '<th class="sga-table__th">Email</th>' +
            '<th class="sga-table__th">Perfil</th>' +
            '<th class="sga-table__th">Status</th>' +
            '<th class="sga-table__th sga-table__th--actions">Ações</th>' +
          '</tr></thead>' +
          '<tbody id="cfg-users-tbody"><tr><td colspan="6" class="sga-table__td" style="text-align:center;color:var(--sga-text-muted)">Carregando...</td></tr></tbody>' +
        '</table>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function _cfgLoadUsers() {
  var tbody   = document.getElementById('cfg-users-tbody');

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.ok) {
        tbody.innerHTML = '<tr><td colspan="6" class="sga-table__td" style="text-align:center;color:var(--sga-color-danger)">Erro ao carregar usuários.</td></tr>';
        return;
      }
      _cfgRenderUsersTable(res.data || []);
    })
    .withFailureHandler(function(err) {
      tbody.innerHTML = '<tr><td colspan="6" class="sga-table__td" style="text-align:center;color:var(--sga-color-danger)">Erro: ' + escapeHtml(String(err)) + '</td></tr>';
    })
    .Api_cfgGetUsers();
}

function _cfgRenderUsersTable(users) {
  var tbody = document.getElementById('cfg-users-tbody');
  if (!users || users.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="empty-state">Nenhum usuário cadastrado.</td></tr>';
    return;
  }

  var roleBadge = { GERAL: 'badge-blue', VENDAS: 'badge-green', TECNICO: 'badge-gray' };
  var rows = '';

  for (var i = 0; i < users.length; i++) {
    var u = users[i];
    var isActive  = String(u.active).toUpperCase() === 'TRUE';
    var roleClass = roleBadge[u.role] || 'badge-gray';
    var toggleLabel = isActive ? 'Desativar' : 'Ativar';

    rows +=
      '<tr>' +
        '<td style="font-family:monospace;font-size:12px;">' + escapeHtml(u.id || '') + '</td>' +
        '<td>' + escapeHtml(u.name || '') + '</td>' +
        '<td>' + escapeHtml(u.email || '') + '</td>' +
        '<td><span class="badge ' + roleClass + '">' + escapeHtml(u.role || '') + '</span></td>' +
        '<td>' +
          (isActive
            ? '<span class="badge badge-green">Ativo</span>'
            : '<span class="badge badge-red">Inativo</span>') +
        '</td>' +
        '<td>' +
          '<button class="sga-btn sga-btn--ghost sga-btn--sm" onclick="cfgToggleUser(\'' + escapeHtml(u.id) + '\')">' +
            toggleLabel +
          '</button>' +
        '</td>' +
      '</tr>';
  }

  tbody.innerHTML = rows;
}

// --- Modal helpers (SGA.openModal — modal criado on-demand) ---

var _cfgUserModal = null;

function cfgOpenNewUserModal() {
  var roles = {
    DIRETOR_TECNICO:   'Diretor Técnico',
    DIRETOR_COMERCIAL: 'Diretor Comercial',
    FINANCEIRO_ADMIN:  'Financeiro / Admin',
    TECNICO:           'Técnico'
  };
  var opts = '<option value="">— Selecione —</option>';
  for (var k in roles) { opts += '<option value="' + k + '">' + escapeHtml(roles[k]) + '</option>'; }
  var body =
    '<div class="sga-form-group">' +
      '<label class="sga-form-label">Nome <span class="sga-form-required">*</span></label>' +
      '<input id="cfg-new-name" class="sga-form-input" type="text" placeholder="Nome completo">' +
    '</div>' +
    '<div class="sga-form-group">' +
      '<label class="sga-form-label">Email</label>' +
      '<input id="cfg-new-email" class="sga-form-input" type="email" placeholder="email@exemplo.com">' +
    '</div>' +
    '<div class="sga-form-group">' +
      '<label class="sga-form-label">Perfil <span class="sga-form-required">*</span></label>' +
      '<select id="cfg-new-role" class="sga-form-select">' + opts + '</select>' +
    '</div>';
  _cfgUserModal = SGA.openModal({
    title: 'Novo Usuário',
    size: 'sm',
    body: body,
    footer: [
      { label: 'Cancelar', variant: 'ghost', onClick: 'close' },
      { label: 'Criar', variant: 'primary', primary: true, onClick: function () { cfgSubmitNewUser(); return false; } }
    ],
    onClose: function () { _cfgUserModal = null; }
  });
}

function cfgCloseNewUserModal() {
  if (_cfgUserModal) _cfgUserModal.close();
}

function cfgSubmitNewUser() {
  var name  = document.getElementById('cfg-new-name').value.trim();
  var email = document.getElementById('cfg-new-email').value.trim();
  var role  = document.getElementById('cfg-new-role').value;

  if (!name) { showAlert('Nome é obrigatório.', 'error'); return; }
  if (!role) { showAlert('Selecione um perfil.', 'error'); return; }

  setLoading(true);
  google.script.run
    .withSuccessHandler(function(res) {
      setLoading(false);
      if (!res || !res.ok) {
        showAlert(res.error || 'Erro ao criar usuário.', 'error');
        return;
      }
      showAlert('Usuário criado com sucesso!', 'success');
      cfgCloseNewUserModal();
      _cfgLoadUsers();
    })
    .withFailureHandler(function(err) {
      setLoading(false);
      showAlert('Erro: ' + String(err), 'error');
    })
    .Api_cfgCreateUser({ name: name, email: email, role: role });
}

function cfgToggleUser(id) {
  setLoading(true);
  google.script.run
    .withSuccessHandler(function(res) {
      setLoading(false);
      if (!res || !res.ok) {
        showAlert(res.error || 'Erro ao alterar status.', 'error');
        return;
      }
      var msg = res.newActive ? 'Usuário ativado.' : 'Usuário desativado.';
      showAlert(msg, 'success');
      _cfgLoadUsers();
    })
    .withFailureHandler(function(err) {
      setLoading(false);
      showAlert('Erro: ' + String(err), 'error');
    })
    .Api_cfgToggleUser(id);
}

// ===========================================================================
// TAB: Configurações do sistema
// ===========================================================================

function _cfgBuildConfigTab() {
  return '<div class="card">' +
    '<div class="card-header">' +
      '<span class="card-title">Configurações do Sistema</span>' +
    '</div>' +
    '<div class="card-body">' +
      '<div id="cfg-config-spinner" class="hidden" style="text-align:center;padding:24px;">' +
        '<div class="spinner-ring"></div>' +
      '</div>' +
      '<div class="table-wrap">' +
        '<table class="data-table" id="cfg-config-table">' +
          '<thead><tr>' +
            '<th>Chave</th><th>Valor</th><th>Descrição</th><th>Ações</th>' +
          '</tr></thead>' +
          '<tbody id="cfg-config-tbody"><tr><td colspan="4" class="empty-state">Carregando...</td></tr></tbody>' +
        '</table>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function _cfgLoadConfigValues() {
  var spinner = document.getElementById('cfg-config-spinner');
  var tbody   = document.getElementById('cfg-config-tbody');
  if (spinner) spinner.classList.remove('hidden');

  google.script.run
    .withSuccessHandler(function(res) {
      if (spinner) spinner.classList.add('hidden');
      if (!res || !res.ok) {
        tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Erro ao carregar configurações.</td></tr>';
        return;
      }
      _cfgRenderConfigTable(res.data || []);
    })
    .withFailureHandler(function(err) {
      if (spinner) spinner.classList.add('hidden');
      tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Erro: ' + escapeHtml(String(err)) + '</td></tr>';
    })
    .Api_cfgGetConfigValues();
}

function _cfgRenderConfigTable(rows) {
  var tbody = document.getElementById('cfg-config-tbody');
  if (!rows || rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="empty-state">Nenhuma configuração disponível.</td></tr>';
    return;
  }

  var html = '';
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var safeKey = escapeHtml(r.key   || '');
    var safeVal = escapeHtml(r.value || '');
    var safeDesc = escapeHtml(r.description || '');
    var inputId  = 'cfg-val-' + i;
    var rowId    = 'cfg-row-' + i;

    html +=
      '<tr id="' + rowId + '">' +
        '<td style="font-family:monospace;font-size:12px;">' + safeKey + '</td>' +
        '<td id="cfg-display-' + i + '">' + safeVal + '</td>' +
        '<td style="color:var(--text-secondary);">' + safeDesc + '</td>' +
        '<td>' +
          // Read-only view: "Editar" button
          '<span id="cfg-edit-btn-' + i + '">' +
            '<button class="sga-btn sga-btn--ghost sga-btn--sm" ' +
              'onclick="cfgStartEditConfig(' + i + ',\'' + escapeHtml(r.key) + '\')">' +
              'Editar' +
            '</button>' +
          '</span>' +
          // Edit view (hidden by default)
          '<span id="cfg-edit-form-' + i + '" class="hidden" style="display:none;">' +
            '<input id="' + inputId + '" class="form-input" type="text" value="' + safeVal + '" ' +
              'style="width:160px;display:inline-block;" />' +
            '<button class="sga-btn sga-btn--primary sga-btn--sm" style="margin-left:6px;" ' +
              'onclick="cfgSaveConfigValue(' + i + ',\'' + escapeHtml(r.key) + '\')">' +
              'Salvar' +
            '</button>' +
            '<button class="sga-btn sga-btn--ghost sga-btn--sm" style="margin-left:4px;" ' +
              'onclick="cfgCancelEditConfig(' + i + ')">' +
              'Cancelar' +
            '</button>' +
          '</span>' +
        '</td>' +
      '</tr>';
  }

  tbody.innerHTML = html;
}

function cfgStartEditConfig(idx, key) {
  var editBtn  = document.getElementById('cfg-edit-btn-'  + idx);
  var editForm = document.getElementById('cfg-edit-form-' + idx);
  if (editBtn)  editBtn.style.display  = 'none';
  if (editForm) {
    editForm.classList.remove('hidden');
    editForm.style.display = 'inline';
  }
}

function cfgCancelEditConfig(idx) {
  var editBtn  = document.getElementById('cfg-edit-btn-'  + idx);
  var editForm = document.getElementById('cfg-edit-form-' + idx);
  if (editBtn)  editBtn.style.display  = '';
  if (editForm) {
    editForm.classList.add('hidden');
    editForm.style.display = 'none';
  }
}

function cfgSaveConfigValue(idx, key) {
  var input = document.getElementById('cfg-val-' + idx);
  if (!input) return;
  var value = input.value;

  setLoading(true);
  google.script.run
    .withSuccessHandler(function(res) {
      setLoading(false);
      if (!res || !res.ok) {
        showAlert(res.error || 'Erro ao salvar configuração.', 'error');
        return;
      }
      // Update displayed value and close edit form
      var display = document.getElementById('cfg-display-' + idx);
      if (display) display.textContent = value;
      showAlert('Configuração salva.', 'success');
      cfgCancelEditConfig(idx);
    })
    .withFailureHandler(function(err) {
      setLoading(false);
      showAlert('Erro: ' + String(err), 'error');
    })
    .Api_cfgSetConfigValue(key, value);
}
</script>
