<style>
#help-panel { position:fixed; top:0; right:-420px; width:420px; height:100vh; background:#fff; z-index:8001; transition:right 0.3s ease; box-shadow:-4px 0 20px rgba(0,0,0,.15); overflow-y:auto; display:flex; flex-direction:column; }
#help-panel.open { right:0; }
#help-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:8000; display:none; }
#help-backdrop.open { display:block; }
.help-header { background:#1a56db; color:#fff; padding:20px 24px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
.help-header h2 { font-size:16px; font-weight:600; margin:0; }
.help-close { background:none; border:none; color:#fff; font-size:22px; cursor:pointer; padding:0; line-height:1; }
.help-body { padding:24px; flex-grow:1; }
.help-section { margin-bottom:20px; }
.help-section-title { font-size:13px; font-weight:700; color:#1a56db; text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
.help-section-text { font-size:13px; color:#374151; line-height:1.6; }
.help-steps { list-style:none; padding:0; margin:0; }
.help-steps li { font-size:13px; color:#374151; padding:4px 0 4px 20px; position:relative; line-height:1.5; }
.help-steps li::before { content:counter(step); counter-increment:step; position:absolute; left:0; color:#1a56db; font-weight:700; }
.help-steps { counter-reset:step; }
.help-tip { background:#eff6ff; border-left:3px solid #1a56db; padding:10px 14px; border-radius:0 8px 8px 0; font-size:12px; color:#1e40af; margin-top:8px; }
</style>

  function _buildHelpHTML(section) {
    var data = _helpContent[section];
    if (!data) return '';

    var html = '';

    html += '<div class="help-section">';
    html += '<div class="help-section-title">Início Rápido</div>';
    html += '<div class="help-section-text">' + data.quickStart + '</div>';
    html += '</div>';

    if (data.recursos && data.recursos.length) {
      html += '<div class="help-section">';
      html += '<div class="help-section-title">Principais Recursos</div>';
      html += '<ul class="help-steps">';
      for (var r = 0; r < data.recursos.length; r++) {
        html += '<li>' + data.recursos[r] + '</li>';
      }
      html += '</ul>';
      html += '</div>';
    }

    if (data.tasks && data.tasks.length) {
      for (var t = 0; t < data.tasks.length; t++) {
        var task = data.tasks[t];
        html += '<div class="help-section">';
        html += '<div class="help-section-title">Passo a Passo — ' + task.label + '</div>';
        html += '<ol class="help-steps">';
        for (var s = 0; s < task.steps.length; s++) {
          html += '<li>' + task.steps[s] + '</li>';
        }
        html += '</ol>';
        html += '</div>';
      }
    }

    if (data.tip) {
      html += '<div class="help-tip">💡 ' + data.tip + '</div>';
    }

    return html;
  }

  function _ensurePanel() {
    if (document.getElementById('help-panel')) return;

    var backdrop = document.createElement('div');
    backdrop.id = 'help-backdrop';
    document.body.appendChild(backdrop);

    var panel = document.createElement('div');
    panel.id = 'help-panel';
    panel.innerHTML =
      '<div class="help-header">' +
        '<h2 id="help-panel-title">❓ Ajuda</h2>' +
        '<button class="help-close" id="help-close-btn" aria-label="Fechar ajuda">×</button>' +
      '</div>' +
      '<div class="help-body" id="help-panel-body"></div>';
    document.body.appendChild(panel);

    document.getElementById('help-close-btn').onclick = function() {
      closeHelp();
    };

    backdrop.onclick = function() {
      closeHelp();
    };
  }

  function closeHelp() {
    var panel = document.getElementById('help-panel');
    var backdrop = document.getElementById('help-backdrop');
    if (panel) panel.classList.remove('open');
    if (backdrop) backdrop.classList.remove('open');
  }

  window.showHelp = function(section) {
    _ensurePanel();

    var data = _helpContent[section];
    var title = data ? '❓ Ajuda — ' + data.title : '❓ Ajuda';
    var body = _buildHelpHTML(section);

    document.getElementById('help-panel-title').textContent = title;
    document.getElementById('help-panel-body').innerHTML = body || '<p style="color:#6b7280;font-size:13px;">Nenhuma ajuda disponível para esta seção.</p>';

    var panel = document.getElementById('help-panel');
    var backdrop = document.getElementById('help-backdrop');
    panel.classList.add('open');
    backdrop.classList.add('open');
  };

  window.closeHelp = closeHelp;

  function _wrapShowSection() {
    if (typeof window.showSection !== 'function') {
      setTimeout(_wrapShowSection, 200);
      return;
    }

    var _origShowSection = window.showSection;

    window.showSection = function(section) {
      _origShowSection(section);

      setTimeout(function() {
        var header = document.querySelector('#section-content .page-header');
        if (header && _helpContent[section]) {
          var existing = document.getElementById('help-trigger-btn');
          if (!existing) {
            var btn = document.createElement('button');
            btn.id = 'help-trigger-btn';
            btn.className = 'btn btn-ghost btn-sm';
            btn.style.cssText = 'margin-left:auto;display:flex;align-items:center;gap:6px;';
            btn.innerHTML = '❓ Ajuda';
            btn.onclick = function() { showHelp(section); };
            header.appendChild(btn);
          }
        }
      }, 100);
    };
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', _wrapShowSection);
  } else {
    _wrapShowSection();
  }

})();
</script>
