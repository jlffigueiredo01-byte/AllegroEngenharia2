<script>
// CompaniesUI.html — Companies module UI (ES5, no arrow functions)
// Overrides renderCompanies(area) declared as placeholder in Scripts.html

var _companies = [];
var _coDetailModal = null;  // handle SGA.openModal — detalhe/edição
var _coNewModal = null;     // handle SGA.openModal — nova empresa

// ---------------------------------------------------------------------------
// Entry point
// ---------------------------------------------------------------------------

function renderCompanies(area) {
  area.innerHTML =
    '<div class="page-header">' +
      '<div class="page-header-left">' +
        '<div class="page-title">Empresas</div>' +
        '<div class="page-subtitle">Cadastro de empresas e organizações</div>' +
      '</div>' +
      '<button class="sga-btn sga-btn--primary" onclick="_openNewCompanyModal()">+ Nova Empresa</button>' +
    '</div>' +
    '<div class="card" style="margin-bottom:16px">' +
      '<div class="card-body" style="padding:12px 16px">' +
        '<input id="co-search" class="sga-form-input" type="text" placeholder="Buscar por nome, cidade ou estado…" ' +
               'oninput="_filterCompaniesTable()" style="max-width:360px">' +
      '</div>' +
    '</div>' +
    '<div id="co-stats" class="card" style="margin-bottom:16px;display:none">' +
      '<div class="card-body" style="padding:10px 16px;display:flex;gap:24px;font-size:13px;color:var(--sga-text-muted)">' +
        '<span id="co-stat-total"></span>' +
        '<span id="co-stat-active"></span>' +
      '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-header"><div class="card-title">Lista de Empresas</div></div>' +
      '<div class="card-body" id="co-table-wrap">' +
        '<div id="co-table-skeleton"></div>' +
      '</div>' +
    '</div>';

  // Skeleton enquanto carrega
  var sk = document.getElementById('co-table-skeleton');
  if (sk && window.SGA && SGA.skeleton) SGA.skeleton(sk, { type: 'list', count: 5 });

  _loadCompanies();
}

// ---------------------------------------------------------------------------
// Data loading
// ---------------------------------------------------------------------------

function _loadCompanies() {
  var wrap = document.getElementById('co-table-wrap');
  if (wrap && window.SGA && SGA.skeleton) SGA.skeleton(wrap, { type: 'list', count: 5 });
  google.script.run
    .withSuccessHandler(function(res) {
      if (!res.ok) { showAlert('Erro ao carregar empresas: ' + res.error, 'error'); return; }
      _companies = res.data || [];
      _renderCompaniesTable(_companies);
      _co_updateStats();
    })
    .withFailureHandler(function(err) {
      showAlert('Falha de comunicação: ' + err.message, 'error');
    })
    .Api_getCompanies();
}

function _co_updateStats() {
  var statsEl = document.getElementById('co-stats');
  if (!statsEl) return;
  var total  = _companies.length;
  var active = _companies.filter(function(c) {
    return String(c.active).toUpperCase() === 'TRUE';
  }).length;
  document.getElementById('co-stat-total').textContent  = 'Total: ' + total;
  document.getElementById('co-stat-active').textContent = 'Ativas: ' + active;
  statsEl.style.display = '';
}

// ---------------------------------------------------------------------------
// Table rendering
// ---------------------------------------------------------------------------

function _renderCompaniesTable(list) {
  var wrap = document.getElementById('co-table-wrap');
  if (!wrap) return;

  if (!list || list.length === 0) {
    if (window.SGA && SGA.empty) {
      SGA.empty(wrap, {
        icon: '🏢',
        title: 'Nenhuma empresa cadastrada',
        text: 'Cadastre a primeira empresa para começar a vincular contatos, propostas e chamados.',
        action: {
          label: '+ Nova Empresa',
          onClick: function () { if (typeof _openNewCompanyModal === 'function') _openNewCompanyModal(); }
        }
      });
    } else {
      wrap.innerHTML =
        '<div class="sga-empty">' +
          '<div class="sga-empty__icon">🏢</div>' +
          '<h3 class="sga-empty__title">Nenhuma empresa cadastrada</h3>' +
          '<p class="sga-empty__text">Cadastre a primeira empresa clicando em "Nova Empresa".</p>' +
        '</div>';
    }
    return;
  }

  var rows = '';
  for (var i = 0; i < list.length; i++) {
    var c = list[i];
    var isActive = String(c.active).toUpperCase() === 'TRUE';
    var badge = isActive
      ? '<span class="badge badge-green">Ativo</span>'
      : '<span class="badge badge-red">Inativo</span>';
    rows +=
      '<tr class="sga-table__row">' +
        '<td class="sga-table__td">' + escapeHtml(c.name || '') + '</td>' +
        '<td class="sga-table__td">' + escapeHtml(c.city  || '') + '</td>' +
        '<td class="sga-table__td">' + escapeHtml(c.state || '') + '</td>' +
        '<td class="sga-table__td">' + escapeHtml(c.client_type || '') + '</td>' +
        '<td class="sga-table__td">' + badge + '</td>' +
        '<td class="sga-table__td sga-table__td--actions">' +
          '<button class="sga-btn sga-btn--ghost sga-btn--sm" onclick="_openCompanyDetail(\'' + escapeHtml(c.id) + '\')">Ver</button>' +
        '</td>' +
      '</tr>';
  }

  wrap.innerHTML =
    '<div class="sga-table-wrap">' +
      '<table class="sga-table">' +
        '<thead><tr>' +
          '<th class="sga-table__th">Nome</th><th class="sga-table__th">Cidade</th><th class="sga-table__th">Estado</th><th class="sga-table__th">Tipo</th><th class="sga-table__th">Status</th><th class="sga-table__th sga-table__th--actions"></th>' +
        '</tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>' +
    '</div>';
}

function _filterCompaniesTable() {
  var input = document.getElementById('co-search');
  if (!input) return;
  var term = input.value.toUpperCase().trim();
  if (!term) {
    _renderCompaniesTable(_companies);
    return;
  }
  var filtered = _companies.filter(function(c) {
    var name  = String(c.name  || '').toUpperCase();
    var city  = String(c.city  || '').toUpperCase();
    var state = String(c.state || '').toUpperCase();
    var norm  = String(c.normalized_name || '').toUpperCase();
    return (
      name.indexOf(term)  !== -1 ||
      norm.indexOf(term)  !== -1 ||
      city.indexOf(term)  !== -1 ||
      state.indexOf(term) !== -1
    );
  });
  _renderCompaniesTable(filtered);
}

// ---------------------------------------------------------------------------
// Detail modal
// ---------------------------------------------------------------------------

function _coFind(id) {
  for (var i = 0; i < _companies.length; i++) {
    if (String(_companies[i].id) === String(id)) return _companies[i];
  }
  return null;
}

// Troca o corpo do modal de detalhe aberto (sem reabrir janela)
function _coSetDetailBody(html, title) {
  if (!_coDetailModal || !_coDetailModal.modal) return false;
  var body = _coDetailModal.modal.querySelector('.sga-modal__body');
  if (body) body.innerHTML = html;
  var t = _coDetailModal.modal.querySelector('.sga-modal__title');
  if (t && title) t.textContent = title;
  return true;
}

function _openCompanyDetail(id) {
  var company = _coFind(id);
  if (!company) { showAlert('Empresa não encontrada', 'error'); return; }
  // Reusa a janela se já estiver aberta (ex.: cancelar edição)
  if (_coSetDetailBody(_detailViewHtml(company), company.name || 'Empresa')) return;
  _coDetailModal = SGA.openModal({
    title: company.name || 'Empresa',
    size: 'sm',
    body: _detailViewHtml(company),
    onClose: function () { _coDetailModal = null; }
  });
}

function _detailViewHtml(c) {
  var isActive = String(c.active).toUpperCase() === 'TRUE';
  var badge = isActive
    ? '<span class="badge badge-green">Ativo</span>'
    : '<span class="badge badge-red">Inativo</span>';
  return (
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;font-size:14px">' +
      '<div><strong>ID</strong><br>' + escapeHtml(c.id || '') + '</div>' +
      '<div><strong>Status</strong><br>' + badge + '</div>' +
      '<div><strong>Cidade</strong><br>' + escapeHtml(c.city  || '—') + '</div>' +
      '<div><strong>Estado</strong><br>' + escapeHtml(c.state || '—') + '</div>' +
      '<div><strong>Tipo</strong><br>'   + escapeHtml(c.client_type || '—') + '</div>' +
      '<div><strong>Criado em</strong><br>' + formatDate(c.created_at || '') + '</div>' +
    '</div>' +
    '<div style="margin-top:20px;display:flex;gap:8px">' +
      '<button class="sga-btn sga-btn--secondary sga-btn--sm" onclick="_c360Open(\'' + escapeHtml(c.id) + '\')">🔎 Visão 360</button>' +
      '<button class="sga-btn sga-btn--primary sga-btn--sm" onclick="_openEditForm(\'' + escapeHtml(c.id) + '\')">Editar</button>' +
      (isActive
        ? '<button class="sga-btn sga-btn--danger sga-btn--sm" onclick="_confirmDeactivate(\'' + escapeHtml(c.id) + '\')">Desativar</button>'
        : '') +
    '</div>'
  );
}

function _openEditForm(id) {
  var company = _coFind(id);
  if (!company) return;
  if (!_coDetailModal || !_coDetailModal.modal) _openCompanyDetail(id);
  _coSetDetailBody(_editFormHtml(company), 'Editar — ' + (company.name || ''));
}

function _editFormHtml(c) {
  return (
    '<div class="sga-form-group">' +
      '<label class="sga-form-label">Nome <span class="sga-form-required">*</span></label>' +
      '<input id="edit-name" class="sga-form-input" type="text" value="' + escapeHtml(c.name || '') + '">' +
    '</div>' +
    '<div class="sga-form-row">' +
      '<div class="sga-form-group">' +
        '<label class="sga-form-label">Cidade</label>' +
        '<input id="edit-city" class="sga-form-input" type="text" value="' + escapeHtml(c.city || '') + '">' +
      '</div>' +
      '<div class="sga-form-group">' +
        '<label class="sga-form-label">Estado</label>' +
        '<input id="edit-state" class="sga-form-input" type="text" maxlength="2" value="' + escapeHtml(c.state || '') + '">' +
      '</div>' +
    '</div>' +
    '<div class="sga-form-group">' +
      '<label class="sga-form-label">Tipo</label>' +
      '<select id="edit-client-type" class="sga-form-select">' +
        _clientTypeOptions(c.client_type) +
      '</select>' +
    '</div>' +
    '<div style="display:flex;gap:8px;margin-top:20px;justify-content:flex-end">' +
      '<button class="sga-btn sga-btn--ghost sga-btn--sm" onclick="_openCompanyDetail(\'' + escapeHtml(c.id) + '\')">Cancelar</button>' +
      '<button class="sga-btn sga-btn--primary sga-btn--sm" onclick="_submitEditCompany(\'' + escapeHtml(c.id) + '\')">Salvar</button>' +
    '</div>'
  );
}

function _submitEditCompany(id) {
  var name       = document.getElementById('edit-name').value.trim();
  var city       = document.getElementById('edit-city').value.trim();
  var state      = document.getElementById('edit-state').value.trim().toUpperCase();
  var clientType = document.getElementById('edit-client-type').value;

  if (!name) { showAlert('Nome é obrigatório', 'error'); return; }

  setLoading(true);
  google.script.run
    .withSuccessHandler(function(res) {
      setLoading(false);
      if (!res.ok) { showAlert('Erro ao atualizar: ' + res.error, 'error'); return; }
      showAlert('Empresa atualizada com sucesso', 'success');
      _closeDetailModalDirect();
      _loadCompanies();
    })
    .withFailureHandler(function(err) {
      setLoading(false);
      showAlert('Falha de comunicação: ' + err.message, 'error');
    })
    .Api_updateCompany(id, { name: name, city: city, state: state, client_type: clientType });
}

function _confirmDeactivate(id) {
  var doIt = function () {
    setLoading(true);
    google.script.run
      .withSuccessHandler(function(res) {
        setLoading(false);
        if (!res.ok) { showAlert('Erro ao desativar: ' + res.error, 'error'); return; }
        showAlert('Empresa desativada', 'success');
        _closeDetailModalDirect();
        _loadCompanies();
      })
      .withFailureHandler(function(err) {
        setLoading(false);
        showAlert('Falha de comunicação: ' + err.message, 'error');
      })
      .Api_deactivateCompany(id);
  };
  if (window.SGA && SGA.confirm) {
    SGA.confirm('Desativar esta empresa? Esta ação pode ser revertida posteriormente.', { danger: true, okLabel: 'Desativar' })
      .then(function (ok) { if (ok) doIt(); });
  } else if (confirm('Desativar esta empresa? Esta ação pode ser revertida posteriormente.')) {
    doIt();
  }
}

function _closeDetailModalDirect() {
  if (_coDetailModal) _coDetailModal.close();
}

// ---------------------------------------------------------------------------
// New Company modal
// ---------------------------------------------------------------------------

function _newCompanyFormHtml() {
  return (
    '<div class="sga-form-group">' +
      '<label class="sga-form-label">Website</label>' +
      '<input id="new-website" class="sga-form-input" type="text" placeholder="https://exemplo.com.br">' +
      '<div style="margin-top:6px;display:flex;align-items:center;gap:10px">' +
        '<button type="button" id="new-enrich-btn" class="sga-btn sga-btn--secondary sga-btn--sm" onclick="_compEnrichClick()">🔍 Enriquecimento de Dados</button>' +
        '<span id="new-enrich-status" style="font-size:12px;color:var(--sga-text-muted)"></span>' +
      '</div>' +
    '</div>' +
    '<div class="sga-form-group">' +
      '<label class="sga-form-label">Nome <span class="sga-form-required">*</span> <span id="new-name-aibadge"></span></label>' +
      '<input id="new-name" class="sga-form-input" type="text" placeholder="Nome da empresa">' +
    '</div>' +
    '<div class="sga-form-row">' +
      '<div class="sga-form-group">' +
        '<label class="sga-form-label">Cidade</label>' +
        '<input id="new-city" class="sga-form-input" type="text" placeholder="Cidade">' +
      '</div>' +
      '<div class="sga-form-group">' +
        '<label class="sga-form-label">Estado</label>' +
        '<input id="new-state" class="sga-form-input" type="text" maxlength="2" placeholder="UF">' +
      '</div>' +
    '</div>' +
    '<div class="sga-form-group">' +
      '<label class="sga-form-label">Tipo de Cliente</label>' +
      '<select id="new-client-type" class="sga-form-select">' +
        _clientTypeOptions('') +
      '</select>' +
    '</div>' +
    '<div id="new-enrich-preview" style="display:none;margin-top:8px;padding:10px 12px;background:var(--sga-bg-surface-alt);border:1px solid var(--sga-border-default);border-radius:var(--sga-radius-sm);font-size:12px;color:var(--sga-text-default)"></div>'
  );
}

function _openNewCompanyModal() {
  _coNewModal = SGA.openModal({
    title: 'Nova Empresa',
    size: 'sm',
    body: _newCompanyFormHtml(),
    footer: [
      { label: 'Cancelar', variant: 'ghost', onClick: 'close' },
      { label: 'Cadastrar', variant: 'primary', primary: true, onClick: function () { _submitNewCompany(); return false; } }
    ],
    onClose: function () { _coNewModal = null; }
  });
}

// ---------------------------------------------------------------------------
// Enriquecimento de Empresa via IA (FB-17/18) — prefixo _compEnrich
// ---------------------------------------------------------------------------

function _compEnrichReset() {
  var status = document.getElementById('new-enrich-status');
  if (status) { status.textContent = ''; status.style.color = 'var(--sga-text-muted)'; }
  var preview = document.getElementById('new-enrich-preview');
  if (preview) { preview.style.display = 'none'; preview.innerHTML = ''; }
  var btn = document.getElementById('new-enrich-btn');
  if (btn) { btn.disabled = false; btn.innerHTML = '🔍 Enriquecimento de Dados'; }
  // Limpa badges 🤖 IA que possam ter ficado de tentativa anterior
  var badgeIds = ['new-name-aibadge'];
  for (var i = 0; i < badgeIds.length; i++) {
    var el = document.getElementById(badgeIds[i]);
    if (el) el.innerHTML = '';
  }
}

function _compEnrichClick() {
  var websiteEl = document.getElementById('new-website');
  if (!websiteEl) return;
  var website = websiteEl.value.trim();
  if (!website) {
    showAlert('Informe o website da empresa antes de enriquecer.', 'error');
    websiteEl.focus();
    return;
  }

  var btn = document.getElementById('new-enrich-btn');
  var status = document.getElementById('new-enrich-status');
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Buscando...'; }
  if (status) { status.textContent = 'Consultando IA, aguarde alguns segundos...'; status.style.color = 'var(--sga-text-muted)'; }

  google.script.run
    .withSuccessHandler(function(res) {
      if (!res || !res.ok) {
        var msg = (res && res.error) ? res.error : 'Falha desconhecida no enriquecimento.';
        showAlert('Erro ao enriquecer: ' + msg, 'error');
        if (status) { status.textContent = '❌ ' + msg; status.style.color = 'var(--sga-color-danger)'; }
        if (btn) { btn.disabled = false; btn.innerHTML = '🔍 Enriquecimento de Dados'; }
        return;
      }
      _compEnrichApply(res.data);
    })
    .withFailureHandler(function(err) {
      var msg = (err && err.message) ? err.message : 'Falha de comunicacao.';
      showAlert('Falha de comunicacao: ' + msg, 'error');
      if (status) { status.textContent = '❌ ' + msg; status.style.color = 'var(--sga-color-danger)'; }
      if (btn) { btn.disabled = false; btn.innerHTML = '🔍 Enriquecimento de Dados'; }
    })
    .Api_enrichCompanyFromWebsite(website);
}

/**
 * Aplica os dados retornados pela IA aos campos do form de Nova Empresa.
 * Campos que NAO existem no modal sao mostrados apenas no preview informativo.
 * NUNCA persiste — usuario revisa/edita e clica "Cadastrar".
 */
function _compEnrichApply(data) {
  if (!data) return;

  // Mapa campo-IA -> id do input no modal. Campos ausentes vao para o preview.
  var mapInputs = [
    { key: 'nome_fantasia',     inputId: 'new-name',  badgeId: 'new-name-aibadge', label: 'Nome' },
    { key: 'razao_social',      inputId: 'new-name',  badgeId: 'new-name-aibadge', label: 'Nome (razao social — fallback)' }
  ];

  var filled = [];   // campos que foram aplicados no form
  var notInForm = [];// campos retornados mas sem input correspondente

  // Aplica nome (prefere nome_fantasia, cai pra razao_social se vazio)
  var nameInput = document.getElementById('new-name');
  if (nameInput && !nameInput.value.trim()) {
    var nomeIA = String(data.nome_fantasia || '').trim() || String(data.razao_social || '').trim();
    if (nomeIA) {
      nameInput.value = nomeIA;
      _compEnrichBadge('new-name-aibadge');
      filled.push('Nome');
    }
  }

  // Cidade/Estado: tenta extrair do endereco se vier formatado "..., Cidade, UF, CEP"
  var cityInput  = document.getElementById('new-city');
  var stateInput = document.getElementById('new-state');
  var endereco   = String(data.endereco || '').trim();
  if (endereco && cityInput && stateInput) {
    var cidadeUF = _compEnrichParseCidadeUF(endereco);
    if (cidadeUF.cidade && !cityInput.value.trim()) {
      cityInput.value = cidadeUF.cidade;
      filled.push('Cidade');
    }
    if (cidadeUF.uf && !stateInput.value.trim()) {
      stateInput.value = cidadeUF.uf;
      filled.push('Estado');
    }
  }

  // Campos retornados que NAO tem input no modal — apenas mostra no preview
  var extras = [
    { k: 'razao_social',      lbl: 'Razao Social' },
    { k: 'cnpj',              lbl: 'CNPJ' },
    { k: 'descricao_empresa', lbl: 'Descricao' },
    { k: 'endereco',          lbl: 'Endereco' },
    { k: 'telefone',          lbl: 'Telefone' },
    { k: 'email',             lbl: 'E-mail' },
    { k: 'setor',             lbl: 'Setor' },
    { k: 'fontes_consultadas',lbl: 'Fontes' }
  ];
  for (var i = 0; i < extras.length; i++) {
    var v = String(data[extras[i].k] || '').trim();
    if (v) notInForm.push({ label: extras[i].lbl, value: v });
  }

  // Renderiza preview informativo
  var preview = document.getElementById('new-enrich-preview');
  if (preview) {
    var html = '<div style="font-weight:600;margin-bottom:6px">🤖 Dados encontrados pela IA</div>';
    if (filled.length) {
      html += '<div style="margin-bottom:6px;color:var(--sga-color-success)">✓ Aplicados no formulario: ' + escapeHtml(filled.join(', ')) + '</div>';
    }
    if (notInForm.length) {
      html += '<div style="margin-bottom:4px;color:var(--sga-text-muted)">Informacoes adicionais (revise e copie se necessario):</div>';
      html += '<ul style="margin:4px 0 0 18px;padding:0">';
      for (var j = 0; j < notInForm.length; j++) {
        html += '<li><strong>' + escapeHtml(notInForm[j].label) + ':</strong> ' + escapeHtml(notInForm[j].value) + '</li>';
      }
      html += '</ul>';
    }
    if (data.tokens_usados) {
      html += '<div style="margin-top:6px;color:var(--sga-text-soft);font-size:11px">Tokens usados: ' + escapeHtml(String(data.tokens_usados)) + '</div>';
    }
    preview.innerHTML = html;
    preview.style.display = '';
  }

  var status = document.getElementById('new-enrich-status');
  if (status) {
    status.textContent = '✓ Dados encontrados. Revise e edite antes de cadastrar.';
    status.style.color = 'var(--sga-color-success)';
  }
  var btn = document.getElementById('new-enrich-btn');
  if (btn) { btn.disabled = false; btn.innerHTML = '🔄 Buscar novamente'; }
}

function _compEnrichBadge(badgeId) {
  var el = document.getElementById(badgeId);
  if (!el) return;
  el.innerHTML = '<span class="sga-badge sga-badge--info" style="margin-left:6px">🤖 IA</span>';
}

/**
 * Tenta extrair { cidade, uf } de uma string de endereco brasileira.
 * Heuristica simples: procura padrao ", Cidade, UF" ou "Cidade - UF" perto do final.
 */
function _compEnrichParseCidadeUF(endereco) {
  var out = { cidade: '', uf: '' };
  if (!endereco) return out;

  // Padrao "Cidade - UF" ou "Cidade/UF"
  var m = endereco.match(/([A-Za-zÀ-ÿ' .]+?)\s*[-/]\s*([A-Z]{2})\b/);
  if (m) {
    out.cidade = m[1].replace(/^,\s*/, '').trim();
    out.uf = m[2];
    return out;
  }
  // Padrao "..., Cidade, UF, CEP" — pega ultimos dois tokens nao-CEP
  var parts = endereco.split(',');
  for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i].trim();
    var ufMatch = p.match(/\b([A-Z]{2})\b/);
    if (ufMatch && !out.uf) {
      out.uf = ufMatch[1];
      if (i - 1 >= 0) out.cidade = parts[i - 1].trim();
      break;
    }
  }
  return out;
}

function _submitNewCompany() {
  var name       = document.getElementById('new-name').value.trim();
  var city       = document.getElementById('new-city').value.trim();
  var state      = document.getElementById('new-state').value.trim().toUpperCase();
  var clientType = document.getElementById('new-client-type').value;

  if (!name) { showAlert('Nome é obrigatório', 'error'); return; }

  setLoading(true);
  google.script.run
    .withSuccessHandler(function(res) {
      setLoading(false);
      if (!res.ok) { showAlert('Erro ao cadastrar: ' + res.error, 'error'); return; }
      showAlert('Empresa cadastrada com sucesso (ID: ' + res.id + ')', 'success');
      _closeNewModalDirect();
      _loadCompanies();
    })
    .withFailureHandler(function(err) {
      setLoading(false);
      showAlert('Falha de comunicação: ' + err.message, 'error');
    })
    .Api_createCompany({ name: name, city: city, state: state, client_type: clientType });
}

function _closeNewModalDirect() {
  if (_coNewModal) _coNewModal.close();
}

// ---------------------------------------------------------------------------
// Shared helpers
// ---------------------------------------------------------------------------

function _clientTypeOptions(selected) {
  var types = ['', 'Empresa', 'Órgão', 'Produtor', 'Cooperativa'];
  var labels = ['— Selecione —', 'Empresa', 'Órgão', 'Produtor', 'Cooperativa'];
  var html = '';
  for (var i = 0; i < types.length; i++) {
    var sel = (String(selected) === String(types[i])) ? ' selected' : '';
    html += '<option value="' + escapeHtml(types[i]) + '"' + sel + '>' + escapeHtml(labels[i]) + '</option>';
  }
  return html;
}

/* ===========================================================================
   VISÃO 360 DA EMPRESA — tudo do cliente em um painel (prefixo _c360)
   =========================================================================== */

function _c360Open(companyId) {
  // v2: a Visão 360 virou seção própria (workspace completo)
  _closeDetailModalDirect();
  open360(companyId);
}
